name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Cut the changelog excerpt for this tag
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 == "## " v {p=1; next} p && /^## / {exit} p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release ${GITHUB_REF_NAME}" > notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release is often created by hand before the tag push finishes: do nothing then (a red run here only generated failure mails).
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; leaving it as it is."
            exit 0
          fi
          pre=""
          case "$GITHUB_REF_NAME" in *-rc.*|*-beta*|*-alpha*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" $pre --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
