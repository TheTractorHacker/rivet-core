name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'   # weekly: runs the optional benchmark job
permissions:
  contents: read
jobs:
  test:
    name: php ${{ matrix.php }} / ${{ matrix.db }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        db: ['mariadb:11']
        health: ['healthcheck.sh --connect --innodb_initialized']
        include:
          - { php: '8.4', db: 'mariadb:10.11', health: 'healthcheck.sh --connect --innodb_initialized' }
          - { php: '8.4', db: 'mysql:8.0', health: 'mysqladmin ping -h 127.0.0.1 -proot --silent' }
          - { php: '8.4', db: 'mysql:8.4', health: 'mysqladmin ping -h 127.0.0.1 -proot --silent' }
    services:
      database:
        image: ${{ matrix.db }}
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: rivetcore_test
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: rivetcore_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="${{ matrix.health }}"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7
        ports: ['6391:6379']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, zip, dom, mbstring
          tools: composer
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: composer install --no-interaction --prefer-dist
      - run: composer validate
      - run: composer lint
      - name: Core must not reference mysqli or request globals
        run: |
          ! grep -rnE 'mysqli|global \$mysqli|\$GLOBALS|\$_SESSION|\$_SERVER|getRedisClient|lookupUserPermission|enforceClientAccess' src
      - run: vendor/bin/phpunit
        env:
          RIVETCORE_TEST_DB_HOST: 127.0.0.1
          RIVETCORE_TEST_DB_NAME: rivetcore_test
          RIVETCORE_TEST_DB_USER: root
          RIVETCORE_TEST_DB_PASS: root
          RIVETCORE_TEST_REDIS_PORT: '6391'
      - name: Every PHP sample in the docs runs
        run: php scripts/check-doc-samples.php
        env:
          RIVETCORE_TEST_DB_HOST: 127.0.0.1
          RIVETCORE_TEST_DB_NAME: rivetcore_test
          RIVETCORE_TEST_DB_USER: root
          RIVETCORE_TEST_DB_PASS: root
          RIVETCORE_TEST_REDIS_PORT: '6391'

  lowest:
    name: lowest supported dependencies
    runs-on: ubuntu-latest
    services:
      database:
        image: mariadb:11
        env: { MARIADB_ROOT_PASSWORD: root, MARIADB_DATABASE: rivetcore_test }
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.2', extensions: 'mysqli, zip, dom, mbstring', tools: composer }
      - run: composer update --prefer-lowest --prefer-stable --no-interaction --prefer-dist
      - run: vendor/bin/phpunit
        env:
          RIVETCORE_TEST_DB_HOST: 127.0.0.1
          RIVETCORE_TEST_DB_NAME: rivetcore_test
          RIVETCORE_TEST_DB_USER: root
          RIVETCORE_TEST_DB_PASS: root

  static:
    name: static analysis and dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.4', extensions: 'mysqli, zip, dom, mbstring', tools: composer }
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - run: composer audit

  coverage:
    runs-on: ubuntu-latest
    services:
      database:
        image: mariadb:11
        env: { MARIADB_ROOT_PASSWORD: root, MARIADB_DATABASE: rivetcore_test }
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7
        ports: ['6391:6379']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.4', extensions: 'mysqli, zip, dom, mbstring', coverage: pcov, tools: composer }
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/phpunit --coverage-clover coverage.xml --coverage-text
        env:
          RIVETCORE_TEST_DB_HOST: 127.0.0.1
          RIVETCORE_TEST_DB_NAME: rivetcore_test
          RIVETCORE_TEST_DB_USER: root
          RIVETCORE_TEST_DB_PASS: root
          RIVETCORE_TEST_REDIS_PORT: '6391'
      - name: Coverage gate (everything except the DOCX/PDF converters)
        run: php scripts/coverage-gate.php coverage.xml 85

  compatibility:
    name: backward compatibility with the last tag
    runs-on: ubuntu-latest
    # Advisory while the API is 0.x (a minor may break it, and the changelog says so); becomes required at 1.0.0.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.4', extensions: 'mysqli, zip, dom, mbstring', tools: composer }
      - run: composer install --no-interaction --prefer-dist
      # Needs PHP 8.4+, so it is installed here instead of being a dev dependency (which would break installs on 8.2 and 8.3).
      - run: composer require --dev --no-interaction roave/backward-compatibility-check
      - run: vendor/bin/roave-backward-compatibility-check --from="$(git tag -l 'v[0-9]*' --sort=-v:refname | head -1)" --to=HEAD

  api-surface:
    name: public API surface (fails on unreviewed changes)
    runs-on: ubuntu-latest
    services:
      database:
        image: mariadb:11
        env: { MARIADB_ROOT_PASSWORD: root, MARIADB_DATABASE: rivetcore_test }
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.4', extensions: 'mysqli, zip, dom, mbstring', tools: composer }
      - run: composer install --no-interaction --prefer-dist
      # Compares types, signatures, constants, migrations, vocabularies and table columns with tests/api-surface.json.
      # To accept an intended change: php scripts/api-surface-check.php --update, review the diff, record it in CHANGELOG.md.
      - run: php scripts/api-surface-check.php
        env:
          RIVETCORE_TEST_DB_HOST: 127.0.0.1
          RIVETCORE_TEST_DB_NAME: rivetcore_test
          RIVETCORE_TEST_DB_USER: root
          RIVETCORE_TEST_DB_PASS: root
      - name: docs/PUBLIC-API.md lists every public type
        run: php scripts/public-api-table.php --write && git diff --exit-code docs/PUBLIC-API.md

  smoke-syntax:
    name: browser smoke specs parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # Syntax only: the specs need a live scratch edition to run (see tests/smoke/README.md).
      - run: cd tests/smoke && npm run check

  bench:
    name: performance regression check (optional - weekly and on demand)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true   # shared runners are noisy; thresholds are deliberately generous and a miss is a prompt to look, not a gate
    services:
      database:
        image: mariadb:11
        env: { MARIADB_ROOT_PASSWORD: root, MARIADB_DATABASE: rivetcore_bench }
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7
        ports: ['6391:6379']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.4', extensions: 'mysqli, zip, dom, mbstring', tools: composer }
      - run: composer install --no-interaction --prefer-dist
      - run: php bench/run.php --runs=3 --json=bench-result.json --check=bench/thresholds.json
        env:
          RIVETCORE_BENCH_DB_HOST: 127.0.0.1
          RIVETCORE_BENCH_DB_NAME: rivetcore_bench
          RIVETCORE_BENCH_DB_USER: root
          RIVETCORE_BENCH_DB_PASS: root
          RIVETCORE_BENCH_REDIS_PORT: '6391'
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: bench-result, path: bench-result.json }
