<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif;background:#eef2f2}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>RMM Asset Page</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout concept: a two-column asset page (facts rail + working column) under a health strip, mirroring the RivetIT shell.
   Colour: RivetIT's teal-on-cool-grey tokens for chrome; the dataviz reference palette (blue, orange, aqua) for series;
   status colours (green, amber, orange, red) are reserved for state and always paired with an icon and a word. */
:root {
  --sans: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --bg: #eef2f2; --surface: #ffffff; --surface-2: #f5f8f8; --border: #e3e9ea; --border-strong: #cdd7d9;
  --ink: #16232a; --ink-2: #3c4d55; --muted: #5d6f76; --faint: #8a9aa0;
  --primary: #0d9488; --primary-ink: #0b6f66; --primary-soft: #e0f4f1;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
  --good: #0ca30c; --good-ink: #00600a; --good-soft: #e3f5e3;
  --warn: #fab219; --warn-ink: #7a4b00; --warn-soft: #fff1d1;
  --serious: #ec835a; --crit: #d03b3b; --crit-ink: #a52424; --crit-soft: #fde8e8;
  --off-soft: #e8eded; --grid: #e6ecec; --axis: #b9c6c9;
  --shadow: 0 1px 2px rgba(20,35,42,.04), 0 3px 10px rgba(20,35,42,.05);
  --r: 12px; --r-sm: 8px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1615; --surface: #14201f; --surface-2: #192827; --border: #243433; --border-strong: #35494a;
  --ink: #e5eeee; --ink-2: #c3d2d2; --muted: #9ab0b0; --faint: #6f8686;
  --primary: #2dd4bf; --primary-ink: #5eead4; --primary-soft: #12332f;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70;
  --good: #0ca30c; --good-ink: #6fdc6f; --good-soft: #15321a;
  --warn-ink: #f6c25a; --warn-soft: #3a2d0c; --crit: #e0504f; --crit-ink: #ff8f8e; --crit-soft: #3d1b1b;
  --off-soft: #223130; --grid: #223231; --axis: #3b5051;
  --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e1615; --surface: #14201f; --surface-2: #192827; --border: #243433; --border-strong: #35494a;
  --ink: #e5eeee; --ink-2: #c3d2d2; --muted: #9ab0b0; --faint: #6f8686;
  --primary: #2dd4bf; --primary-ink: #5eead4; --primary-soft: #12332f;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70;
  --good: #0ca30c; --good-ink: #6fdc6f; --good-soft: #15321a;
  --warn-ink: #f6c25a; --warn-soft: #3a2d0c; --crit: #e0504f; --crit-ink: #ff8f8e; --crit-soft: #3d1b1b;
  --off-soft: #223130; --grid: #223231; --axis: #3b5051;
  --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.45; margin: 0; }
h1, h2, h3, h4 { margin: 0; font-weight: 600; text-wrap: balance; }
button, select, input { font: inherit; color: inherit; }
a { color: var(--primary-ink); }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: .92em; }
.muted { color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 4px; }

/* mockup controls (not part of the product page) */
.mock { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--ink); color: var(--bg); padding: 8px 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-size: 12.5px; }
.mock b { font-weight: 600; letter-spacing: .04em; text-transform: uppercase; font-size: 11px; opacity: .75; }
.mock .grp { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.mock select { background: var(--surface); color: var(--ink); border: 1px solid var(--border-strong); border-radius: 6px; padding: 3px 6px; }
.mock label { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
.mock-note { padding: 6px 16px; font-size: 12px; color: var(--muted); background: var(--surface-2); border-bottom: 1px solid var(--border); }

.page { max-width: 1320px; margin: 0 auto; padding: 16px; }
.crumbs { font-size: 12.5px; color: var(--muted); margin-bottom: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
.layout { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 960px) { .layout { grid-template-columns: minmax(0, 1fr); } }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); box-shadow: var(--shadow); min-width: 0; }
.card > header, .card-h { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.card h2, .card h3 { font-size: 14.5px; }
.card .body { padding: 14px 16px; }
.card .sub { color: var(--muted); font-size: 12.5px; }
.grow { margin-left: auto; }
.stack { display: grid; gap: 16px; min-width: 0; }

/* rail */
.rail dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 13px; }
.rail dt { color: var(--muted); } .rail dd { margin: 0; text-align: right; overflow-wrap: anywhere; }
.rail .sec { padding: 12px 16px; border-top: 1px solid var(--border); }
.rail .sec:first-child { border-top: 0; }
.rail h3 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 8px; }
.rail-toggle { display: none; }
@media (max-width: 960px) { .rail-body[hidden-mobile] { display: none; } .rail-toggle { display: inline-flex; } }

/* chips, pills, buttons */
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px 2px 7px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; border: 1px solid transparent; }
.pill svg { width: 13px; height: 13px; flex: none; }
.pill.ok { background: var(--good-soft); color: var(--good-ink); }
.pill.warn { background: var(--warn-soft); color: var(--warn-ink); }
.pill.crit { background: var(--crit-soft); color: var(--crit-ink); }
.pill.off { background: var(--off-soft); color: var(--ink-2); }
.pill.info { background: var(--primary-soft); color: var(--primary-ink); }
.chip { display: inline-block; padding: 1px 8px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--border); font-size: 12px; color: var(--ink-2); }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: var(--r-sm); border: 1px solid var(--border-strong); background: var(--surface); cursor: pointer; font-weight: 500; font-size: 13px; line-height: 1.2; }
.btn svg { width: 15px; height: 15px; flex: none; }
.btn:hover:not(:disabled) { background: var(--surface-2); }
.btn.primary { background: var(--primary-ink); border-color: var(--primary-ink); color: #fff; }
:root[data-theme="dark"] .btn.primary { color: #06201c; background: var(--primary); border-color: var(--primary); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #06201c; background: var(--primary); border-color: var(--primary); } }
.btn.danger { border-color: var(--crit); color: var(--crit-ink); }
.btn.sm { padding: 3px 9px; font-size: 12.5px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.menu { position: relative; }
.menu > summary { list-style: none; } .menu > summary::-webkit-details-marker { display: none; }
.menu-list { position: absolute; right: 0; top: calc(100% + 4px); min-width: 220px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--r-sm); box-shadow: 0 8px 24px rgba(0,0,0,.18); padding: 4px; z-index: 10; display: grid; }
.menu-list button { text-align: left; background: none; border: 0; padding: 7px 10px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; }
.menu-list button:hover:not(:disabled) { background: var(--surface-2); } .menu-list button:disabled { opacity: .5; cursor: not-allowed; }
.menu-list hr { border: 0; border-top: 1px solid var(--border); margin: 4px 0; width: 100%; }
.ph { display: none; margin-left: 6px; padding: 0 6px; border-radius: 4px; background: var(--primary-soft); color: var(--primary-ink); font-size: 10.5px; font-weight: 600; letter-spacing: .04em; vertical-align: middle; border: 1px dashed var(--primary); }
body.show-phases .ph { display: inline-block; }

/* health strip */
.strip { padding: 14px 16px; display: grid; gap: 12px; }
.strip-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.strip-top h1 { font-size: 20px; }
.dot { width: 11px; height: 11px; border-radius: 50%; flex: none; background: var(--faint); box-shadow: 0 0 0 3px var(--off-soft); }
.dot.ok { background: var(--good); box-shadow: 0 0 0 3px var(--good-soft); } .dot.crit { background: var(--crit); box-shadow: 0 0 0 3px var(--crit-soft); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 16px; margin: 0; }
.facts div { min-width: 0; } .facts dt { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.facts dd { margin: 2px 0 0; font-weight: 500; overflow-wrap: anywhere; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

/* banners */
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border-radius: var(--r-sm); border: 1px solid var(--border-strong); background: var(--surface-2); font-size: 13px; }
.banner svg { width: 18px; height: 18px; flex: none; margin-top: 1px; }
.banner.off { border-color: var(--crit); background: var(--crit-soft); }
.banner.warn { border-color: var(--warn); background: var(--warn-soft); }
.banner.info { border-color: var(--primary); background: var(--primary-soft); }

/* tabs */
.tabs { display: flex; gap: 2px; overflow-x: auto; border-bottom: 1px solid var(--border); padding: 0 8px; scrollbar-width: thin; }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 11px 12px; cursor: pointer; white-space: nowrap; color: var(--muted); font-weight: 500; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--primary); }
.tabs button:hover { color: var(--ink); }
.tabs .sep { width: 1px; background: var(--border); margin: 8px 6px; flex: none; }
.count { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--off-soft); font-size: 11.5px; text-align: center; margin-left: 4px; }

/* gauges */
.gauges { display: grid; grid-template-columns: repeat(auto-fit, minmax(158px, 1fr)); gap: 12px; padding: 14px 16px; }
.tile { border: 1px solid var(--border); border-radius: var(--r-sm); padding: 10px 12px; display: grid; gap: 4px; justify-items: center; text-align: center; background: var(--surface); min-width: 0; position: relative; }
.tile.stat { justify-items: start; text-align: left; align-content: start; }
.tile .lbl { font-weight: 600; font-size: 13px; } .tile .cap { font-size: 12px; color: var(--muted); }
.tile.dim svg.g { opacity: .45; }
.tile .big { font-size: 22px; font-weight: 600; line-height: 1.1; }
.tile .stale-chip { font-size: 11px; color: var(--ink-2); background: var(--off-soft); border-radius: 999px; padding: 1px 8px; }
svg.g { width: 112px; height: 96px; display: block; }
.g .track { stroke: var(--border-strong); } .g .val { font: 600 21px var(--sans); fill: var(--ink); } .g .unit { font: 500 11px var(--sans); fill: var(--muted); }
.bar { height: 8px; border-radius: 4px; background: var(--off-soft); overflow: hidden; display: flex; gap: 2px; width: 100%; }
.bar > i { display: block; height: 100%; border-radius: 3px; }
.seg { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 2px; width: 100%; height: 8px; }
.seg i { background: var(--off-soft); border-radius: 3px; } .seg i.on { background: var(--good); } .seg i.on.w { background: var(--warn); } .seg i.on.c { background: var(--crit); }
.empty { padding: 22px 16px; text-align: center; color: var(--muted); display: grid; gap: 6px; justify-items: center; }
.empty strong { color: var(--ink); font-size: 14px; }

/* charts */
.rangebar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--border); }
.seg-btn { display: inline-flex; border: 1px solid var(--border-strong); border-radius: var(--r-sm); overflow: hidden; }
.seg-btn button { border: 0; background: var(--surface); padding: 5px 11px; cursor: pointer; font-size: 12.5px; border-right: 1px solid var(--border-strong); }
.seg-btn button:last-child { border-right: 0; }
.seg-btn button[aria-pressed="true"] { background: var(--primary-ink); color: #fff; }
:root[data-theme="dark"] .seg-btn button[aria-pressed="true"] { background: var(--primary); color: #06201c; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .seg-btn button[aria-pressed="true"] { background: var(--primary); color: #06201c; } }
.rangebar input[type=date] { background: var(--surface); border: 1px solid var(--border-strong); border-radius: 6px; padding: 3px 6px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); align-items: center; }
.legend .k { display: inline-flex; align-items: center; gap: 5px; } .legend .ln { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
.charts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; padding: 14px 16px; }
@media (max-width: 1100px) { .charts { grid-template-columns: minmax(0, 1fr); } }
.chart { border: 1px solid var(--border); border-radius: var(--r-sm); padding: 10px 12px 8px; min-width: 0; transition: opacity .15s; }
.chart-h { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
.chart-h h3 { font-size: 13.5px; } .chart-h .now { font-weight: 600; }
.chart-host { position: relative; } .chart-host svg { display: block; width: 100%; }
.chart text { font: 11px var(--sans); fill: var(--muted); }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 8px; padding: 7px 10px; font-size: 12px; box-shadow: 0 6px 18px rgba(0,0,0,.18); z-index: 5; min-width: 150px; display: none; }
.tip .t { color: var(--muted); margin-bottom: 3px; } .tip .r { display: flex; align-items: center; gap: 6px; } .tip .r b { margin-left: auto; padding-left: 12px; font-weight: 600; }
.tip .k { width: 12px; height: 3px; border-radius: 2px; display: inline-block; }
details.data { margin-top: 4px; font-size: 12px; } details.data summary { cursor: pointer; color: var(--primary-ink); width: max-content; }
.res { font-size: 11.5px; color: var(--faint); }

/* tables */
.tw { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; padding: 8px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; background: var(--surface-2); }
td { padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tr.sev-crit td:first-child { box-shadow: inset 3px 0 0 var(--crit); } tr.sev-warn td:first-child { box-shadow: inset 3px 0 0 var(--warn); }
.spark { width: 96px; height: 24px; display: block; }
.strip24 { display: flex; gap: 2px; align-items: center; } .strip24 i { width: 4px; height: 14px; border-radius: 2px; background: var(--good); } .strip24 i.w { background: var(--warn); } .strip24 i.c { background: var(--crit); } .strip24 i.n { background: var(--off-soft); }
pre.out { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 10px 12px; margin: 0; max-height: 220px; overflow: auto; font-family: var(--mono); font-size: 12.5px; white-space: pre-wrap; }
.two { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 16px; }
.two.even { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 1100px) { .two, .two.even { grid-template-columns: minmax(0, 1fr); } }
.list { list-style: none; margin: 0; padding: 0; } .list li { padding: 10px 16px; border-bottom: 1px solid var(--border); display: flex; gap: 10px; align-items: flex-start; } .list li:last-child { border-bottom: 0; }
.list .m { flex: 1; min-width: 0; } .list .when { color: var(--muted); font-size: 12px; white-space: nowrap; }
.tl li { position: relative; }
.ico { width: 26px; height: 26px; border-radius: 50%; background: var(--off-soft); display: grid; place-items: center; flex: none; } .ico svg { width: 14px; height: 14px; }
.search { background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--r-sm); padding: 5px 10px; min-width: 200px; }

/* fleet */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.kpi { padding: 12px 14px; display: grid; gap: 2px; } .kpi .n { font-size: 26px; font-weight: 600; line-height: 1.1; } .kpi .l { color: var(--muted); font-size: 12.5px; } .kpi .d { font-size: 12px; }
.donut-wrap { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; padding: 14px 16px; }
.donut-wrap ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; } .donut-wrap li { display: flex; gap: 8px; align-items: center; }
.sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.minibar { display: inline-flex; align-items: center; gap: 6px; min-width: 84px; } .minibar .bar { width: 44px; height: 6px; } .minibar span { font-size: 12.5px; min-width: 32px; }
.bl { display: grid; gap: 8px; padding: 14px 16px; } .bl .row { display: grid; grid-template-columns: 130px 1fr auto; gap: 8px; align-items: center; font-size: 13px; }
.bulk { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--surface-2); }
a.dev { font-weight: 600; text-decoration: none; cursor: pointer; } a.dev:hover { text-decoration: underline; }
dialog { border: 1px solid var(--border-strong); border-radius: var(--r); background: var(--surface); color: var(--ink); padding: 0; max-width: min(480px, calc(100vw - 32px)); width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
dialog::backdrop { background: rgba(0,0,0,.45); }
dialog form { display: grid; gap: 12px; padding: 16px; } dialog h3 { font-size: 16px; }
dialog label { display: grid; gap: 4px; font-size: 13px; } dialog select, dialog input[type=number] { background: var(--surface); border: 1px solid var(--border-strong); border-radius: 6px; padding: 6px 8px; }
.toast { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 8px; z-index: 50; max-width: calc(100vw - 32px); font-size: 13px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@media (max-width: 600px) { .actions { margin-left: 0; } .mock { position: static; } .bl .row { grid-template-columns: 96px 1fr auto; } }
</style>

<div class="mock" role="region" aria-label="Mockup controls">
  <b>Mockup</b>
  <div class="grp"><label for="c-view">View</label><select id="c-view"><option value="asset">Asset page</option><option value="fleet">Fleet RMM dashboard</option></select></div>
  <div class="grp" id="g-dev"><label for="c-dev">Device</label><select id="c-dev"><option value="win">DEMO-WIN-SRV01 (healthy Windows server)</option><option value="lnx">DEMO-LNX-DB02 (Linux, failing disk)</option></select></div>
  <div class="grp" id="g-state"><label for="c-state">State</label><select id="c-state"><option value="online">Online</option><option value="offline">Offline</option><option value="never">Never checked in</option><option value="off">RMM module off</option></select></div>
  <div class="grp"><label for="c-ed">Edition</label><select id="c-ed"><option value="it">RivetIT (Metrics subsystem)</option><option value="msp">RivetMSP (no Metrics yet)</option></select></div>
  <div class="grp"><label for="c-role">Role</label><select id="c-role"><option value="admin">Administrator</option><option value="tech">Technician</option><option value="view">Read-only</option></select></div>
  <label><input type="checkbox" id="c-patch"> Patching sub-switch</label>
  <label><input type="checkbox" id="c-ph"> Phase badges</label>
  <div class="grp"><label for="c-theme">Theme</label><select id="c-theme"><option value="auto">Match system</option><option value="light">Light</option><option value="dark">Dark</option></select></div>
</div>
<div class="mock-note">Design mockup for the asset page and fleet RMM dashboard. All names, addresses and numbers are fictional sample data; nothing here is connected to a server.</div>
<div class="page"><main id="root"></main></div>
<dialog id="dlg" aria-labelledby="dlg-t"></dialog>
<div id="toast" class="toast" role="status" hidden></div>

<script>
(function () {

    '<section class="card" aria-label="Needs reboot"><header><h2>Needs reboot' + (S.patch ? ' or patching' : '') + '</h2></header><ul class="list">' + reb.map(function (f) { return '<li><div class="m"><strong>' + esc(f.host) + '</strong><div class="muted" style="font-size:12px">' + esc(f.client) + '</div></div>' + pill('warn', 'Reboot pending') + '</li>'; }).join('') + (S.patch ? '<li><div class="m"><strong>3 devices with pending patches</strong> ' + ph('P4') + '</div></li>' : '') + '</ul></section></div>' +
    (S.role === 'admin' ? '<section class="card" aria-label="Capacity"><header><h2>Performance and capacity</h2><span class="sub">Administrators only. From the module capacity report.</span><span class="grow">' + pill('ok', 'Shed level 0: normal') + '</span></header><div class="gauges"><div class="tile stat"><div class="cap">Enrolled devices</div><div class="big num">14 <span class="muted" style="font-size:14px">of 500</span></div><div class="bar" role="img" aria-label="14 of 500 devices"><i style="width:2.8%;background:var(--s1)"></i></div></div><div class="tile stat"><div class="cap">Check-ins, last minute</div><div class="big num">3</div><div class="cap">168 in the last hour</div></div><div class="tile stat"><div class="cap">Check-in latency p95</div><div class="big num">84 ms</div><div class="cap">release gate: under 250 ms</div></div><div class="tile stat"><div class="cap">Ingest mode</div><div class="big">Direct</div><div class="cap">queue empty, oldest 0 s</div></div><div class="tile stat"><div class="cap">Projected write rate</div><div class="big num">0.8 rows/s</div><div class="cap">raw samples kept 7 days</div></div></div></section>' : '') +
    '<section class="card" aria-label="Devices"><header><h2>Devices</h2><label class="sr" for="f-q">Filter devices</label><input class="search" id="f-q" type="search" placeholder="Filter by name, client or OS"><span class="sub grow">' + F.length + ' devices</span></header>' +
    '<div class="bulk"><strong>' + nsel + ' selected</strong><button class="btn sm" data-a="bulk"' + (nsel && can('run') ? '' : ' disabled') + '>' + ic('play') + 'Run script</button><button class="btn sm danger" data-a="bulk"' + (nsel && can('run') ? '' : ' disabled') + '>' + ic('power') + 'Reboot</button><button class="btn sm" data-a="bulk"' + (nsel && can('run') ? '' : ' disabled') + '>Tag ' + ph('P1') + '</button>' + (can('run') ? '' : '<span class="muted">Your role cannot run bulk actions.</span>') + '</div>' +
    '<div class="tw"><table id="fleet"><thead><tr><th><input type="checkbox" data-all aria-label="Select all"></th><th>Status</th><th>Device</th><th>CPU</th><th>Memory</th><th>Worst disk</th><th>CPU, 24 h</th><th>Alerts</th><th>Flags</th><th>Last seen</th></tr></thead><tbody>' + rows + '</tbody></table></div></section></div>';
}

/* ---------- render + events ---------- */
function render() {
  document.body.classList.toggle('show-phases', S.ph);
  $('#g-dev').style.display = S.view === 'asset' ? '' : 'none';
  $('#root').innerHTML = S.view === 'asset' ? assetView() : fleetView();
  drawCharts();
}
function toast(msg) { var t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(function () { t.hidden = true; }, 3200); }
function dialog(html, onOk) { var d = $('#dlg'); d.innerHTML = '<form method="dialog">' + html + '</form>'; d.showModal(); var f = $('form', d); f.addEventListener('submit', function (e) { e.preventDefault(); var ok = e.submitter && e.submitter.value === 'ok'; d.close(); if (ok && onOk) { onOk(f); } }); }
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-a],[data-tab],[data-r],[data-open]'); if (!el) { return; }
  if (el.dataset.tab) { S.tab = el.dataset.tab; render(); return; }
  if (el.dataset.r) { S.range = el.dataset.r; if (S.range === 'custom' && !S.from) { S.to = new Date(NOW).toISOString().slice(0, 10); S.from = new Date(NOW - 10 * 86400000).toISOString().slice(0, 10); } render(); return; }
  if (el.dataset.open !== undefined) { if (el.dataset.open) { S.view = 'asset'; S.dev = el.dataset.open; S.tab = 'overview'; $('#c-view').value = 'asset'; $('#c-dev').value = S.dev; render(); window.scrollTo(0, 0); } else { toast('Sample device: only the two demo devices open a full page.'); } return; }
  var a = el.dataset.a, dv = DEV[S.dev];
  if (a === 'rail') { S.rail = !S.rail; render(); }
  else if (a === 'applyrange') { S.from = $('#r-from').value; S.to = $('#r-to').value; render(); }
  else if (a === 'out') { var row = $('#out-' + el.dataset.i); row.hidden = !row.hidden; el.setAttribute('aria-expanded', String(!row.hidden)); el.textContent = row.hidden ? 'View output' : 'Hide output'; }
  else if (a === 'reboot') { dialog('<h3 id="dlg-t">Reboot ' + esc(dv.host) + '?</h3><p class="muted" style="margin:0">The device restarts after 30 seconds. Users on it lose unsaved work. This job is sent at most once and cannot be undone.</p><label><span>Delay (seconds)</span><input type="number" min="5" max="3600" value="30"></label><label style="display:flex;gap:8px;align-items:center;grid-template-columns:none"><input type="checkbox" id="cf" required> I confirm this reboot.</label><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" value="cancel" formnovalidate>Cancel</button><button class="btn danger" value="ok">Queue reboot</button></div>', function () { toast('Mock: reboot job queued for ' + dv.host + '.'); }); }
  else if (a === 'runscript') { dialog('<h3 id="dlg-t">Run script on ' + esc(dv.host) + '</h3><label><span>Saved script</span><select><option>Clear temp files</option><option>Check BitLocker status</option><option>Restart Print Spooler</option></select></label><label><span>Timeout (seconds)</span><input type="number" min="1" max="3600" value="300"></label><p class="muted" style="margin:0;font-size:12.5px">Runs as SYSTEM. Output is size-capped and has secrets redacted. Free-form scripts need the "run script" permission' + (S.role === 'admin' || S.role === 'tech' ? '' : ' (not granted)') + '.</p><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" value="cancel">Cancel</button><button class="btn primary" value="ok">Queue job</button></div>', function () { toast('Mock: script job queued. It will appear under Jobs.'); }); }
  else if (a === 'remote') { toast('Mock: would mint a single-use MeshCentral login and open it in a new tab (audited).'); }
  else if (a === 'ticket') { toast('Mock: ticket form opens, prefilled with this device and its open alerts.'); }
  else if (a === 'collect') { toast('Mock: inventory collection queued.'); }
  else if (a === 'ack') { toast('Mock: alert acknowledged.'); }
  else if (a === 'rerun') { toast('Mock: same job queued again.'); }
  else if (a === 'copy' || a === 'copyout') { toast('Copied (mock).'); }
  else if (a === 'admin' || a === 'bulk' || a === 'tag' || a === 'nav') { toast('Mock: ' + (a === 'admin' ? 'administrator action' : a === 'bulk' ? 'bulk action on selected devices' : a === 'tag' ? 'tag picker (Phase 1)' : 'opens the alerts list filtered to this device') + '.'); }
  if (el.closest('.menu') && !el.matches('summary')) { var m = el.closest('.menu'); m.removeAttribute('open'); }
});
document.addEventListener('change', function (e) {
  var t = e.target;
  if (t.dataset && t.dataset.sel !== undefined) { S.sel[t.dataset.sel] = t.checked; render(); }
  else if (t.hasAttribute && t.hasAttribute('data-all')) { FLEET.forEach(function (f, i) { S.sel[i] = t.checked; }); render(); }
});
document.addEventListener('input', function (e) {
  var q = e.target.id === 'sw-q' ? '#sw' : e.target.id === 'f-q' ? '#fleet' : null; if (!q) { return; }
  var v = e.target.value.toLowerCase(); $$(q + ' tbody tr').forEach(function (tr) { tr.hidden = v && tr.textContent.toLowerCase().indexOf(v) < 0; });
});
document.addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target.matches && e.target.matches('a.dev')) { e.target.click(); } });
function bind(id, key, fn) { $(id).addEventListener('change', function (e) { S[key] = e.target.type === 'checkbox' ? e.target.checked : e.target.value; if (fn) { fn(); } render(); }); }
bind('#c-view', 'view'); bind('#c-dev', 'dev'); bind('#c-state', 'state'); bind('#c-ed', 'ed'); bind('#c-role', 'role'); bind('#c-patch', 'patch', function () { if (!S.patch && S.tab === 'patches') { S.tab = 'overview'; } }); bind('#c-ph', 'ph');
$('#c-theme').addEventListener('change', function (e) { var v = e.target.value; if (v === 'auto') { document.documentElement.removeAttribute('data-theme'); } else { document.documentElement.setAttribute('data-theme', v); } });
var rt; window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(drawCharts, 120); });
render();
})();
</script>
