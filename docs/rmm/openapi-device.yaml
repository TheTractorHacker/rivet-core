openapi: 3.1.0
info:
  title: RivetCore RMM endpoint agent API
  version: 1.0.0
  summary: The device-facing endpoints of the endpoint agent and the technician REST API that goes with them.
  description: |
    The server side of the RMM endpoint agent (`RivetCore\Rmm`), as served by an edition (RivetIT, RivetMSP) under `/api/v1`.
    The prose protocol document is [PROTOCOL.md](PROTOCOL.md); this file is its machine-readable form. Both are frozen: additions are
    allowed, removals and retyping are not (see "Compatibility rules" in PROTOCOL.md).

    **Device endpoints** (`agent_*`) authenticate with the per-device credential (or, for enrollment and the installer, an enrollment
    token in the body). They are rate limited, TLS-only, and answer `{"error", "code"}` on failure; the `code` is the contract.

    **Technician endpoints** (`endpoint_devices`) need a user API token (the legacy shared key is refused by the edition) and are authorized
    on every call through the edition's access policy: abilities `rmm.device.view`, `rmm.job.run_saved`, `rmm.job.run_script`,
    `rmm.job.reboot`, `rmm.remote.launch`, (Phase 3) `rmm.alert.manage` and (Phase 6) `rmm.remote.manage`, scoped to the device's client. A device outside the caller's clients is a 404, the same as a
    missing one. Their responses carry no cache or CORS headers (the edition front controller adds the latter).

    A switched-off module answers every device endpoint `503 module_disabled` with `Retry-After: 3600`; the technician API answers
    `404 disabled`.
servers:
  - url: /api/v1
    description: Relative to the edition's host
tags:
  - name: Device
    description: Called by the agent on an endpoint
  - name: Technician
    description: Called by a technician's client (web, mobile) with a user token
security: []
paths:
  /agent_enroll:
    post:
      tags: [Device]
      operationId: agentEnroll
      summary: Enroll a device with an enrollment token (no bearer)
      description: |
        Exchanges a short-lived enrollment token (in the body) for a unique per-device credential, shown once; only its SHA-256 is stored.
        The same `install_id` again, or a reinstall of the same machine (`machine_guid`, then `serial`), keeps the device id and rotates the
        credential. Two different machines are never merged: ambiguous, out-of-client, hostname-only or already-owned matches return
        `pending_approval` (or `ambiguous`) and wait for an administrator. Limited per address from the database (10 failures or 60 attempts
        per 600 s, 429 with `Retry-After: 600`).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EnrollRequest'}
      responses:
        '201':
          description: Enrolled
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EnrollResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {description: 'Service disabled (baseline editions without the module gate), token used up, the device was revoked or retired (`forbidden`), or the installation is full (`device_limit`)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
        '409': {description: 'The install_id belongs to a different machine (`conflict`)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '413': {$ref: '#/components/responses/TooLarge'}
        '422': {$ref: '#/components/responses/Invalid'}
        '426': {$ref: '#/components/responses/TlsRequired'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/ModuleDisabled'}
  /agent_checkin:
    post:
      tags: [Device]
      operationId: agentCheckin
      summary: 'Check in: inventory, metrics, checks (device credential)'
      description: |
        Idempotent by `(device_id, seq)`: a retried check-in is acknowledged but never counted twice. A missing metric (null or absent) is
        never stored as zero. `collected_at` must not be more than 5 minutes in the future. Invalid buffered samples are dropped, not fatal.
        Feeds the edition's asset RMM link, its metrics (when it has them) and its RMM alerts (debounced, deduplicated). The agent may send
        more fields than listed (`platform`, `arch`, `capabilities`); the server ignores what it does not know. At most 40 per 60 s per device.
      security: [{deviceAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CheckinRequest'}
      responses:
        '200':
          description: Accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CheckinResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {description: 'Service disabled (baseline editions without the module gate)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '422': {$ref: '#/components/responses/Invalid'}
        '426': {$ref: '#/components/responses/TlsRequired'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {description: 'The module is switched off (`module_disabled`) or the server is shedding load (`unavailable`, jittered `Retry-After`); the agent keeps its credential and its buffer', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}, headers: {Retry-After: {schema: {type: integer}}}}
  /agent_jobs:
    get:
      tags: [Device]
      operationId: agentJobsOffer
      summary: Fetch this device's signed jobs (device credential, optional long poll)
      description: |
        Returns only the calling device's queued jobs (at most 5), each signed (Ed25519 over the canonical JSON of the job fields).
        `wait=1..5` holds the request open up to that many seconds. A destructive job (reboot, or flagged) is offered at most once; a harmless
        job whose acknowledgement was lost is offered again with `attempt + 1`. A revoked device gets `401 revoked` immediately. At most
        120 per 60 s per device.
      security: [{deviceAuth: []}]
      parameters:
        - {name: wait, in: query, required: false, schema: {type: integer, minimum: 0, maximum: 5}}
      responses:
        '200':
          description: Jobs (possibly none)
          content:
            application/json:
              schema:
                type: object
                required: [jobs]
                properties:
                  jobs: {type: array, items: {$ref: '#/components/schemas/Job'}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '426': {$ref: '#/components/responses/TlsRequired'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/ModuleDisabled'}
    post:
      tags: [Device]
      operationId: agentJobsReport
      summary: Report a job's state or result (device credential)
      description: |
        Idempotent for a repeated identical final state; a different final state, or one for a cancelled or expired job, is 409. Output is
        credential-redacted and capped before it is stored. A late real result replaces a server-side `result_lost`.
      security: [{deviceAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JobReport'}
      responses:
        '200': {description: Recorded, content: {application/json: {schema: {$ref: '#/components/schemas/Ok'}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {description: 'Unknown job (or one of another device)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '409': {description: 'That attempt was never issued, or the job is already in another final state (`conflict`)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '413': {$ref: '#/components/responses/TooLarge'}
        '422': {$ref: '#/components/responses/Invalid'}
        '426': {$ref: '#/components/responses/TlsRequired'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/ModuleDisabled'}
  /agent_update:
    get:
      tags: [Device]
      operationId: agentUpdate
      summary: Download the hosted agent release this device is currently offered (device credential)
      description: |
        Streams the UNSTAMPED agent executable of the server-hosted release named by the update manifest (its `url` points here). Only the
        release the manifest offers THIS device right now is served, only for its own architecture, and only while the stored file still
        matches the manifest's SHA-256; anything else is a generic 404. Exact `Content-Length`, `nosniff`, `no-store`. At most 60 per 60 s.
      security: [{deviceAuth: []}]
      parameters:
        - {name: arch, in: query, required: true, schema: {type: string, enum: [amd64, arm64]}}
        - {name: version, in: query, required: true, schema: {type: string, examples: ['1.2.0']}}
      responses:
        '200':
          description: The agent executable
          content:
            application/octet-stream:
              schema: {type: string, contentMediaType: application/octet-stream}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {description: 'Not offered to this device', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
        '422': {$ref: '#/components/responses/Invalid'}
        '426': {$ref: '#/components/responses/TlsRequired'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {description: 'The stored binary is missing or failed its integrity check (`unavailable`), the module is switched off (`module_disabled`) or updates are switched off (`feature_disabled`)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /agent_installer:
    post:
      tags: [Device]
      operationId: agentInstaller
      summary: Download the stamped per-client installer with an enrollment token (for RMM, Intune and GPO scripts)
      description: |
        Token-gated. The enrollment token goes in the JSON or form body (or an `Authorization: Bearer` header), NEVER in the query string (a
        token in the URL is refused with 400 so it stays out of access logs). Returns the current agent executable for the architecture with
        the client's installer payload and a 52-byte footer appended (PROTOCOL.md, "Installer trailer"), streamed with an exact
        `Content-Length`. Any token that is not usable now (unknown, wrong, revoked, expired, used up) gets the same generic 404. Limited per
        address and per token from the database (429 with `Retry-After: 600`). Successes and rejections are audited. The download does not
        consume an enrollment use; enrolling does.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InstallerRequest'}
          application/x-www-form-urlencoded:
            schema: {$ref: '#/components/schemas/InstallerRequest'}
      responses:
        '200':
          description: The stamped installer (`RivetIT-Agent-Setup-<client>-<x64|arm64>.exe`, or `RivetIT-Agent-<client>-<x64|arm64>.msi` when `format` is `msi`)
          content:
            application/octet-stream:
              schema: {type: string, contentMediaType: application/octet-stream}
        '400': {description: 'The token was sent in the query string (`token_in_url`)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '403': {description: 'Service disabled (baseline editions without the module gate)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '404': {description: 'Generic: the token is not usable', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
        '409': {description: 'No published binary (or, for `format: msi`, no published MSI template) for that architecture, or no https service URL (`unavailable`)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '413': {$ref: '#/components/responses/TooLarge'}
        '422': {$ref: '#/components/responses/Invalid'}
        '426': {$ref: '#/components/responses/TlsRequired'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/ModuleDisabled'}
  /agent_transfer:
    get:
      tags: [Device]
      operationId: agentTransferRead
      summary: Read a range of a file the server holds for this device (Phase 6, `filetransfer` switch)
      description: |
        Used by the agent while it runs a signed `file_put` job. Needs the device credential AND the transfer's one-time token in the `X-Transfer-Token` header
        (never in the URL), only for a transfer that belongs to this device, is still unexpired and has not been read more than twice over. `length` is at most 1 MiB.
        The response is the raw bytes with `X-Transfer-Size` and `X-Transfer-Sha256` (the agent checks both against the signed job). At most 600 per 60 s per device.
      security: [{deviceAuth: []}]
      parameters:
        - {name: transfer_id, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: offset, in: query, required: true, schema: {type: integer, minimum: 0}}
        - {name: length, in: query, required: true, schema: {type: integer, minimum: 1, maximum: 1048576}}
        - {name: X-Transfer-Token, in: header, required: true, schema: {type: string, pattern: '^[0-9a-f]{64}$'}}
      responses:
        '200':
          description: The bytes
          headers:
            X-Transfer-Size: {schema: {type: integer}}
            X-Transfer-Sha256: {schema: {type: string}}
          content: {application/octet-stream: {schema: {type: string, format: binary}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {description: 'Unknown transfer, another device''s transfer, a wrong token or the wrong direction (all the same `not_found`)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '416': {description: 'The range is outside the file (`invalid`)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '426': {$ref: '#/components/responses/TlsRequired'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/ModuleDisabled'}
    post:
      tags: [Device]
      operationId: agentTransferWrite
      summary: Send one chunk of a file to the server (Phase 6, `filetransfer` switch)
      description: |
        Used by the agent while it runs a signed `file_get` job. Raw body of at most 1 MiB at `offset`; the final chunk (an empty one for an empty file) carries
        `X-Transfer-Last: 1` and `X-Transfer-Sha256` of the whole file, which the server compares with the SHA-256 of what it stored before it keeps the file. A chunk the server
        already holds is acknowledged without being stored twice; an offset gap is `409 conflict` with `received` (resume there). The running total must stay within the
        transfer's size cap (`413 too_large` fails the transfer and deletes what arrived). Same authority rules as the read side. At most 600 per 60 s per device.
      security: [{deviceAuth: []}]
      parameters:
        - {name: transfer_id, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: offset, in: query, required: true, schema: {type: integer, minimum: 0}}
        - {name: X-Transfer-Token, in: header, required: true, schema: {type: string, pattern: '^[0-9a-f]{64}$'}}
        - {name: X-Transfer-Last, in: header, required: false, schema: {type: string, enum: ['1']}}
        - {name: X-Transfer-Sha256, in: header, required: false, schema: {type: string, pattern: '^[0-9a-f]{64}$'}}
      requestBody:
        required: true
        content: {application/octet-stream: {schema: {type: string, format: binary}}}
      responses:
        '200':
          description: Stored
          content: {application/json: {schema: {type: object, required: [ok, received, complete], properties: {ok: {type: boolean}, received: {type: integer}, complete: {type: boolean}}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {description: 'Unknown transfer, another device''s transfer, a wrong token or the wrong direction', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '409': {description: '`conflict`; the body carries `received`', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '413': {$ref: '#/components/responses/TooLarge'}
        '422': {description: '`checksum_mismatch` (the transfer failed and the bytes are deleted) or `invalid`', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '426': {$ref: '#/components/responses/TlsRequired'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/ModuleDisabled'}
  /agent_logs:
    post:
      tags: [Device]
      operationId: agentLogsShip
      summary: Ship a batch of collected log entries (Phase 8, `logs` switch)
      description: |
        Sent only after a check-in response offered the feature `logs:collect` (the agent announced the capability of the same name) with `config.logs`. At most 200 entries
        and 262144 bytes per request; the server drops what it cannot understand or what exceeds the device's per-minute budget, the device's row cap or the fleet cap, and says so
        in `dropped`. An entry stored before (same time, level, source, event id and text) is counted in `duplicates`, never stored twice, so resending a batch whose answer was lost
        is safe. Under load shedding (level 1 and up) the answer is `503 unavailable` with a jittered `Retry-After`; the agent keeps its bookmark and tries again. At most 30 per 60 s per device.
      security: [{deviceAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events: {type: array, maxItems: 200, items: {$ref: '#/components/schemas/LogEvent'}}
                dropped: {type: integer, minimum: 0, description: 'Entries the agent itself dropped since its last request (rate cap)'}
                config_version: {type: string}
      responses:
        '200':
          description: Processed
          content: {application/json: {schema: {type: object, required: [ok, accepted, dropped, duplicates], properties: {ok: {type: boolean}, accepted: {type: integer}, dropped: {type: integer}, duplicates: {type: integer}}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '422': {$ref: '#/components/responses/Invalid'}
        '426': {$ref: '#/components/responses/TlsRequired'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/ModuleDisabled'}
  /agent_changes:
    post:
      tags: [Device]
      operationId: agentChangesShip
      summary: Ship a batch of detected changes (change monitoring, `change_monitor` switch)
      description: |
        Sent only after a check-in response offered the feature `change:monitor` (the agent announced the capability of the same name) with a signed `config.change`. At most 100 records
        and 262144 bytes per request. The device id always comes from the credential. The server drops a record it cannot understand, one for a watch the device was not told to read
        (or of another kind), one whose target is outside that watch's paths or refused by the watch policy (credential hives and files are never recorded), and everything beyond the
        device's per-minute budget, the device's row cap or the fleet cap, and says so in `dropped`. A record stored before is counted in `duplicates`, never stored twice, so resending
        a batch whose answer was lost is safe. `status` is the agent's own report on its watches (an empty `changes` list with a `status` is the heartbeat). Under load shedding (level 2
        and up) the answer is `503 unavailable` with a jittered `Retry-After`. At most 30 per 60 s per device.
      security: [{deviceAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                changes: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/ChangeRecord'}}
                dropped: {type: integer, minimum: 0, description: 'Records the agent itself dropped since its last request (queue full, a mass change, a rejected batch)'}
                config_version: {type: string, description: 'The version of the configuration the records were detected under'}
                status:
                  type: object
                  properties:
                    watches: {type: array, maxItems: 60, items: {type: object, properties: {id: {type: string}, state: {type: string, enum: [ok, baseline, partial, error]}, items: {type: integer}, error: {type: string, maxLength: 160}}}}
                    baseline_at: {type: [string, 'null'], format: date-time}
      responses:
        '200':
          description: Processed
          content: {application/json: {schema: {type: object, required: [ok, accepted, dropped, duplicates], properties: {ok: {type: boolean}, accepted: {type: integer}, dropped: {type: integer}, duplicates: {type: integer}}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '422': {$ref: '#/components/responses/Invalid'}
        '426': {$ref: '#/components/responses/TlsRequired'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/ModuleDisabled'}
  /endpoint_devices:
    get:
      tags: [Technician]
      operationId: listDevices
      summary: List devices in the caller's clients
      description: |
        Needs ability `rmm.device.view`. Retired devices are not listed; revoked ones are. Ordered by hostname. `total` is the number of
        devices that match the filter (the page is cut after filtering).
      security: [{userToken: []}]
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - name: status
          in: query
          description: 'By check-in age (`online`, `offline`, `stale`, `never`) or by link state (`linked`, `pending_approval`, `rejected`); any other value matches nothing'
          schema: {type: string}
        - {name: tag, in: query, description: 'Phase 1. A tag name or id the device carries', schema: {type: string}}
        - {name: group, in: query, description: 'Phase 1. A group id: a device added to it by hand or carrying one of its tags', schema: {type: integer}}
        - {name: software, in: query, description: 'Phase 1. Part of the name of software currently installed on the device (case-insensitive)', schema: {type: string}}
        - {name: location_id, in: query, description: 'Phase 1. The edition''s location (site) of the device', schema: {type: integer}}
      responses:
        '200':
          description: Devices
          content:
            application/json:
              schema:
                type: object
                required: [data, total]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/DeviceSummary'}}
                  total: {type: integer}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
  /endpoint_devices/{id}:
    get:
      tags: [Technician]
      operationId: getDevice
      summary: Device detail with inventory, checks and recent jobs
      description: A device outside the caller's clients is a 404, indistinguishable from a missing one. Job output needs `rmm.job.run_saved`.
      security: [{userToken: []}]
      parameters:
        - {$ref: '#/components/parameters/DeviceId'}
      responses:
        '200': {description: Device, content: {application/json: {schema: {$ref: '#/components/schemas/DeviceDetail'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
        '405': {$ref: '#/components/responses/MethodNotAllowed'}
  /endpoint_devices/{id}/jobs:
    get:
      tags: [Technician]
      operationId: listDeviceJobs
      summary: Job history for a device
      description: Newest first. `output` and `output_truncated` are present only with `rmm.job.run_saved` for the device's client.
      security: [{userToken: []}]
      parameters:
        - {$ref: '#/components/parameters/DeviceId'}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        '200':
          description: Jobs
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/DeviceJob'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
    post:
      tags: [Technician]
      operationId: submitDeviceJob
      summary: Queue a maintenance job (PowerShell, saved script, collect, reboot)
      description: |
        Authorization is decided per call: free-form PowerShell needs `rmm.job.run_script`, a saved library script or a collect job
        `rmm.job.run_saved`, a reboot `rmm.job.reboot`, always with `rmm.device.view` and the device's client. Only a device linked to an
        asset receives jobs (409 otherwise). A reboot or any destructive job needs `"confirm": true` and is never retried automatically.
        The body is limited to 1 MiB (413).
      security: [{userToken: []}]
      parameters:
        - {$ref: '#/components/parameters/DeviceId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JobRequest'}
      responses:
        '201':
          description: Queued
          content:
            application/json:
              schema:
                type: object
                required: [job_id, state]
                properties:
                  job_id: {type: string, format: uuid}
                  state: {type: string, const: queued}
        '202':
          description: 'Phase 2. A library script that requires approval (or a run above the bulk threshold) waits for a second person'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PendingApproval'}
        '400': {description: 'The body is not a JSON object', content: {application/json: {schema: {type: object, properties: {error: {type: string}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
        '409': {description: 'The device is not linked to an asset (`conflict`)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '413': {$ref: '#/components/responses/TooLarge'}
        '422': {description: 'Unknown job type, unusable script or parameters, or `confirmation_required`', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /endpoint_devices/{id}/jobs/{job_id}/cancel:
    post:
      tags: [Technician]
      operationId: cancelDeviceJob
      summary: Cancel a queued job
      description: Needs `rmm.job.run_saved`. Only a queued job of this device can be cancelled.
      security: [{userToken: []}]
      parameters:
        - {$ref: '#/components/parameters/DeviceId'}
        - {name: job_id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Cancelled, content: {application/json: {schema: {$ref: '#/components/schemas/Ok'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
        '409': {description: 'Only a queued job can be cancelled (`conflict`)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /endpoint_devices/{id}/remote:
    post:
      tags: [Technician]
      operationId: launchRemote
      summary: Launch a MeshCentral remote session for a device
      description: |
        Needs `rmm.remote.launch`, `rmm.device.view` and the device's client, and a device mapped to a MeshCentral node. Returns a login URL
        minted for this request (never stored or logged) and a safe session id; only the session id is written to the edition's remote-session
        log. An unmapped device is 404 (`unmapped`); an offline-looking device, a missing configuration or a retired device is 409 (set
        `force` to launch an offline-looking device anyway); MeshCentral unreachable, or refused by the network policy, is 503
        (`mesh_unavailable`).
      security: [{userToken: []}]
      parameters:
        - {$ref: '#/components/parameters/DeviceId'}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                force: {type: boolean}
                view: {type: string, enum: [desktop, terminal, files], default: desktop, description: 'Phase 6: terminal and files also need `rmm.remote.manage` and the `remote_tools` switch (`409 feature_disabled` while it is off)'}
      responses:
        '200':
          description: Launch URL
          content:
            application/json:
              schema:
                type: object
                required: [url, session_id]
                properties:
                  url: {type: string}
                  session_id: {type: string}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: 'Device not found, or `unmapped`', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '409': {description: '`device_offline`, `not_configured` or `device_retired`', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '503': {description: '`mesh_unavailable`', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /endpoint_devices/{id}/software:
    get:
      tags: [Technician]
      operationId: getDeviceSoftware
      summary: Software installed on a device (Phase 1)
      description: |
        Needs `rmm.device.view` for the device's client. Ordered by name. `state` says whether the device ever reported, how many items are
        installed, when it last reported and whether it announced `software_inventory`. Empty until the `inventory_software` sub-switch is on
        and the agent has sent its first full list.
      security: [{userToken: []}]
      parameters:
        - {$ref: '#/components/parameters/DeviceId'}
        - {name: q, in: query, description: Part of the software name, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: include_removed, in: query, description: 'Also list what was removed (`removed_at` is then set)', schema: {type: string, enum: ['1']}}
      responses:
        '200':
          description: Software
          content:
            application/json:
              schema:
                type: object
                required: [data, total, state]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/SoftwareItem'}}
                  total: {type: integer}
                  state: {$ref: '#/components/schemas/SoftwareState'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
  /endpoint_devices/{id}/software/history:
    get:
      tags: [Technician]
      operationId: getDeviceSoftwareHistory
      summary: Software change log of a device (Phase 1)
      description: 'Newest first: installed, upgraded, downgraded and removed, with the versions. The first report of a device is a baseline and is not logged.'
      security: [{userToken: []}]
      parameters:
        - {$ref: '#/components/parameters/DeviceId'}
        - {name: name, in: query, description: Part of the software name, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
      responses:
        '200':
          description: Changes
          content:
            application/json:
              schema:
                type: object
                required: [data, total]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/SoftwareChange'}}
                  total: {type: integer}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
  /endpoint_devices/{id}/software/refresh:
    post:
      tags: [Technician]
      operationId: refreshDeviceSoftware
      summary: Ask a device for a full software list (Phase 1)
      description: Needs `rmm.job.run_saved` for the device's client. The device sends the full list at its next check-in (never sooner than 15 minutes after its previous report).
      security: [{userToken: []}]
      parameters:
        - {$ref: '#/components/parameters/DeviceId'}
      responses:
        '202':
          description: Queued
          content: {application/json: {schema: {type: object, properties: {ok: {type: boolean}, state: {type: string, const: queued}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
  /endpoint_devices/{id}/tags:
    get:
      tags: [Technician]
      operationId: getDeviceTags
      summary: Tags and groups of a device (Phase 1)
      security: [{userToken: []}]
      parameters:
        - {$ref: '#/components/parameters/DeviceId'}
      responses:
        '200':
          description: Tags and groups
          content:
            application/json:
              schema:
                type: object
                required: [data, groups]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/DeviceTag'}}
                  groups: {type: array, items: {type: object, properties: {group_id: {type: integer}, name: {type: string}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
    post:
      tags: [Technician]
      operationId: tagDevice
      summary: Put a tag on a device (Phase 1)
      description: Needs `rmm.device.manage` for the device's client. A name that does not exist creates the tag. Idempotent. A device carries at most 50 tags.
      security: [{userToken: []}]
      parameters:
        - {$ref: '#/components/parameters/DeviceId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tag]
              properties:
                tag: {description: 'A tag name or a tag id', oneOf: [{type: string}, {type: integer}]}
      responses:
        '200':
          description: The tag
          content: {application/json: {schema: {type: object, properties: {tag: {$ref: '#/components/schemas/Tag'}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
        '422': {$ref: '#/components/responses/Invalid'}
  /endpoint_devices/{id}/tags/{tag_id}:
    delete:
      tags: [Technician]
      operationId: untagDevice
      summary: Take a tag off a device (Phase 1)
      description: Needs `rmm.device.manage` for the device's client. 404 when the device does not carry the tag.
      security: [{userToken: []}]
      parameters:
        - {$ref: '#/components/parameters/DeviceId'}
        - {name: tag_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {description: Removed, content: {application/json: {schema: {$ref: '#/components/schemas/Ok'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
  /endpoint_devices/{id}/checks/{key}/history:
    get:
      tags: [Technician]
      operationId: getCheckHistory
      summary: Trend of one check of a device (Phase 1)
      description: |
        The recorded results of the check over the last `hours`, oldest first, and the seconds spent in each state. The ring keeps a result when
        the status changed and otherwise at most one per `check_history_gap_s` (default 3600 s), for `check_history_days` (default 7), so it is a
        trend, not every sample. `availability_pct` is the share of measured time (ok, warn, fail) that was ok; null when nothing was measured.
      security: [{userToken: []}]
      parameters:
        - {$ref: '#/components/parameters/DeviceId'}
        - {name: key, in: path, required: true, schema: {type: string}}
        - {name: hours, in: query, schema: {type: integer, minimum: 1, maximum: 8760, default: 24}}
      responses:
        '200':
          description: History
          content:
            application/json:
              schema:
                type: object
                required: [key, since, hours, points, seconds, availability_pct, changes, retention_days]
                properties:
                  key: {type: string}
                  since: {type: string, format: date-time}
                  hours: {type: integer}
                  points:
                    type: array
                    items:
                      type: object
                      properties:
                        at: {type: string, format: date-time}
                        status: {type: string, enum: [ok, warn, fail, unknown]}
                        detail: {type: string}
                  seconds:
                    type: object
                    properties: {ok: {type: integer}, warn: {type: integer}, fail: {type: integer}, unknown: {type: integer}}
                  availability_pct: {type: [number, 'null']}
                  changes: {type: integer}
                  retention_days: {type: integer}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
  /endpoint_devices/{id}/live:
    get:
      tags: [Technician]
      operationId: getDeviceLive
      summary: The small polling document of the device page (Phase 1)
      description: |
        Status, the latest gauges, the checks, open alert and job counts and the poll interval the server wants (`poll_s` doubles at load-shedding
        level 1 and is 0 from level 2). A missing reading is null, never 0. The weak `ETag` changes with a new check-in, a check change, an alert
        or a job; send it back as `If-None-Match` and an unchanged device answers 304 with no body. Needs `rmm.device.view`.
      security: [{userToken: []}]
      parameters:
        - {$ref: '#/components/parameters/DeviceId'}
        - {name: If-None-Match, in: header, schema: {type: string}}
      responses:
        '200':
          description: The document
          headers: {ETag: {schema: {type: string}}}
          content: {application/json: {schema: {$ref: '#/components/schemas/DeviceLive'}}}
        '304': {description: Unchanged, headers: {ETag: {schema: {type: string}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
  /endpoint_devices/{id}/network:
    get:
      tags: [Technician]
      operationId: getDeviceNetwork
      summary: Current network rate against the peak of the last hours (Phase 1)
      description: |
        Bytes per second. `current` is the last reading the device sent; `peak`, `avg` and `peak_at` come from the metric history of the edition's
        sink and are null when `history` is false (the sink keeps no history, or the device has no asset).
      security: [{userToken: []}]
      parameters:
        - {$ref: '#/components/parameters/DeviceId'}
        - {name: hours, in: query, schema: {type: integer, minimum: 1, maximum: 720, default: 24}}
      responses:
        '200':
          description: Network
          content:
            application/json:
              schema:
                type: object
                required: [window_hours, history, rx, tx]
                properties:
                  window_hours: {type: integer}
                  history: {type: boolean}
                  rx: {$ref: '#/components/schemas/NetworkSide'}
                  tx: {$ref: '#/components/schemas/NetworkSide'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
  /endpoint_devices/tags:
    get:
      tags: [Technician]
      operationId: listTags
      summary: Every tag with its device count (Phase 1)
      description: The count is of live devices in the caller's clients.
      security: [{userToken: []}]
      responses:
        '200':
          description: Tags
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/Tag'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
    post:
      tags: [Technician]
      operationId: createTag
      summary: Create a tag (Phase 1)
      description: Needs `rmm.device.manage` as a role. Names are unique without regard to case; creating an existing name returns it. At most 1000 tags.
      security: [{userToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, maxLength: 60}
                color: {type: string, description: 'Empty or #rrggbb'}
                description: {type: string, maxLength: 200}
      responses:
        '201':
          description: The tag
          content: {application/json: {schema: {type: object, properties: {tag: {$ref: '#/components/schemas/Tag'}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Invalid'}
  /endpoint_devices/tags/{tag_id}:
    patch:
      tags: [Technician]
      operationId: updateTag
      summary: Rename or recolor a tag (Phase 1)
      description: Needs `rmm.device.manage` as a role. `PUT` is accepted as well.
      security: [{userToken: []}]
      parameters:
        - {name: tag_id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string, maxLength: 60}
                color: {type: string}
                description: {type: string, maxLength: 200}
      responses:
        '200':
          description: The tag
          content: {application/json: {schema: {type: object, properties: {tag: {$ref: '#/components/schemas/Tag'}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
        '422': {$ref: '#/components/responses/Invalid'}
    delete:
      tags: [Technician]
      operationId: deleteTag
      summary: Delete a tag (Phase 1)
      description: Needs `rmm.device.manage` as a role. The tag is taken off every device and group.
      security: [{userToken: []}]
      parameters:
        - {name: tag_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {description: Deleted, content: {application/json: {schema: {$ref: '#/components/schemas/Ok'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
  /endpoint_devices/groups:
    get:
      tags: [Technician]
      operationId: listGroups
      summary: Every device group with its tags and member count (Phase 1)
      description: The member count is of live devices in the caller's clients.
      security: [{userToken: []}]
      responses:
        '200':
          description: Groups
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/Group'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
    post:
      tags: [Technician]
      operationId: createGroup
      summary: Create a device group (Phase 1)
      description: Needs `rmm.device.manage` as a role. A group is the devices added to it by hand (at most 5000) plus every device carrying one of its tags. At most 500 groups.
      security: [{userToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, maxLength: 100}
                description: {type: string, maxLength: 200}
      responses:
        '201':
          description: The group
          content: {application/json: {schema: {type: object, properties: {group: {$ref: '#/components/schemas/Group'}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Invalid'}
  /endpoint_devices/groups/{group_id}:
    get:
      tags: [Technician]
      operationId: getGroup
      summary: A group and its devices in the caller's clients (Phase 1)
      security: [{userToken: []}]
      parameters:
        - {name: group_id, in: path, required: true, schema: {type: integer}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 100}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
      responses:
        '200':
          description: The group
          content:
            application/json:
              schema:
                type: object
                required: [group, devices, total]
                properties:
                  group: {$ref: '#/components/schemas/Group'}
                  devices: {type: array, items: {$ref: '#/components/schemas/DeviceSummary'}}
                  total: {type: integer}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
    patch:
      tags: [Technician]
      operationId: updateGroup
      summary: Rename a group (Phase 1)
      description: Needs `rmm.device.manage` as a role. `PUT` is accepted as well.
      security: [{userToken: []}]
      parameters:
        - {name: group_id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string, maxLength: 100}
                description: {type: string, maxLength: 200}
      responses:
        '200':
          description: The group
          content: {application/json: {schema: {type: object, properties: {group: {$ref: '#/components/schemas/Group'}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
        '422': {$ref: '#/components/responses/Invalid'}
    delete:
      tags: [Technician]
      operationId: deleteGroup
      summary: Delete a group (Phase 1)
      description: Needs `rmm.device.manage` as a role. The devices and tags are untouched.
      security: [{userToken: []}]
      parameters:
        - {name: group_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {description: Deleted, content: {application/json: {schema: {$ref: '#/components/schemas/Ok'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
  /endpoint_devices/groups/{group_id}/devices:
    post:
      tags: [Technician]
      operationId: addGroupDevices
      summary: Add devices to a group by hand (Phase 1)
      description: Needs `rmm.device.manage` as a role and for every device's client. One device the caller cannot manage (or that does not exist) refuses the whole request with the same 404.
      security: [{userToken: []}]
      parameters:
        - {name: group_id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_ids]
              properties:
                device_ids: {type: array, items: {type: integer}}
      responses:
        '200': {description: Added, content: {application/json: {schema: {type: object, properties: {added: {type: integer}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
        '422': {$ref: '#/components/responses/Invalid'}
  /endpoint_devices/groups/{group_id}/devices/{device_id}:
    delete:
      tags: [Technician]
      operationId: removeGroupDevice
      summary: Remove a device added by hand (Phase 1)
      security: [{userToken: []}]
      parameters:
        - {name: group_id, in: path, required: true, schema: {type: integer}}
        - {name: device_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {description: Removed, content: {application/json: {schema: {$ref: '#/components/schemas/Ok'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
  /endpoint_devices/groups/{group_id}/tags:
    put:
      tags: [Technician]
      operationId: setGroupTags
      summary: Replace the tags a group follows (Phase 1)
      description: Needs `rmm.device.manage` as a role. A device carrying any of the tags is a member. At most 50 tags. `POST` is accepted as well.
      security: [{userToken: []}]
      parameters:
        - {name: group_id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tag_ids]
              properties:
                tag_ids: {type: array, items: {type: integer}}
      responses:
        '200': {description: Saved, content: {application/json: {schema: {$ref: '#/components/schemas/Ok'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
        '422': {$ref: '#/components/responses/Invalid'}
  /endpoint_devices/software:
    get:
      tags: [Technician]
      operationId: listFleetSoftware
      summary: Software across the fleet in the caller's clients (Phase 1)
      description: Grouped by name and source, most widespread first, with how many devices run it and how many different versions are out there.
      security: [{userToken: []}]
      parameters:
        - {name: q, in: query, description: Part of the software name, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
      responses:
        '200':
          description: Software
          content:
            application/json:
              schema:
                type: object
                required: [data, total]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        name: {type: string}
                        source: {type: string}
                        devices: {type: integer}
                        versions: {type: integer}
                  total: {type: integer}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
  /endpoint_devices/software/outdated:
    get:
      tags: [Technician]
      operationId: listOutdatedSoftware
      summary: Devices running a version older than a minimum (Phase 1)
      description: |
        `name` matches part of the software name; versions are compared with a forgiving comparison (leading epoch ignored, digit runs as numbers,
        letter runs as pre-release markers), which is not a package manager's ordering. One row per device and item, at most `limit` rows.
      security: [{userToken: []}]
      parameters:
        - {name: name, in: query, required: true, schema: {type: string}}
        - {name: min_version, in: query, required: true, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 1000, default: 100}}
      responses:
        '200':
          description: Outdated installs
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        device_id: {type: integer}
                        hostname: {type: string}
                        client_id: {type: integer}
                        asset_id: {type: [integer, 'null']}
                        name: {type: string}
                        source: {type: string}
                        version: {type: string}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
        '422': {$ref: '#/components/responses/Invalid'}
  /endpoint_devices/{id}/policy:
    get:
      tags: [Technician]
      operationId: getDevicePolicy
      summary: The effective policy of a device and where each setting came from (Phase 2)
      description: Needs `rmm.device.view`. The same resolution the check-in uses, with the layers that produced it.
      security: [{userToken: []}]
      parameters:
        - {$ref: '#/components/parameters/DeviceId'}
      responses:
        '200': {description: Effective policy, content: {application/json: {schema: {$ref: '#/components/schemas/EffectivePolicy'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
  /endpoint_devices/{id}/fields:
    get:
      tags: [Technician]
      operationId: getDeviceFields
      summary: Custom fields that apply to a device, with their values (Phase 2)
      description: The device's own, its location's and its client's fields. A secret is always `********`.
      security: [{userToken: []}]
      parameters:
        - {$ref: '#/components/parameters/DeviceId'}
      responses:
        '200':
          description: Fields
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/FieldValue'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
  /endpoint_devices/{id}/fields/{field_id}:
    put:
      tags: [Technician]
      operationId: setDeviceFieldValue
      summary: Set or clear a device-scoped custom field value (Phase 2)
      description: Needs `rmm.device.manage` for the device's client (`rmm.admin` for a secret). A null or empty value clears it.
      security: [{userToken: []}]
      parameters:
        - {$ref: '#/components/parameters/DeviceId'}
        - {name: field_id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, properties: {value: {}}}
      responses:
        '200': {description: Saved}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
        '422': {description: 'Not a valid value for the field''s type (`invalid`)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /endpoint_devices/policies:
    get:
      tags: [Technician]
      operationId: listPolicies
      summary: Policies (Phase 2)
      security: [{userToken: []}]
      responses:
        '200': {description: Policies with their number of assignments, content: {application/json: {schema: {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/Policy'}}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Technician]
      operationId: createPolicy
      summary: Create a policy (Phase 2)
      description: 'Needs `rmm.admin`. `settings` keys are `interval.check_in_s`, `interval.collect_s`, `feature.software_inventory`, `feature.script_checks`, `feature.checks`, `agent.ring` and `check.<key>`; each is `{mode: override|disable|inherit, value}` or a bare value (an override). See PROTOCOL.md 3.2.2.'
      security: [{userToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PolicyInput'}
      responses:
        '201': {description: Created, content: {application/json: {schema: {type: object, properties: {policy: {$ref: '#/components/schemas/Policy'}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {description: 'Invalid settings or a duplicate name (`invalid`)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /endpoint_devices/policies/{policy_id}:
    parameters:
      - {name: policy_id, in: path, required: true, schema: {type: integer}}
    get:
      tags: [Technician]
      operationId: getPolicy
      summary: One policy with its assignments and versions (Phase 2)
      security: [{userToken: []}]
      responses:
        '200': {description: The policy, content: {application/json: {schema: {type: object, properties: {policy: {$ref: '#/components/schemas/Policy'}, assignments: {type: array, items: {$ref: '#/components/schemas/PolicyAssignment'}}, versions: {type: array, items: {type: object}}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
    patch:
      tags: [Technician]
      operationId: updatePolicy
      summary: Change a policy (Phase 2)
      description: 'Needs `rmm.admin`. A change of `settings` makes a new version; `PUT` is the same. A switched-off policy (`enabled: false`) reaches no device.'
      security: [{userToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PolicyInput'}
      responses:
        '200': {description: Saved, content: {application/json: {schema: {type: object, properties: {policy: {$ref: '#/components/schemas/Policy'}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
        '422': {description: Invalid, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    delete:
      tags: [Technician]
      operationId: deletePolicy
      summary: Delete a policy and its assignments (Phase 2)
      description: Needs `rmm.admin`.
      security: [{userToken: []}]
      responses:
        '200': {description: Deleted}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
  /endpoint_devices/policies/{policy_id}/versions:
    get:
      tags: [Technician]
      operationId: listPolicyVersions
      summary: Versions of a policy, newest first (Phase 2)
      parameters:
        - {name: policy_id, in: path, required: true, schema: {type: integer}}
        - {name: body, in: query, schema: {type: string, enum: ['1']}, description: 'Include each version''s settings'}
      security: [{userToken: []}]
      responses:
        '200': {description: Versions, content: {application/json: {schema: {type: object, properties: {data: {type: array, items: {type: object}}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /endpoint_devices/policies/{policy_id}/assignments:
    post:
      tags: [Technician]
      operationId: assignPolicy
      summary: Assign a policy to a scope (Phase 2)
      description: Needs `rmm.admin`. Precedence, least to most specific, is global, client, site, group, tag, device; the most specific layer wins each setting, a higher `priority` wins inside one scope, and an `enforce`d layer cannot be overridden. Assigning again updates in place. Publishes `rmm.policy.assigned`.
      parameters:
        - {name: policy_id, in: path, required: true, schema: {type: integer}}
      security: [{userToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope_type]
              properties:
                scope_type: {type: string, enum: [global, client, site, group, tag, device]}
                scope_id: {type: integer}
                priority: {type: integer, minimum: 0, maximum: 1000000, default: 100}
                enforce: {type: boolean}
                overrides: {type: object, description: 'Settings laid over the policy''s own for this assignment only; `inherit` cancels a key'}
      responses:
        '200': {description: Assigned, content: {application/json: {schema: {type: object, properties: {assignment: {$ref: '#/components/schemas/PolicyAssignment'}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
        '422': {description: Invalid, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /endpoint_devices/policies/{policy_id}/assignments/{assignment_id}:
    delete:
      tags: [Technician]
      operationId: unassignPolicy
      summary: Remove an assignment (Phase 2)
      parameters:
        - {name: policy_id, in: path, required: true, schema: {type: integer}}
        - {name: assignment_id, in: path, required: true, schema: {type: integer}}
      security: [{userToken: []}]
      responses:
        '200': {description: Removed}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
  /endpoint_devices/scripts:
    get:
      tags: [Technician]
      operationId: listLibraryScripts
      summary: The script library (Phase 2)
      description: Without script text. Needs `rmm.device.view`.
      parameters:
        - {name: q, in: query, schema: {type: string}}
        - {name: language, in: query, schema: {type: string, enum: [powershell, bash, python]}}
        - {name: tag, in: query, schema: {type: string}}
        - {name: include_retired, in: query, schema: {type: string, enum: ['1']}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0}}
      security: [{userToken: []}]
      responses:
        '200': {description: Scripts, content: {application/json: {schema: {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/LibraryScript'}}, total: {type: integer}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Technician]
      operationId: createLibraryScript
      summary: Publish a script (Phase 2)
      description: Needs `rmm.job.run_script`. The first version is signed with the instance's Ed25519 key. A PowerShell script is at most 10000 characters, any other at most 102400 bytes.
      security: [{userToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LibraryScriptInput'}
      responses:
        '201': {description: Created (with the current version's text), content: {application/json: {schema: {type: object, properties: {script: {$ref: '#/components/schemas/LibraryScript'}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {description: Invalid, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /endpoint_devices/scripts/{script_id}:
    parameters:
      - {name: script_id, in: path, required: true, schema: {type: integer}}
    get:
      tags: [Technician]
      operationId: getLibraryScript
      summary: One script (Phase 2)
      description: '`?body=1` adds the current version''s text, for a caller with `rmm.job.run_saved`.'
      parameters:
        - {name: body, in: query, schema: {type: string, enum: ['1']}}
      security: [{userToken: []}]
      responses:
        '200': {description: The script, content: {application/json: {schema: {type: object, properties: {script: {$ref: '#/components/schemas/LibraryScript'}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
    patch:
      tags: [Technician]
      operationId: updateLibraryScript
      summary: Change a script (Phase 2)
      description: Needs `rmm.job.run_script`. A new `body` or `params` publishes a new, signed version; `PUT` is the same. A retired script cannot be changed.
      security: [{userToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LibraryScriptInput'}
      responses:
        '200': {description: Saved, content: {application/json: {schema: {type: object, properties: {script: {$ref: '#/components/schemas/LibraryScript'}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
        '422': {description: Invalid, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    delete:
      tags: [Technician]
      operationId: retireLibraryScript
      summary: Retire a script (Phase 2)
      description: Needs `rmm.job.run_script`. A retired script cannot be run or scheduled; its history stays. `POST .../restore` brings it back.
      security: [{userToken: []}]
      responses:
        '200': {description: Retired}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
        '409': {description: Already retired (`conflict`), content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /endpoint_devices/scripts/{script_id}/restore:
    post:
      tags: [Technician]
      operationId: restoreLibraryScript
      summary: Restore a retired script (Phase 2)
      parameters:
        - {name: script_id, in: path, required: true, schema: {type: integer}}
      security: [{userToken: []}]
      responses:
        '200': {description: Restored}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
  /endpoint_devices/scripts/{script_id}/resign:
    post:
      tags: [Technician]
      operationId: resignLibraryScript
      summary: Sign every version again with the current key (Phase 2)
      description: Needs `rmm.admin`. After a signing-key rotation the stored signatures no longer verify and the script is refused until this is called.
      parameters:
        - {name: script_id, in: path, required: true, schema: {type: integer}}
      security: [{userToken: []}]
      responses:
        '200': {description: 'Re-signed', content: {application/json: {schema: {type: object, properties: {versions: {type: integer}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
  /endpoint_devices/scripts/{script_id}/versions:
    get:
      tags: [Technician]
      operationId: listLibraryScriptVersions
      summary: Versions of a script, newest first, without text (Phase 2)
      parameters:
        - {name: script_id, in: path, required: true, schema: {type: integer}}
      security: [{userToken: []}]
      responses:
        '200': {description: Versions, content: {application/json: {schema: {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/ScriptVersion'}}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
  /endpoint_devices/scripts/{script_id}/versions/{version}:
    get:
      tags: [Technician]
      operationId: getLibraryScriptVersion
      summary: One version with its text (Phase 2)
      description: Needs `rmm.job.run_saved`.
      parameters:
        - {name: script_id, in: path, required: true, schema: {type: integer}}
        - {name: version, in: path, required: true, schema: {type: integer}}
      security: [{userToken: []}]
      responses:
        '200': {description: The version, content: {application/json: {schema: {type: object, properties: {version: {$ref: '#/components/schemas/ScriptVersion'}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
  /endpoint_devices/scripts/{script_id}/runs:
    get:
      tags: [Technician]
      operationId: listLibraryScriptRuns
      summary: Recent jobs of a script on any device (Phase 2)
      description: Needs `rmm.job.run_saved`.
      parameters:
        - {name: script_id, in: path, required: true, schema: {type: integer}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500}}
      security: [{userToken: []}]
      responses:
        '200': {description: Jobs, content: {application/json: {schema: {type: object, properties: {data: {type: array, items: {type: object}}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
  /endpoint_devices/runs:
    post:
      tags: [Technician]
      operationId: runLibraryScriptOnTarget
      summary: Run a library script on a target (Phase 2)
      description: |
        Needs `rmm.job.run_saved` for each client reached. The target is a device, tag, group, client, site, policy (every device it is assigned to) or `all`;
        only live devices linked to an asset, inside the caller's clients, on the script's platform are reached. More devices than the `bulk_run_max` limit
        is 422 `too_many`. A script flagged `requires_approval`, or more devices than the `approval_bulk_threshold` limit, answers 202 and waits for a second
        person with `rmm.job.approve`; a destructive script needs `confirm`.
      security: [{userToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RunRequest'}
      responses:
        '201':
          description: Queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  device_count: {type: integer}
                  created: {type: integer}
                  skipped_denied: {type: integer}
                  skipped_error: {type: integer}
                  errors: {type: array, items: {type: string}}
        '202': {description: Waiting for approval, content: {application/json: {schema: {$ref: '#/components/schemas/PendingApproval'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {description: 'Invalid, no device, `too_many` or `confirmation_required`', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /endpoint_devices/approvals:
    get:
      tags: [Technician]
      operationId: listApprovals
      summary: Approval requests (Phase 2)
      parameters:
        - {name: state, in: query, schema: {type: string, enum: [pending_approval, approved, rejected, cancelled, expired]}}
        - {name: kind, in: query, schema: {type: string, enum: [run, schedule]}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0}}
      security: [{userToken: []}]
      responses:
        '200': {description: Approvals, content: {application/json: {schema: {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/Approval'}}, total: {type: integer}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /endpoint_devices/approvals/{approval_id}:
    get:
      tags: [Technician]
      operationId: getApproval
      summary: One approval request (Phase 2)
      parameters:
        - {name: approval_id, in: path, required: true, schema: {type: integer}}
      security: [{userToken: []}]
      responses:
        '200': {description: The approval, content: {application/json: {schema: {type: object, properties: {approval: {$ref: '#/components/schemas/Approval'}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
  /endpoint_devices/approvals/{approval_id}/approve:
    post:
      tags: [Technician]
      operationId: approveApproval
      summary: Approve a request (Phase 2)
      description: |
        Needs `rmm.job.approve` for every client the request reaches, and must be somebody other than the requester (403 `own_request`). Approving a run queues its
        jobs at once (as the requester, inside the requester's clients); approving a schedule lets it start. A request is decided once (409) and lapses after the
        `approval_expiry_h` limit (409 `expired`). A script changed since the request, or a request that no longer matches its recorded hash, is 409 `conflict`.
      parameters:
        - {name: approval_id, in: path, required: true, schema: {type: integer}}
      security: [{userToken: []}]
      requestBody:
        content:
          application/json:
            schema: {type: object, properties: {note: {type: string, maxLength: 300}}}
      responses:
        '200': {description: Approved, content: {application/json: {schema: {type: object, properties: {approval_id: {type: integer}, state: {type: string, const: approved}, result: {type: object}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
        '409': {description: 'Already decided, expired or changed (`conflict`, `expired`)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /endpoint_devices/approvals/{approval_id}/reject:
    post:
      tags: [Technician]
      operationId: rejectApproval
      summary: Reject a request (Phase 2)
      description: Same rules as approving; nothing is queued.
      parameters:
        - {name: approval_id, in: path, required: true, schema: {type: integer}}
      security: [{userToken: []}]
      requestBody:
        content:
          application/json:
            schema: {type: object, properties: {note: {type: string, maxLength: 300}}}
      responses:
        '200': {description: Rejected}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
        '409': {description: Already decided or expired, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /endpoint_devices/approvals/{approval_id}/cancel:
    post:
      tags: [Technician]
      operationId: cancelApproval
      summary: Withdraw a pending request (Phase 2)
      description: The requester or an administrator.
      parameters:
        - {name: approval_id, in: path, required: true, schema: {type: integer}}
      security: [{userToken: []}]
      responses:
        '200': {description: Cancelled}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
        '409': {description: Not pending, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /endpoint_devices/schedules:
    get:
      tags: [Technician]
      operationId: listSchedules
      summary: Scheduled scripts (Phase 2)
      security: [{userToken: []}]
      responses:
        '200': {description: Schedules, content: {application/json: {schema: {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/Schedule'}}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Technician]
      operationId: createSchedule
      summary: Schedule a library script (Phase 2)
      description: 'Needs `rmm.admin`. 201 with the schedule, or 202-style `state: pending_approval` in the body when a second person must approve it first (the schedule does not run until then).'
      security: [{userToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ScheduleInput'}
      responses:
        '201': {description: Saved, content: {application/json: {schema: {type: object, properties: {schedule: {$ref: '#/components/schemas/Schedule'}, device_count: {type: integer}, state: {type: string, const: pending_approval}, approval_id: {type: integer}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {description: Invalid, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /endpoint_devices/schedules/{schedule_id}:
    parameters:
      - {name: schedule_id, in: path, required: true, schema: {type: integer}}
    get:
      tags: [Technician]
      operationId: getSchedule
      summary: One schedule with its recent runs (Phase 2)
      security: [{userToken: []}]
      responses:
        '200': {description: The schedule, content: {application/json: {schema: {type: object, properties: {schedule: {$ref: '#/components/schemas/Schedule'}, runs: {type: array, items: {type: object}}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
    patch:
      tags: [Technician]
      operationId: updateSchedule
      summary: Change a schedule (Phase 2)
      description: Needs `rmm.admin`; `PUT` is the same. Changing the script version, the parameters or the target withdraws an earlier approval.
      security: [{userToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ScheduleInput'}
      responses:
        '200': {description: Saved}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
        '422': {description: Invalid, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    delete:
      tags: [Technician]
      operationId: deleteSchedule
      summary: Delete a schedule (Phase 2)
      security: [{userToken: []}]
      responses:
        '200': {description: Deleted}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
  /endpoint_devices/schedules/{schedule_id}/history:
    get:
      tags: [Technician]
      operationId: getScheduleHistory
      summary: Per-device results of a schedule (Phase 2)
      description: One row per job the schedule queued, newest first, with the job's state and exit code. Only devices inside the caller's clients.
      parameters:
        - {name: schedule_id, in: path, required: true, schema: {type: integer}}
        - {name: device_id, in: query, schema: {type: integer}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0}}
      security: [{userToken: []}]
      responses:
        '200': {description: History, content: {application/json: {schema: {type: object, properties: {data: {type: array, items: {type: object}}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
  /endpoint_devices/fields:
    get:
      tags: [Technician]
      operationId: listCustomFields
      summary: Custom field definitions (Phase 2)
      parameters:
        - {name: scope, in: query, schema: {type: string, enum: [client, site, device]}}
      security: [{userToken: []}]
      responses:
        '200': {description: Definitions, content: {application/json: {schema: {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/CustomField'}}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Technician]
      operationId: defineCustomField
      summary: Define a custom field (Phase 2)
      description: Needs `rmm.admin`. The name is lower case (`^[a-z][a-z0-9_]{0,39}$`) and is used as `{{field.name}}` in a script parameter.
      security: [{userToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CustomFieldInput'}
      responses:
        '201': {description: Defined, content: {application/json: {schema: {type: object, properties: {field: {$ref: '#/components/schemas/CustomField'}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {description: Invalid, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /endpoint_devices/fields/{field_id}:
    parameters:
      - {name: field_id, in: path, required: true, schema: {type: integer}}
    get:
      tags: [Technician]
      operationId: getCustomField
      summary: One definition (Phase 2)
      security: [{userToken: []}]
      responses:
        '200': {description: The definition, content: {application/json: {schema: {type: object, properties: {field: {$ref: '#/components/schemas/CustomField'}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
    patch:
      tags: [Technician]
      operationId: changeCustomField
      summary: Change label, description, options or default (Phase 2)
      description: Needs `rmm.admin`; `PUT` is the same. The name, scope and type cannot be changed.
      security: [{userToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CustomFieldInput'}
      responses:
        '200': {description: Saved}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
        '422': {description: Invalid, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    delete:
      tags: [Technician]
      operationId: deleteCustomField
      summary: Delete a field and all its values (Phase 2)
      security: [{userToken: []}]
      responses:
        '200': {description: Deleted}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
  /endpoint_devices/fields/{field_id}/values/{scope_id}:
    put:
      tags: [Technician]
      operationId: setCustomFieldValue
      summary: Set or clear the value of a field for a client, site or device (Phase 2)
      description: |
        `scope_id` is the client, location or device id the field's scope names. Needs `rmm.device.manage` for that client (`rmm.admin` for a secret). A site value also
        needs `client_id` in the body, and the site must belong to it. A null or empty `value` clears it.
      parameters:
        - {name: field_id, in: path, required: true, schema: {type: integer}}
        - {name: scope_id, in: path, required: true, schema: {type: integer}}
      security: [{userToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, properties: {value: {}, client_id: {type: integer}}}
      responses:
        '200': {description: Saved}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
        '422': {description: Invalid, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /endpoint_devices/alerts:
    get:
      tags: [Technician]
      operationId: listAlerts
      summary: Alerts (Phase 3, `alerting` switch)
      description: |
        Core's record of each alert episode: severity (`warn` or `crit`), state (`open`, `acknowledged`, `resolved`), who acknowledged it,
        the grouping key and the escalation clock. Scoped to the caller's clients. Newest active first.
      security: [{userToken: []}]
      parameters:
        - {name: state, in: query, schema: {type: string, enum: [open, acknowledged, resolved, active]}}
        - {name: severity, in: query, schema: {type: string, enum: [warn, crit]}}
        - {name: device_id, in: query, schema: {type: integer}}
        - {name: client_id, in: query, schema: {type: integer}}
        - {name: check_key, in: query, schema: {type: string}}
        - {name: group_key, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
      responses:
        '200':
          description: Alerts
          content:
            application/json:
              schema: {type: object, required: [items, total], properties: {items: {type: array, items: {$ref: '#/components/schemas/Alert'}}, total: {type: integer}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
  /endpoint_devices/alerts/groups:
    get:
      tags: [Technician]
      operationId: listAlertGroups
      summary: Active alerts grouped by client and check (Phase 3)
      description: One row per client and check key with the number of alerts and devices, the worst severity and the first and last opening time. Worst first.
      security: [{userToken: []}]
      responses:
        '200':
          description: Groups
          content:
            application/json:
              schema: {type: object, required: [groups], properties: {groups: {type: array, items: {type: object, properties: {group_key: {type: string}, client_id: {type: integer}, check_key: {type: string}, alerts: {type: integer}, devices: {type: integer}, severity: {type: string, enum: [warn, crit]}, first_opened_at: {type: string, format: date-time}, last_opened_at: {type: string, format: date-time}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
  /endpoint_devices/alerts/{alert_id}:
    get:
      tags: [Technician]
      operationId: getAlert
      summary: One alert (Phase 3)
      security: [{userToken: []}]
      parameters:
        - {name: alert_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200':
          description: The alert
          content:
            application/json:
              schema: {type: object, properties: {alert: {$ref: '#/components/schemas/Alert'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
  /endpoint_devices/alerts/{alert_id}/ack:
    post:
      tags: [Technician]
      operationId: acknowledgeAlert
      summary: Acknowledge an alert (Phase 3)
      description: Stops the escalation of an open alert and tells the edition (`RmmEscalationInterface::acknowledgeAlert`). Needs `rmm.alert.manage` for the alert's client. Acknowledging twice is harmless; a resolved alert answers 409 `conflict`.
      security: [{userToken: []}]
      parameters:
        - {name: alert_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200':
          description: The alert
          content:
            application/json:
              schema: {type: object, properties: {alert: {$ref: '#/components/schemas/Alert'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
        '409': {$ref: '#/components/responses/Conflict'}
  /endpoint_devices/alerts/{alert_id}/resolve:
    post:
      tags: [Technician]
      operationId: resolveAlert
      summary: Resolve an alert by hand (Phase 3)
      description: Resolves the edition's alert (with its conservative ticket auto-close) and gives the check a fresh failure count, so a condition that is still bad opens a NEW episode after the debounce. Needs `rmm.alert.manage`.
      security: [{userToken: []}]
      parameters:
        - {name: alert_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200':
          description: The alert
          content:
            application/json:
              schema: {type: object, properties: {alert: {$ref: '#/components/schemas/Alert'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
  /endpoint_devices/maintenance:
    get:
      tags: [Technician]
      operationId: listMaintenanceWindows
      summary: Maintenance windows (Phase 3)
      description: |
        A window mutes alerts (`mute`) or freezes check evaluation (`suppress`) for a scope: all devices, one client, one site, a group, a
        tag or one device. `active_now` and `next_starts_at` are computed for the request time.
      security: [{userToken: []}]
      parameters:
        - {name: scope_type, in: query, schema: {type: string, enum: [all, client, site, group, tag, device]}}
        - {name: scope_id, in: query, schema: {type: integer}}
        - {name: active, in: query, description: '1 = only windows open now', schema: {type: string}}
      responses:
        '200':
          description: Windows
          content:
            application/json:
              schema: {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/MaintenanceWindow'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
    post:
      tags: [Technician]
      operationId: createMaintenanceWindow
      summary: Create a maintenance window (Phase 3)
      description: |
        One-time (`kind: once`, `starts_at`, `ends_at`) or recurring (`kind: recurring`, `recur_freq` daily/weekly/monthly,
        `recur_interval`, `recur_days`, `local_start`, `duration_min`, `recur_from`, `recur_until`, `timezone`). A day number a month does
        not have is clamped to the month's last day. A client or device scope needs `rmm.alert.manage` for that client; every other scope
        needs `rmm.admin`. At most 500 windows.
      security: [{userToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MaintenanceWindowInput'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {type: object, properties: {window: {$ref: '#/components/schemas/MaintenanceWindow'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
        '422': {$ref: '#/components/responses/Invalid'}
  /endpoint_devices/maintenance/{window_id}:
    get:
      tags: [Technician]
      operationId: getMaintenanceWindow
      summary: One maintenance window (Phase 3)
      security: [{userToken: []}]
      parameters:
        - {name: window_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200':
          description: The window
          content:
            application/json:
              schema: {type: object, properties: {window: {$ref: '#/components/schemas/MaintenanceWindow'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
    patch:
      tags: [Technician]
      operationId: updateMaintenanceWindow
      summary: Change a maintenance window (Phase 3)
      description: |
        A partial update: the stored window is merged with the body and validated as a whole. PUT is the same.
      security: [{userToken: []}]
      parameters:
        - {name: window_id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MaintenanceWindowInput'}
      responses:
        '200':
          description: The window
          content:
            application/json:
              schema: {type: object, properties: {window: {$ref: '#/components/schemas/MaintenanceWindow'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
        '422': {$ref: '#/components/responses/Invalid'}
    delete:
      tags: [Technician]
      operationId: deleteMaintenanceWindow
      summary: Delete a maintenance window (Phase 3)
      description: Deleting an open window ends it (`rmm.maintenance.ended`).
      security: [{userToken: []}]
      parameters:
        - {name: window_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200':
          description: Done
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Ok'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
  /endpoint_devices/escalation_policies:
    get:
      tags: [Technician]
      operationId: listEscalationPolicies
      summary: Escalation policies (Phase 3)
      description: Steps notify targets N minutes after an alert opened while it is still unacknowledged; the last step may repeat. The most specific enabled policy containing the device (device, group, tag, site, client, all) governs an alert. Delivery is the edition's (`RmmEscalationInterface`).
      security: [{userToken: []}]
      responses:
        '200':
          description: Policies
          content:
            application/json:
              schema: {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/EscalationPolicy'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
    post:
      tags: [Technician]
      operationId: createEscalationPolicy
      summary: Create an escalation policy (Phase 3)
      description: |
        Needs `rmm.admin`. At most 200 policies, 10 steps of 10 targets. Target types: user, group, email, chat, webhook.
      security: [{userToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EscalationPolicyInput'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {type: object, properties: {policy: {$ref: '#/components/schemas/EscalationPolicy'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
        '422': {$ref: '#/components/responses/Invalid'}
  /endpoint_devices/escalation_policies/{policy_id}:
    get:
      tags: [Technician]
      operationId: getEscalationPolicy
      summary: One escalation policy (Phase 3)
      security: [{userToken: []}]
      parameters:
        - {name: policy_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200':
          description: The policy
          content:
            application/json:
              schema: {type: object, properties: {policy: {$ref: '#/components/schemas/EscalationPolicy'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
    patch:
      tags: [Technician]
      operationId: updateEscalationPolicy
      summary: Change an escalation policy (Phase 3)
      description: Needs `rmm.admin`. `steps`, when present, replaces all steps. PUT is the same.
      security: [{userToken: []}]
      parameters:
        - {name: policy_id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EscalationPolicyInput'}
      responses:
        '200':
          description: The policy
          content:
            application/json:
              schema: {type: object, properties: {policy: {$ref: '#/components/schemas/EscalationPolicy'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
        '422': {$ref: '#/components/responses/Invalid'}
    delete:
      tags: [Technician]
      operationId: deleteEscalationPolicy
      summary: Delete an escalation policy (Phase 3)
      description: Needs `rmm.admin`. Open alerts governed by it stop escalating.
      security: [{userToken: []}]
      parameters:
        - {name: policy_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200':
          description: Done
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Ok'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
  /endpoint_devices/alerting/settings:
    get:
      tags: [Technician]
      operationId: getAlertingSettings
      summary: Alerting switch and storm-control limits (Phase 3)
      description: |
        `alerting_enabled` is the `alerting` sub-switch of the module. Limits: at most `storm_*_max` alerts may open per client and in
        total inside `storm_*_window_s`; 0 turns a cap off.
      security: [{userToken: []}]
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AlertingSettings'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
    put:
      tags: [Technician]
      operationId: updateAlertingSettings
      summary: Change the storm-control limits (Phase 3)
      description: Needs `rmm.admin`. PATCH is the same.
      security: [{userToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, properties: {storm_global_max: {type: integer, minimum: 0}, storm_global_window_s: {type: integer, minimum: 60}, storm_client_max: {type: integer, minimum: 0}, storm_client_window_s: {type: integer, minimum: 60}}}
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AlertingSettings'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
        '422': {$ref: '#/components/responses/Invalid'}
  /endpoint_devices/check_types:
    get:
      tags: [Technician]
      operationId: listCheckTypes
      summary: The check type catalog (Phase 3)
      description: |
        Every check type: where it runs, whether it reports a numeric `value` (so thresholds apply), the unit, and the schema of its
        params. The four original types are `legacy` and have no field schema. A Phase 3 type is offered only to a device that announced
        `check:<type>`.
      security: [{userToken: []}]
      responses:
        '200':
          description: Types
          content:
            application/json:
              schema: {type: object, properties: {data: {type: array, items: {type: object, properties: {type: {type: string}, legacy: {type: boolean}, platforms: {type: array, items: {type: string, enum: [windows, linux]}}, reports_value: {type: boolean}, unit: {type: [string, 'null']}, fields: {type: object}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
  /endpoint_devices/{id}/alerts:
    get:
      tags: [Technician]
      operationId: listDeviceAlerts
      summary: Alerts of one device (Phase 3)
      description: Same filters and shape as the fleet list.
      security: [{userToken: []}]
      parameters:
        - {$ref: '#/components/parameters/DeviceId'}
      responses:
        '200':
          description: Alerts
          content:
            application/json:
              schema: {type: object, required: [items, total], properties: {items: {type: array, items: {$ref: '#/components/schemas/Alert'}}, total: {type: integer}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
  /endpoint_devices/{id}/alerting:
    get:
      tags: [Technician]
      operationId: getDeviceAlerting
      summary: Why a bad check has no alert (Phase 3)
      description: The maintenance windows open for the device, its parent and any down ancestor, and per check the threshold tier, the last reading, the flap state and why an alert is held back (`maintenance`, `maintenance_suppress`, `dependency`) or still waiting for the debounce.
      security: [{userToken: []}]
      parameters:
        - {$ref: '#/components/parameters/DeviceId'}
      responses:
        '200':
          description: The device view
          content:
            application/json:
              schema: {type: object, properties: {alerting_enabled: {type: boolean}, maintenance: {type: array, items: {$ref: '#/components/schemas/MaintenanceWindow'}}, muted: {type: boolean}, suppressed: {type: boolean}, parent: {type: [object, 'null']}, down_ancestor: {type: [object, 'null']}, checks: {type: array, items: {type: object, properties: {check_key: {type: string}, status: {type: string}, alert_id: {type: [integer, 'null']}, tier: {type: [string, 'null']}, pending_tier: {type: [string, 'null']}, last_value: {type: [number, 'null']}, flapping: {type: boolean}, has_override: {type: boolean}, held_by: {type: [string, 'null']}, waiting_for_debounce: {type: boolean}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
  /endpoint_devices/{id}/maintenance:
    get:
      tags: [Technician]
      operationId: getDeviceMaintenance
      summary: Maintenance windows open for a device now (Phase 3)
      security: [{userToken: []}]
      parameters:
        - {$ref: '#/components/parameters/DeviceId'}
      responses:
        '200':
          description: Windows
          content:
            application/json:
              schema: {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/MaintenanceWindow'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
  /endpoint_devices/{id}/parent:
    get:
      tags: [Technician]
      operationId: getDeviceParent
      summary: A device's parent and children (Phase 3)
      description: While the parent is offline (no check-in for `offline_after_s`) alerts of its children do not open. Up to 5 levels count.
      security: [{userToken: []}]
      parameters:
        - {$ref: '#/components/parameters/DeviceId'}
      responses:
        '200':
          description: Parent and children
          content:
            application/json:
              schema: {type: object, properties: {parent: {type: [object, 'null']}, children: {type: array, items: {type: object}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
    put:
      tags: [Technician]
      operationId: setDeviceParent
      summary: Set a device's parent (Phase 3)
      description: Needs `rmm.alert.manage`. The parent must belong to the same client; a loop is refused. POST is the same.
      security: [{userToken: []}]
      parameters:
        - {$ref: '#/components/parameters/DeviceId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [parent_device_id], properties: {parent_device_id: {type: integer}}}
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: {type: object, properties: {parent: {type: object}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
        '422': {$ref: '#/components/responses/Invalid'}
    delete:
      tags: [Technician]
      operationId: clearDeviceParent
      summary: Remove a device's parent (Phase 3)
      description: Needs `rmm.alert.manage`.
      security: [{userToken: []}]
      parameters:
        - {$ref: '#/components/parameters/DeviceId'}
      responses:
        '200':
          description: Done
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Ok'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
  /endpoint_devices/{id}/checks/{key}/thresholds:
    get:
      tags: [Technician]
      operationId: getCheckThresholds
      summary: Thresholds of one check on a device (Phase 3)
      description: The definition's `params.thresholds`, the per-device override, the effective result and the live tier, last reading and flap state.
      security: [{userToken: []}]
      parameters:
        - {$ref: '#/components/parameters/DeviceId'}
        - {name: key, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Thresholds
          content:
            application/json:
              schema: {type: object, properties: {check_key: {type: string}, type: {type: string}, reports_value: {type: boolean}, defined: {type: [object, 'null']}, override: {type: [object, 'null']}, effective: {type: [object, 'null']}, state: {type: [object, 'null']}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
    put:
      tags: [Technician]
      operationId: setCheckThresholds
      summary: Override the thresholds of a check on one device (Phase 3)
      description: Needs `rmm.device.manage`. The body replaces fields of the definition's thresholds (a field set to null is removed); the merged result must be valid. The definition must declare `thresholds`. An empty object (or DELETE) removes the override. PATCH is the same.
      security: [{userToken: []}]
      parameters:
        - {$ref: '#/components/parameters/DeviceId'}
        - {name: key, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Thresholds'}
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: {type: object, properties: {override: {type: object}, effective: {type: object}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
        '422': {$ref: '#/components/responses/Invalid'}
        '409': {$ref: '#/components/responses/Conflict'}
    delete:
      tags: [Technician]
      operationId: clearCheckThresholds
      summary: Remove the threshold override of a check on a device (Phase 3)
      description: Needs `rmm.device.manage`.
      security: [{userToken: []}]
      parameters:
        - {$ref: '#/components/parameters/DeviceId'}
        - {name: key, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Done
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Ok'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
  /endpoint_devices/{id}/services:
    get:
      tags: [Technician]
      operationId: getServices
      summary: The latest service list the device reported (Phase 6)
      description: Needs `rmm.remote.manage`. Read the answer a moment after `POST .../services/query`; `state` is the state of the job that produced it (`none` before the first request).
      security: [{userToken: []}]
      parameters: [{$ref: '#/components/parameters/DeviceId'}]
      responses:
        '200': {description: The snapshot, content: {application/json: {schema: {$ref: '#/components/schemas/RemoteSnapshot'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
  /endpoint_devices/{id}/services/query:
    post:
      tags: [Technician]
      operationId: queryServices
      summary: Ask the device for its services (Phase 6, `remote_tools` switch)
      description: Queues a signed `svc_list` job. `409 feature_disabled` while the switch is off, `409 unsupported` when the agent never announced `remote:services`.
      security: [{userToken: []}]
      parameters: [{$ref: '#/components/parameters/DeviceId'}]
      responses:
        '202': {description: Queued, content: {application/json: {schema: {$ref: '#/components/schemas/Queued'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
        '409': {$ref: '#/components/responses/Conflict'}
  /endpoint_devices/{id}/services/{name}/{action}:
    post:
      tags: [Technician]
      operationId: controlService
      summary: Start, stop, restart, enable, disable or set a service to manual (Phase 6)
      description: |
        Needs `rmm.remote.manage`. `name` is a service name (letters, digits and `_ . @ $ : -`, at most 200, never starting with a symbol; on Linux a systemd `.service` unit, the suffix
        is added when missing). `action` is `start`, `stop`, `restart`, `enable`, `disable` or `manual` (Windows only). `stop`, `restart` and `disable` need `confirm: true` and are
        queued as destructive jobs (offered at most once). The RMM agent's own service is refused (`422 protected`). The server never builds a command: the signed job carries exactly `{name, action}`.
      security: [{userToken: []}]
      parameters:
        - {$ref: '#/components/parameters/DeviceId'}
        - {name: name, in: path, required: true, schema: {type: string}}
        - {name: action, in: path, required: true, schema: {type: string, enum: [start, stop, restart, enable, disable, manual]}}
      requestBody:
        required: false
        content: {application/json: {schema: {type: object, properties: {confirm: {type: boolean}}}}}
      responses:
        '202': {description: Queued, content: {application/json: {schema: {$ref: '#/components/schemas/Queued'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {description: '`invalid`, `protected` or `confirmation_required`', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /endpoint_devices/{id}/processes:
    get:
      tags: [Technician]
      operationId: getProcesses
      summary: The latest process list the device reported (Phase 6)
      security: [{userToken: []}]
      parameters: [{$ref: '#/components/parameters/DeviceId'}]
      responses:
        '200': {description: The snapshot, content: {application/json: {schema: {$ref: '#/components/schemas/RemoteSnapshot'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
  /endpoint_devices/{id}/processes/query:
    post:
      tags: [Technician]
      operationId: queryProcesses
      summary: Ask the device for its processes with CPU and memory (Phase 6)
      security: [{userToken: []}]
      parameters: [{$ref: '#/components/parameters/DeviceId'}]
      requestBody:
        required: false
        content: {application/json: {schema: {type: object, properties: {limit: {type: integer, minimum: 1, maximum: 500}, sort: {type: string, enum: [cpu, mem]}}}}}
      responses:
        '202': {description: Queued, content: {application/json: {schema: {$ref: '#/components/schemas/Queued'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
  /endpoint_devices/{id}/processes/{pid}/kill:
    post:
      tags: [Technician]
      operationId: killProcess
      summary: End a process (Phase 6)
      description: |
        Needs `rmm.remote.manage` and `confirm: true`. The caller names the process id AND the process name as listed; the agent re-reads the name when the job runs and refuses on a mismatch
        (a recycled id cannot end another program). The agent also refuses system processes, itself and its parent. Queued as a destructive job.
      security: [{userToken: []}]
      parameters:
        - {$ref: '#/components/parameters/DeviceId'}
        - {name: pid, in: path, required: true, schema: {type: integer, minimum: 2, maximum: 4194304}}
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [name, confirm], properties: {name: {type: string}, force: {type: boolean}, confirm: {type: boolean}}}}}
      responses:
        '202': {description: Queued, content: {application/json: {schema: {$ref: '#/components/schemas/Queued'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {description: '`invalid` or `confirmation_required`', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /endpoint_devices/{id}/remote/mesh:
    get:
      tags: [Technician]
      operationId: getMeshInfo
      summary: Is MeshCentral set up, is the device mapped, and which views may this caller open (Phase 6)
      security: [{userToken: []}]
      parameters: [{$ref: '#/components/parameters/DeviceId'}]
      responses:
        '200':
          description: Mesh information
          content: {application/json: {schema: {type: object, properties: {configured: {type: boolean}, mapped: {type: boolean}, node_id: {type: [string, 'null']}, views: {type: array, items: {type: string, enum: [desktop, terminal, files]}}, terminal_files_enabled: {type: boolean}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
  /endpoint_devices/{id}/remote/node:
    put:
      tags: [Technician]
      operationId: mapMeshNode
      summary: Map (or clear, with an empty string) the MeshCentral node of a device (administrators)
      security: [{userToken: []}]
      parameters: [{$ref: '#/components/parameters/DeviceId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [node_id], properties: {node_id: {type: string}}}}}
      responses:
        '200': {description: Saved, content: {application/json: {schema: {type: object, properties: {ok: {type: boolean}, node_id: {type: string}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
        '422': {$ref: '#/components/responses/Invalid'}
  /endpoint_devices/{id}/remote/jobs/{job_id}:
    get:
      tags: [Technician]
      operationId: getRemoteJobResult
      summary: The structured result of a remote-tool job (Phase 6)
      description: Needs `rmm.remote.manage`. Only jobs of the six remote-tool types; the output of those jobs is never in the generic job list.
      security: [{userToken: []}]
      parameters:
        - {$ref: '#/components/parameters/DeviceId'}
        - {name: job_id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: The result, content: {application/json: {schema: {type: object, properties: {job_id: {type: string}, type: {type: string}, state: {type: string}, reason: {type: [string, 'null']}, exit_code: {type: [integer, 'null']}, finished_at: {type: [string, 'null']}, result: {type: [object, 'null']}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
  /endpoint_devices/{id}/files:
    get:
      tags: [Technician]
      operationId: listTransfers
      summary: The file transfers of a device (Phase 6)
      security: [{userToken: []}]
      parameters: [{$ref: '#/components/parameters/DeviceId'}]
      responses:
        '200': {description: Transfers, newest first, content: {application/json: {schema: {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/Transfer'}}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
  /endpoint_devices/{id}/files/download:
    post:
      tags: [Technician]
      operationId: requestFileDownload
      summary: Ask the device to send one file to the server (Phase 6, `filetransfer` switch)
      description: |
        Needs `rmm.remote.manage`. The path must be absolute, free of `..`, inside a folder an administrator allowed for the device's platform and not on the never-transfer list
        (password databases, private keys, credential stores, the agent's own files); a refusal is `422 path_denied` with a `reason` (`not_absolute`, `traversal`, `not_allowed`, `deny_list`,
        `no_allowed_roots`, `invalid`). Queues a signed `file_get` job and a transfer record; follow it with `GET .../files/{transfer_id}`.
      security: [{userToken: []}]
      parameters: [{$ref: '#/components/parameters/DeviceId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [path], properties: {path: {type: string}}}}}
      responses:
        '202': {description: Queued, content: {application/json: {schema: {type: object, properties: {transfer_id: {type: string}, job_id: {type: string}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {description: '`invalid` or `path_denied`', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '507': {description: 'The transfer storage is full (`too_large`)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /endpoint_devices/{id}/files/upload:
    post:
      tags: [Technician]
      operationId: declareFileUpload
      summary: Declare a file to send to the device (administrators, `filetransfer` switch)
      description: |
        Needs `rmm.admin`, `confirm: true`, a destination inside an allowed folder, the size in bytes (at most the transfer size limit) and the file's SHA-256. The content follows with
        `PUT .../files/{transfer_id}/content`. Nothing is queued before the bytes arrive and match.
      security: [{userToken: []}]
      parameters: [{$ref: '#/components/parameters/DeviceId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [path, size, sha256, confirm], properties: {path: {type: string}, size: {type: integer, minimum: 0}, sha256: {type: string, pattern: '^[0-9a-fA-F]{64}$'}, overwrite: {type: boolean}, confirm: {type: boolean}}}}}
      responses:
        '201': {description: Declared, content: {application/json: {schema: {type: object, properties: {transfer_id: {type: string}, state: {type: string, const: awaiting_content}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '422': {description: '`invalid`, `confirmation_required` or `path_denied`', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '507': {description: 'The transfer storage is full (`too_large`)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /endpoint_devices/{id}/files/{transfer_id}:
    get:
      tags: [Technician]
      operationId: getTransfer
      summary: State of one transfer (Phase 6)
      security: [{userToken: []}]
      parameters:
        - {$ref: '#/components/parameters/DeviceId'}
        - {name: transfer_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: The transfer, content: {application/json: {schema: {$ref: '#/components/schemas/Transfer'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
    delete:
      tags: [Technician]
      operationId: deleteTransfer
      summary: Delete the stored copy of a transfer (the ledger row stays for the audit trail)
      security: [{userToken: []}]
      parameters:
        - {$ref: '#/components/parameters/DeviceId'}
        - {name: transfer_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
  /endpoint_devices/{id}/files/{transfer_id}/content:
    get:
      tags: [Technician]
      operationId: downloadTransferContent
      summary: The verified file of a finished download (Phase 6)
      description: Needs `rmm.remote.manage`; only a download whose SHA-256 matched and that has not expired or been deleted (otherwise `409 conflict`). The fetch is audited. The body is the raw file.
      security: [{userToken: []}]
      parameters:
        - {$ref: '#/components/parameters/DeviceId'}
        - {name: transfer_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: The file, content: {application/octet-stream: {schema: {type: string, format: binary}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
        '409': {$ref: '#/components/responses/Conflict'}
    put:
      tags: [Technician]
      operationId: uploadTransferContent
      summary: The bytes of a declared upload (administrators)
      description: Raw body. The server checks the byte count and the SHA-256 against the declaration; on a mismatch nothing is kept (`422 checksum_mismatch`) and the transfer still waits for a correct send. On a match the signed `file_put` job is queued (destructive, so offered at most once).
      security: [{userToken: []}]
      parameters:
        - {$ref: '#/components/parameters/DeviceId'}
        - {name: transfer_id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content: {application/octet-stream: {schema: {type: string, format: binary}}}
      responses:
        '202': {description: Queued, content: {application/json: {schema: {type: object, properties: {transfer_id: {type: string}, job_id: {type: string}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
  /endpoint_devices/remote/settings:
    get:
      tags: [Technician]
      operationId: getRemoteSettings
      summary: Remote-tools and log-collection settings (administrators)
      description: The sub-switches (`remote_tools`, `filetransfer`, `logs`), the folders file transfer may touch, the log sources, the caps and the plain-language risk and storage texts to show before switching them on.
      security: [{userToken: []}]
      responses:
        '200': {description: Settings, content: {application/json: {schema: {$ref: '#/components/schemas/RemoteSettings'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
    put:
      tags: [Technician]
      operationId: updateRemoteSettings
      summary: Change them (administrators)
      description: |
        Only the keys sent are touched; nothing is written when any value is refused. Turning `filetransfer` on needs `accept_filetransfer_risk: true`, turning `logs` on needs
        `accept_logs_storage: true`; without it the answer is `422 confirmation_required` with the text the person must read.
      security: [{userToken: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, properties: {features: {type: object, properties: {remote_tools: {type: boolean}, filetransfer: {type: boolean}, logs: {type: boolean}}}, transfer_allow: {type: object, properties: {linux: {type: array, items: {type: string}}, windows: {type: array, items: {type: string}}}}, logs_collect: {type: object}, limits: {type: object, additionalProperties: {type: integer}}, accept_filetransfer_risk: {type: boolean}, accept_logs_storage: {type: boolean}}}}}
      responses:
        '200': {description: Saved, content: {application/json: {schema: {$ref: '#/components/schemas/RemoteSettings'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
        '422': {description: '`invalid` or `confirmation_required`', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /endpoint_devices/{id}/mesh/install:
    post:
      tags: [Technician]
      operationId: installMeshAgent
      summary: Install the MeshCentral agent on an enrolled device (1.0.0-rc.16)
      description: |
        Queues a signed `mesh_install` job (PROTOCOL.md 3.2.6). Needs `rmm.remote.manage` and the `remote_tools` switch. The caller supplies NOTHING but `force`: the Mesh address, the device group id, the optional
        pin and the agent-id and argument tables are taken from the stored Mesh settings at this moment, and the group id is kept out of the job row. Answers `409 not_configured` while MeshCentral is off, has no https
        address or no device group, and `409 unsupported` when the agent never announced `job:mesh_install` (update it first). IDEMPOTENT: a device whose last report says the agent is installed answers
        `200` with `skipped: already_installed` (unless `force` is true) and a second request while one is open answers `200` with `skipped: already_queued` and the open `job_id`. The result is read with
        `GET /endpoint_devices/{id}/remote/jobs/{job_id}` and in the device detail (`mesh_agent`, and `mesh_install` while the install is available).
      security: [{userToken: []}]
      parameters: [{$ref: '#/components/parameters/DeviceId'}]
      requestBody:
        required: false
        content:
          application/json:
            schema: {type: object, additionalProperties: false, properties: {force: {type: boolean, default: false, description: 'Run the installer even when the agent already reports the Mesh agent installed'}}}
      responses:
        '200': {description: 'Nothing queued: `skipped` is `already_installed` or `already_queued`', content: {application/json: {schema: {type: object, properties: {skipped: {type: string, enum: [already_installed, already_queued]}, job_id: {type: string}, node_id: {type: [string, 'null']}}}}}}
        '202': {description: Queued, content: {application/json: {schema: {$ref: '#/components/schemas/Queued'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
  /endpoint_devices/{id}/mesh/uninstall:
    post:
      tags: [Technician]
      operationId: uninstallMeshAgent
      summary: Remove the MeshCentral agent from a device (1.0.0-rc.16)
      description: |
        Queues a signed `mesh_uninstall` job: the Mesh agent's own uninstaller runs (never the RivetIT agent's). Needs `rmm.remote.manage`, the `remote_tools` switch and `confirm: true` (`422 confirmation_required`
        without it). Destructive: offered at most once, never retried. Not tied to the Mesh settings, so an agent can be removed after MeshCentral was switched off.
      security: [{userToken: []}]
      parameters: [{$ref: '#/components/parameters/DeviceId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [confirm], additionalProperties: false, properties: {confirm: {type: boolean}}}
      responses:
        '202': {description: Queued, content: {application/json: {schema: {$ref: '#/components/schemas/Queued'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
  /endpoint_devices/mesh/install:
    post:
      tags: [Technician]
      operationId: installMeshAgentBulk
      summary: Install the MeshCentral agent on every device of a target (1.0.0-rc.16)
      description: |
        The same rules as the single install, applied to every live linked Windows or Linux device of `target` (`device`, `tag`, `group`, `client`, `site`, `policy` or `all`) INSIDE the caller's clients (a device of
        another client is never reached and never counted). Needs `rmm.remote.manage` (a client where the caller lacks it is skipped and counted in `skipped_denied`) and `confirm: true` (without it
        `422 confirmation_required` answers with the `device_count` it would reach). At most `bulk_run_max` devices (`422 too_many`). When `approval_bulk_threshold` is set and the target is larger,
        the request is REFUSED (`409 approval_required`): the two-person approval queue only knows script runs today, so install in batches. Devices that already report the agent (`skipped_installed`),
        already have an install open (`skipped_queued`) or run an older agent (`skipped_unsupported`) are skipped, so the call can be repeated safely.
      security: [{userToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target, confirm]
              additionalProperties: false
              properties:
                target: {type: object, required: [type], properties: {type: {type: string, enum: [device, tag, group, client, site, policy, all]}, id: {type: integer}}}
                force: {type: boolean, default: false}
                confirm: {type: boolean}
      responses:
        '201':
          description: Queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  device_count: {type: integer}
                  created: {type: integer}
                  skipped_denied: {type: integer}
                  skipped_installed: {type: integer}
                  skipped_queued: {type: integer}
                  skipped_unsupported: {type: integer}
                  skipped_error: {type: integer}
                  errors: {type: array, items: {type: string}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
  /endpoint_devices/remote/mesh:
    get:
      tags: [Technician]
      operationId: getMeshAgentSettings
      summary: Mesh agent install settings (administrators; 1.0.0-rc.12)
      description: |
        The settings of the optional "also install the MeshCentral agent" feature: the device group the devices join, the optional pin of the Mesh server certificate, whether an
        automatically found node id may replace one mapped by hand, the optional corrections of the agent-id and install-argument tables, the effective tables an installer carries
        and whether an installer can ask for the agent right now (`install_ready`, else `install_refusal`). The Mesh address and the on/off switch are the existing MeshCentral settings.
        **The ids, arguments and download address are not verified against a real MeshCentral server** (`note`).
      security: [{userToken: []}]
      responses:
        '200': {description: Settings, content: {application/json: {schema: {$ref: '#/components/schemas/MeshAgentSettings'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
    put:
      tags: [Technician]
      operationId: updateMeshAgentSettings
      summary: Change them (administrators)
      description: |
        Only the keys sent are touched; nothing is written when any value is refused (`422 invalid`). `mesh_group_id` is the `meshid` of MeshCentral's download address (64 characters of letters, digits, `@` and `$`), the WHOLE pasted download address (only the `meshid` is taken; a host other than the saved Mesh address is a `warnings` entry, not an error; nothing is fetched), MeshCentral's `mesh//...` form or the hex group id (32 to 128 characters); stored as canonical
        hex plus the URL form when one was given (answered as `mesh_group_id_url`); `mesh_server_cert_pin` is the SHA-384 (96 hex) or SHA-256 (64 hex) hash of the server certificate, colons and case ignored, empty to use the system trust store. Leave it empty when the server certificate is issued by a public CA such as Let's Encrypt (it is renewed every 60 to 90 days and would break a pin); use a pin only for a private CA or a self-signed certificate.
        `probe_pin: true` reads the Mesh server's certificate through the network policy and answers a proposed pin in `pin_probe` WITHOUT saving it (trust on first use: compare it with the hash MeshCentral shows); `pin_probe.publicly_trusted` is true when the certificate also verifies against the system roots, and `pin_probe.note` then says no pin is needed.
      security: [{userToken: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, properties: {mesh_group_id: {type: string}, mesh_server_cert_pin: {type: string}, mesh_auto_map_overwrite: {type: boolean}, mesh_agent_ids: {type: object, additionalProperties: {type: integer, minimum: 1, maximum: 255}}, mesh_install_args: {type: object, properties: {windows: {type: array, maxItems: 8, items: {type: string}}, linux: {type: array, maxItems: 8, items: {type: string}}}}, mesh_hide: {type: integer, minimum: 0, maximum: 255, description: "MeshCentral hide bitmask for the desktop launch (31 = only the remote screen, 0 = no hide parameter)"}, mesh_hide_tools: {type: [integer, 'null'], minimum: 0, maximum: 255, description: 'Same for terminal and files; null or empty = the same as mesh_hide'}, probe_pin: {type: boolean}}}}}
      responses:
        '200': {description: Saved, content: {application/json: {schema: {$ref: '#/components/schemas/MeshAgentSettings'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
        '422': {description: '`invalid`', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /endpoint_devices/logs:
    get:
      tags: [Technician]
      operationId: searchLogs
      summary: Search collected log entries across the caller's clients (Phase 8)
      description: Needs `rmm.device.view` and `rmm.job.run_saved`. Newest first. A fleet search spans at most 7 days (default the last 24 hours). `level` means that severity or worse; `source` and `q` are case-insensitive substring matches. A `device_id` or `client_id` outside the caller's clients is `404`.
      security: [{userToken: []}]
      parameters:
        - {name: device_id, in: query, required: false, schema: {type: integer}}
        - {name: client_id, in: query, required: false, schema: {type: integer}}
        - {name: from, in: query, required: false, schema: {type: string, format: date-time}}
        - {name: to, in: query, required: false, schema: {type: string, format: date-time}}
        - {name: level, in: query, required: false, schema: {type: string, enum: [critical, error, warning, info, debug]}}
        - {name: source, in: query, required: false, schema: {type: string}}
        - {name: code, in: query, required: false, schema: {type: integer}}
        - {name: q, in: query, required: false, schema: {type: string}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 500}}
        - {name: offset, in: query, required: false, schema: {type: integer, minimum: 0}}
      responses:
        '200': {description: Entries, content: {application/json: {schema: {$ref: '#/components/schemas/LogSearch'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
  /endpoint_devices/logs/stats:
    get:
      tags: [Technician]
      operationId: logStats
      summary: Fleet log storage figures (Phase 8)
      security: [{userToken: []}]
      responses:
        '200': {description: Figures, content: {application/json: {schema: {type: object}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
  /endpoint_devices/logs/rules:
    get:
      tags: [Technician]
      operationId: listLogRules
      summary: Log rules (Phase 8)
      description: A caller limited to some clients sees only the rules of those clients, never the all-clients ones.
      security: [{userToken: []}]
      responses:
        '200': {description: Rules, content: {application/json: {schema: {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/LogRule'}}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
    post:
      tags: [Technician]
      operationId: createLogRule
      summary: Create a log rule (needs `rmm.alert.manage`)
      description: A rule for all clients (`client_id` 0) needs access to all clients; a rule for one client needs that client. A rule is a phrase filter, never a regular expression. A match raises the check `log.rule_<id>` through the check evaluator, so debounce, the alerting engine, maintenance windows and escalation apply.
      security: [{userToken: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/LogRuleInput'}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/LogRule'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
        '422': {$ref: '#/components/responses/Invalid'}
  /endpoint_devices/logs/rules/{rule_id}:
    get:
      tags: [Technician]
      operationId: getLogRule
      summary: One log rule
      security: [{userToken: []}]
      parameters: [{name: rule_id, in: path, required: true, schema: {type: integer}}]
      responses:
        '200': {description: The rule, content: {application/json: {schema: {$ref: '#/components/schemas/LogRule'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
    patch:
      tags: [Technician]
      operationId: updateLogRule
      summary: Change a log rule (PUT is the same)
      security: [{userToken: []}]
      parameters: [{name: rule_id, in: path, required: true, schema: {type: integer}}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/LogRuleInput'}}}
      responses:
        '200': {description: Saved, content: {application/json: {schema: {$ref: '#/components/schemas/LogRule'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
        '422': {$ref: '#/components/responses/Invalid'}
    delete:
      tags: [Technician]
      operationId: deleteLogRule
      summary: Delete a log rule (alerts it had open close at the next housekeeping run)
      security: [{userToken: []}]
      parameters: [{name: rule_id, in: path, required: true, schema: {type: integer}}]
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
  /endpoint_devices/{id}/logs:
    get:
      tags: [Technician]
      operationId: deviceLogs
      summary: Search the collected log entries of one device (Phase 8)
      description: Same filters as the fleet search; a device search may span up to 90 days.
      security: [{userToken: []}]
      parameters:
        - {$ref: '#/components/parameters/DeviceId'}
        - {name: from, in: query, required: false, schema: {type: string, format: date-time}}
        - {name: to, in: query, required: false, schema: {type: string, format: date-time}}
        - {name: level, in: query, required: false, schema: {type: string, enum: [critical, error, warning, info, debug]}}
        - {name: source, in: query, required: false, schema: {type: string}}
        - {name: code, in: query, required: false, schema: {type: integer}}
        - {name: q, in: query, required: false, schema: {type: string}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 500}}
        - {name: offset, in: query, required: false, schema: {type: integer, minimum: 0}}
      responses:
        '200': {description: Entries, content: {application/json: {schema: {$ref: '#/components/schemas/LogSearch'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
  /endpoint_devices/{id}/logs/stats:
    get:
      tags: [Technician]
      operationId: deviceLogStats
      summary: Log storage figures of one device (Phase 8)
      security: [{userToken: []}]
      parameters: [{$ref: '#/components/parameters/DeviceId'}]
      responses:
        '200': {description: Figures, content: {application/json: {schema: {type: object}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
  /endpoint_devices/starter/catalog:
    get:
      tags: [Technician]
      operationId: starterCatalog
      summary: The starter pack catalog with each item's state in this instance (starter pack)
      description: Needs `rmm.admin`. Lists every pack (the bundled `rivet-core-starter` pack and any pack folder the edition added) with its scripts (no script text), check template sets and policy drafts. The state of an item is `not_installed`, `current`, `update_available`, `modified` (an administrator changed the script, so an update would be parked, not applied), `update_staged`, `retired`, and for a policy also `modified` when its settings were edited. Filters are combined with AND.
      security: [{userToken: []}]
      parameters:
        - {name: pack, in: query, schema: {type: string}}
        - {name: platform, in: query, schema: {type: string, enum: [windows, linux]}}
        - {name: risk, in: query, description: Comma separated, schema: {type: string}, example: 'read_only,changes_system'}
        - {name: tags, in: query, description: Comma separated; a script matches when it has any of them, schema: {type: string}}
        - {name: q, in: query, description: Words in the name or description, schema: {type: string}}
      responses:
        '200':
          description: The catalog
          content: {application/json: {schema: {$ref: '#/components/schemas/StarterCatalog'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
        '422': {$ref: '#/components/responses/Invalid'}
  /endpoint_devices/starter/plan:
    post:
      tags: [Technician]
      operationId: starterPlan
      summary: What an install of a selection would do; writes nothing (starter pack)
      description: Needs `rmm.admin`. Every item has an `action`. `add` creates it, `update` publishes a new version of a script nobody edited (or updates a policy draft that is untouched, off and unassigned), `stage` adds the pack's new text as a further version flagged `starter-updated` next to a script an administrator edited (the script keeps running what it ran), `unchanged`, `skip` (retired by an administrator, an update already parked, a policy that is edited, switched on or assigned) and `blocked` (no signing key, a name clash that cannot be resolved, a bad policy parameter). Without `ids`, `tags`, `risk` or `platform` it covers the whole pack.
      security: [{userToken: []}]
      requestBody:
        required: false
        content: {application/json: {schema: {$ref: '#/components/schemas/StarterSelection'}}}
      responses:
        '200':
          description: The plan
          content: {application/json: {schema: {$ref: '#/components/schemas/StarterPlan'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
        '422': {$ref: '#/components/responses/Invalid'}
  /endpoint_devices/starter/install:
    post:
      tags: [Technician]
      operationId: starterInstall
      summary: Install a selection of the starter pack (starter pack)
      description: Needs `rmm.admin`. Idempotent per (pack id, item id, content hash). Scripts are signed with the instance key and installed active, with `requires_approval` and `destructive` from their risk class (read only none, changes the system none, disruptive both); policies are created switched off and assigned to nothing. An item that fails does not stop the others. One activity-log line per changed item and one `rmm.starter.installed` event when anything changed.
      security: [{userToken: []}]
      requestBody:
        required: false
        content: {application/json: {schema: {$ref: '#/components/schemas/StarterSelection'}}}
      responses:
        '200':
          description: Per item outcome (`added`, `updated`, `staged`, `unchanged`, `skipped`, `blocked`, `failed`) and counts
          content: {application/json: {schema: {$ref: '#/components/schemas/StarterResult'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
        '422': {$ref: '#/components/responses/Invalid'}
  /endpoint_devices/starter/uninstall:
    post:
      tags: [Technician]
      operationId: starterUninstall
      summary: Remove untouched starter content (starter pack)
      description: Needs `rmm.admin`. Retires starter scripts whose current version is still the pack's (the history stays and a retired script can be restored) and deletes starter policy drafts that are untouched, switched off and unassigned. Anything an administrator changed is left alone. `dry_run` previews.
      security: [{userToken: []}]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/StarterSelection'}
                - type: object
                  properties:
                    dry_run: {type: boolean, default: false}
      responses:
        '200':
          description: Per item outcome (`retired`, `deleted`, `skipped`, or `would_retire` and `would_delete` on a dry run)
          content: {application/json: {schema: {$ref: '#/components/schemas/StarterResult'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
        '422': {$ref: '#/components/responses/Invalid'}
  /endpoint_devices/{id}/patches:
    get:
      tags: [Technician]
      operationId: getDevicePatches
      summary: The patch state of a device and its updates (Phase 4)
      description: |
        Needs `rmm.patch.view`. `summary` holds the last scan (state, manager, Windows Update service state, restart pending, last install), counts by status and kind, the number of critical
        or security updates missing longer than `patch_overdue_days`, and the device's effective patch policy with where each setting came from. `items` are the updates, worst kind first.
        Readable while the `patching` switch is off (`summary.enabled` is then false).
      security: [{userToken: []}]
      parameters:
        - {$ref: '#/components/parameters/DeviceId'}
        - {name: status, in: query, schema: {type: string, enum: [available, approved, declined, installed, failed, missing]}, description: '`missing` is everything not installed'}
        - {name: kind, in: query, schema: {type: string, enum: [critical, security, important, optional, driver, other]}}
        - {name: q, in: query, schema: {type: string}, description: 'Title, update id or KB number contains'}
        - {name: limit, in: query, schema: {type: integer, maximum: 500}}
        - {name: offset, in: query, schema: {type: integer}}
      responses:
        '200': {description: The device's patch state, content: {application/json: {schema: {$ref: '#/components/schemas/DevicePatches'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
  /endpoint_devices/{id}/patches/history:
    get:
      tags: [Technician]
      operationId: getDevicePatchHistory
      summary: Install and dry-run history of a device (Phase 4)
      description: Needs `rmm.patch.view`. One row per update per run, newest first, with the result code the device reported.
      security: [{userToken: []}]
      parameters: [{$ref: '#/components/parameters/DeviceId'}, {name: limit, in: query, schema: {type: integer, maximum: 500}}, {name: offset, in: query, schema: {type: integer}}]
      responses:
        '200': {description: History, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/PatchHistoryRow'}}, total: {type: integer}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
  /endpoint_devices/{id}/patches/scan:
    post:
      tags: [Technician]
      operationId: scanDevicePatches
      summary: Ask a device for a patch scan (Phase 4, `patching` switch)
      description: |
        Needs `rmm.patch.manage`. Queues a signed, read-only `patch_scan` job. `200` with `skipped: already_queued` when one is already waiting; `409 feature_disabled` while the switch is off;
        `409 unsupported` when the agent never announced `patch:scan`. The scheduler asks every device about once a day by itself (limit `patch_scan_interval_s`).
      security: [{userToken: []}]
      parameters: [{$ref: '#/components/parameters/DeviceId'}]
      responses:
        '202': {description: Queued, content: {application/json: {schema: {$ref: '#/components/schemas/Queued'}}}}
        '200': {description: A scan is already waiting, content: {application/json: {schema: {type: object, properties: {skipped: {type: string}, job_id: {type: string}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
        '409': {$ref: '#/components/responses/Conflict'}
  /endpoint_devices/{id}/patches/install:
    post:
      tags: [Technician]
      operationId: installDevicePatches
      summary: Install approved updates, or rehearse it (Phase 4, `patching` switch)
      description: |
        `mode` is `dry_run` unless the body says `install`. A dry run needs `rmm.patch.manage`, lists what a real install would do and changes nothing. A real install needs `rmm.patch.install`
        and `confirm: true`, and takes only updates with status `approved` (or a failed one, by name). `ids` limits it (at most 40); without `ids` every eligible update is taken, at most one job's worth
        (40 ids), the rest follows in a later job (`remaining`). One install job at a time per device (`200 skipped: already_queued`). The agent re-checks every id against a fresh scan, never accepts
        an EULA, never removes a package and never restarts the device. `reboot_policy: if_required_now` queues a separate `reboot` job after a clean install and needs `confirm_reboot: true`
        and `rmm.job.reboot`. `max_minutes` is cut to fit the instance's job timeout (an hour by default).
      security: [{userToken: []}]
      parameters: [{$ref: '#/components/parameters/DeviceId'}]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ids: {type: array, items: {type: string}, maxItems: 40}
                mode: {type: string, enum: [dry_run, install], default: dry_run}
                confirm: {type: boolean}
                reboot_policy: {type: string, enum: [never, if_required_defer, if_required_now], default: never}
                confirm_reboot: {type: boolean}
                max_minutes: {type: integer, minimum: 1, maximum: 240, default: 60}
      responses:
        '202': {description: Queued, content: {application/json: {schema: {type: object, properties: {job_id: {type: string}, mode: {type: string}, queued: {type: integer}, remaining: {type: integer}, ids: {type: array, items: {type: string}}}}}}}
        '200': {description: 'Nothing to do: `skipped` is `nothing_to_install` or `already_queued`', content: {application/json: {schema: {type: object}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {description: '`invalid` or `confirmation_required`', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /endpoint_devices/patches:
    get:
      tags: [Technician]
      operationId: getFleetPatches
      summary: Missing updates across the caller's devices, one row per update (Phase 4)
      description: Needs `rmm.patch.view`. Only the caller's clients are counted. A `client_id` outside them is the same 404 as a missing one.
      security: [{userToken: []}]
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [available, approved, declined, installed, failed], default: available}}
        - {name: client_id, in: query, schema: {type: integer}}
        - {name: limit, in: query, schema: {type: integer, maximum: 500}}
        - {name: offset, in: query, schema: {type: integer}}
      responses:
        '200': {description: Updates, content: {application/json: {schema: {type: object, properties: {enabled: {type: boolean}, items: {type: array, items: {type: object}}, total: {type: integer}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
  /endpoint_devices/patches/compliance:
    get:
      tags: [Technician]
      operationId: getPatchCompliance
      summary: Patch compliance of the caller's devices (Phase 4)
      description: |
        Needs `rmm.patch.view`. A device is non-compliant when a critical or security update (not declined) has been missing longer than `overdue_days` (default: the `patch_overdue_days` limit, 14).
        Also counted: never scanned, no good scan for three scan intervals, restart pending, failed installs, and the ring distribution (exact up to 1000 devices, a sample beyond).
        `group_by` is `client` (default), `site` or `group`.
      security: [{userToken: []}]
      parameters:
        - {name: client_id, in: query, schema: {type: integer}}
        - {name: site_id, in: query, schema: {type: integer}}
        - {name: group_id, in: query, schema: {type: integer}}
        - {name: group_by, in: query, schema: {type: string, enum: [client, site, group]}}
        - {name: overdue_days, in: query, schema: {type: integer, minimum: 0, maximum: 365}}
        - {name: os, in: query, schema: {type: string, enum: [windows, linux]}}
        - {name: limit, in: query, schema: {type: integer, maximum: 500}}
        - {name: offset, in: query, schema: {type: integer}}
      responses:
        '200': {description: Figures, content: {application/json: {schema: {$ref: '#/components/schemas/PatchCompliance'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
        '422': {description: '`invalid`', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /endpoint_devices/patches/approve:
    post:
      tags: [Technician]
      operationId: approvePatches
      summary: Approve updates for installation (Phase 4, `patching` switch)
      description: |
        Needs `rmm.patch.manage`. Approves the named update ids on the caller's devices (narrow with `device_id` or `client_id`). Only available, declined or failed rows change. When the effective
        policy of any device asks for a second person (`two_person`), nothing changes and `202 pending_approval` returns an `approval_id`; someone else with `rmm.job.approve` and `rmm.patch.manage`
        decides it with the ordinary approvals endpoint. `404` when no such update is visible to the caller.
      security: [{userToken: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PatchDecision'}}}
      responses:
        '200': {description: Done, content: {application/json: {schema: {type: object, properties: {matched: {type: integer}, changed: {type: integer}}}}}}
        '202': {description: Waiting for a second person, content: {application/json: {schema: {type: object, properties: {approval_id: {type: integer}, state: {type: string}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {description: '`invalid`', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /endpoint_devices/patches/decline:
    post:
      tags: [Technician]
      operationId: declinePatches
      summary: Decline updates (Phase 4)
      description: Needs `rmm.patch.manage`. A declined update is not installed and never approved by a policy or a rule. A person can approve it again.
      security: [{userToken: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PatchDecision'}}}
      responses:
        '200': {description: Done, content: {application/json: {schema: {type: object, properties: {matched: {type: integer}, changed: {type: integer}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {description: '`invalid`', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /endpoint_devices/patches/rules:
    get:
      tags: [Technician]
      operationId: listPatchRules
      summary: Approval rules (Phase 4)
      description: Needs `rmm.patch.view`. A restricted caller sees the rules of their own clients only.
      security: [{userToken: []}]
      responses:
        '200': {description: Rules, content: {application/json: {schema: {type: object, properties: {rules: {type: array, items: {$ref: '#/components/schemas/PatchRule'}}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Technician]
      operationId: createPatchRule
      summary: Create an approval rule (Phase 4)
      description: 'Needs `rmm.patch.manage`. For example: kinds critical and security, `after_days` 3, ring pilot. A caller restricted to some clients must give `client_id` of one of them.'
      security: [{userToken: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PatchRule'}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {type: object, properties: {rule: {$ref: '#/components/schemas/PatchRule'}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {description: '`invalid`', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /endpoint_devices/patches/rules/{rule_id}:
    put:
      tags: [Technician]
      operationId: updatePatchRule
      summary: Change an approval rule (Phase 4)
      security: [{userToken: []}]
      parameters: [{name: rule_id, in: path, required: true, schema: {type: integer}}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PatchRule'}}}
      responses:
        '200': {description: Saved, content: {application/json: {schema: {type: object, properties: {rule: {$ref: '#/components/schemas/PatchRule'}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
        '422': {description: '`invalid`', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    delete:
      tags: [Technician]
      operationId: deletePatchRule
      summary: Delete an approval rule (Phase 4)
      security: [{userToken: []}]
      parameters: [{name: rule_id, in: path, required: true, schema: {type: integer}}]
      responses:
        '200': {description: Deleted, content: {application/json: {schema: {$ref: '#/components/schemas/Ok'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
  /endpoint_devices/patches/rings:
    get:
      tags: [Technician]
      operationId: listPatchRings
      summary: Rings (Phase 4)
      description: 'Needs `rmm.patch.view`. A ring is a named delay (days) added to every automatic approval of the devices in it. Defaults: pilot 0, broad 7, last 14.'
      security: [{userToken: []}]
      responses:
        '200': {description: Rings, content: {application/json: {schema: {type: object, properties: {rings: {type: array, items: {$ref: '#/components/schemas/PatchRing'}}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Technician]
      operationId: createPatchRing
      summary: Create a ring (Phase 4)
      description: Needs `rmm.patch.manage` and a caller who sees every client (rings apply to all clients).
      security: [{userToken: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PatchRing'}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {type: object, properties: {ring: {$ref: '#/components/schemas/PatchRing'}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {description: '`invalid`', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /endpoint_devices/patches/rings/{ring_id}:
    put:
      tags: [Technician]
      operationId: updatePatchRing
      summary: Change a ring (Phase 4)
      description: A rename is followed by the policies that use the ring.
      security: [{userToken: []}]
      parameters: [{name: ring_id, in: path, required: true, schema: {type: integer}}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PatchRing'}}}
      responses:
        '200': {description: Saved, content: {application/json: {schema: {type: object, properties: {ring: {$ref: '#/components/schemas/PatchRing'}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
        '422': {description: '`invalid`', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    delete:
      tags: [Technician]
      operationId: deletePatchRing
      summary: Delete a ring (Phase 4)
      description: '`409` while a policy or a rule still uses it.'
      security: [{userToken: []}]
      parameters: [{name: ring_id, in: path, required: true, schema: {type: integer}}]
      responses:
        '200': {description: Deleted, content: {application/json: {schema: {$ref: '#/components/schemas/Ok'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /endpoint_devices/patch_policies:
    get:
      tags: [Technician]
      operationId: listPatchPolicies
      summary: Patch policies (Phase 4)
      description: Needs `rmm.patch.view`. Each policy lists its assignments. `settings` names the keys a policy may hold.
      security: [{userToken: []}]
      responses:
        '200': {description: Policies, content: {application/json: {schema: {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/PatchPolicy'}}, rings: {type: array, items: {$ref: '#/components/schemas/PatchRing'}}, settings: {type: array, items: {type: string}}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Technician]
      operationId: createPatchPolicy
      summary: Create a patch policy (Phase 4)
      description: |
        Needs `rmm.patch.manage` and a caller who sees every client. A policy holds only the settings it decides (ring, approval_mode, auto_days_<kind>, install_enabled, window_mode,
        window_maintenance_id, window_days, window_start, window_minutes, window_tz, reboot_policy, reboot_confirm, max_minutes, two_person); the rest comes from a less specific policy or the
        safe defaults (manual approval, nothing installed by the scheduler, no restart). `reboot_confirm: true` (a policy that may restart devices by itself) also needs `rmm.job.reboot` and is recorded
        with the confirming user.
      security: [{userToken: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PatchPolicy'}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {type: object, properties: {policy: {$ref: '#/components/schemas/PatchPolicy'}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {description: '`invalid`', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /endpoint_devices/patch_policies/{policy_id}:
    get:
      tags: [Technician]
      operationId: getPatchPolicy
      summary: One patch policy (Phase 4)
      security: [{userToken: []}]
      parameters: [{name: policy_id, in: path, required: true, schema: {type: integer}}]
      responses:
        '200': {description: The policy, content: {application/json: {schema: {type: object, properties: {policy: {$ref: '#/components/schemas/PatchPolicy'}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
    put:
      tags: [Technician]
      operationId: updatePatchPolicy
      summary: Change a patch policy (Phase 4)
      description: '`PATCH` does the same.'
      security: [{userToken: []}]
      parameters: [{name: policy_id, in: path, required: true, schema: {type: integer}}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PatchPolicy'}}}
      responses:
        '200': {description: Saved, content: {application/json: {schema: {type: object, properties: {policy: {$ref: '#/components/schemas/PatchPolicy'}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
        '422': {description: '`invalid`', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    delete:
      tags: [Technician]
      operationId: deletePatchPolicy
      summary: Delete a patch policy and its assignments (Phase 4)
      security: [{userToken: []}]
      parameters: [{name: policy_id, in: path, required: true, schema: {type: integer}}]
      responses:
        '200': {description: Deleted, content: {application/json: {schema: {$ref: '#/components/schemas/Ok'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
  /endpoint_devices/patch_policies/{policy_id}/assignments:
    post:
      tags: [Technician]
      operationId: assignPatchPolicy
      summary: Assign a patch policy to a scope (Phase 4)
      description: 'Scopes are the Phase 2 ones: global, client, site, group, tag, device. The most specific scope wins per setting; `enforce` locks a setting against more specific scopes; ties inside one scope go to the higher `priority`, then the newer assignment.'
      security: [{userToken: []}]
      parameters: [{name: policy_id, in: path, required: true, schema: {type: integer}}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [scope_type], properties: {scope_type: {type: string, enum: [global, client, site, group, tag, device]}, scope_id: {type: integer}, priority: {type: integer}, enforce: {type: boolean}}}}}
      responses:
        '200': {description: Assigned, content: {application/json: {schema: {type: object, properties: {assignment: {type: object}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
        '422': {description: '`invalid`', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /endpoint_devices/patch_policies/{policy_id}/assignments/{assignment_id}:
    delete:
      tags: [Technician]
      operationId: unassignPatchPolicy
      summary: Remove an assignment (Phase 4)
      security: [{userToken: []}]
      parameters: [{name: policy_id, in: path, required: true, schema: {type: integer}}, {name: assignment_id, in: path, required: true, schema: {type: integer}}]
      responses:
        '200': {description: Removed, content: {application/json: {schema: {$ref: '#/components/schemas/Ok'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
  /endpoint_devices/{id}/deployments:
    get:
      tags: [Technician]
      operationId: getDeviceDeployments
      summary: What a device should have and has, software-wise (Phase 5)
      description: |
        Needs `rmm.software.view`. `counts` by state (`compliant`, `scheduled`, `pending`, `failed`, `missing`, `present`, `unknown`) and one entry per package: the expected action and version,
        the state, the installed version, the ring, the last result. Readable while the `software_deploy` switch is off (`enabled` is then false).
      security: [{userToken: []}]
      parameters: [{$ref: '#/components/parameters/DeviceId'}]
      responses:
        '200': {description: The device's deployment state, content: {application/json: {schema: {type: object, properties: {enabled: {type: boolean}, counts: {type: object}, packages: {type: array, items: {type: object}}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
  /endpoint_devices/{id}/deployments/history:
    get:
      tags: [Technician]
      operationId: getDeviceDeploymentHistory
      summary: Software install and removal history of a device (Phase 5)
      description: Needs `rmm.software.view`. One row per job result, newest first.
      security: [{userToken: []}]
      parameters: [{$ref: '#/components/parameters/DeviceId'}, {name: limit, in: query, schema: {type: integer, maximum: 500}}, {name: offset, in: query, schema: {type: integer}}]
      responses:
        '200': {description: History, content: {application/json: {schema: {type: object, properties: {rows: {type: array, items: {type: object}}, total: {type: integer}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
  /endpoint_devices/{id}/deployments/detect:
    post:
      tags: [Technician]
      operationId: detectDeviceDeployments
      summary: Ask a device which of its assigned packages it has (Phase 5, `software_deploy` switch)
      description: |
        Needs `rmm.software.manage`. Queues a signed, read-only `software_detect` job. `200` with `skipped` `already_queued` or `nothing_to_detect`; `409 feature_disabled` while the switch is off;
        `409 unsupported` when the agent never announced `software:detect`. The scheduler asks every device about once a day by itself (limit `software_detect_interval_s`).
      security: [{userToken: []}]
      parameters: [{$ref: '#/components/parameters/DeviceId'}]
      responses:
        '202': {description: Queued, content: {application/json: {schema: {$ref: '#/components/schemas/Queued'}}}}
        '200': {description: Nothing queued, content: {application/json: {schema: {type: object, properties: {skipped: {type: string}, job_id: {type: string}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
        '409': {$ref: '#/components/responses/Conflict'}
  /endpoint_devices/{id}/deployments/run:
    post:
      tags: [Technician]
      operationId: runDeviceDeployment
      summary: Install or remove a catalog package on a device, or rehearse it (Phase 5, `software_deploy` switch)
      description: |
        `mode` is `dry_run` unless the body says `run`. A dry run needs `rmm.software.manage` and changes nothing. A real run needs `rmm.software.deploy` and `confirm: true`. The job is built
        from the catalog version only: no other body field is a parameter. `version_id` picks a version (default: the newest that is not retired and fits the device). A package marked `two_person`
        answers `202` with `state: pending_approval` and an `approval_id`; the job is queued when someone else approves it. One software install at a time per device (`200 skipped: already_queued`).
        The agent never restarts the device. `409 unsupported` when the agent never announced `software:install`.
      security: [{userToken: []}]
      parameters: [{$ref: '#/components/parameters/DeviceId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [package_id]
              properties:
                package_id: {type: integer}
                action: {type: string, enum: [install, uninstall], default: install}
                version_id: {type: integer}
                mode: {type: string, enum: [dry_run, run], default: dry_run}
                confirm: {type: boolean}
                max_minutes: {type: integer, minimum: 1, maximum: 120, default: 30}
      responses:
        '202': {description: Queued, or waiting for a second person, content: {application/json: {schema: {type: object, properties: {job_id: {type: string}, mode: {type: string}, action: {type: string}, version_id: {type: integer}, approval_id: {type: integer}, state: {type: string}}}}}}
        '200': {description: 'Nothing queued: `skipped` is `already_queued`', content: {application/json: {schema: {type: object}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {description: '`invalid`, `confirmation_required` or the catalog entry no longer passes the checks', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /endpoint_devices/software_packages:
    get:
      tags: [Technician]
      operationId: listSoftwarePackages
      summary: The package catalog (Phase 5)
      description: Needs `rmm.software.view`. Readable while the `software_deploy` switch is off.
      security: [{userToken: []}]
      responses:
        '200': {description: Packages, content: {application/json: {schema: {type: object, properties: {enabled: {type: boolean}, packages: {type: array, items: {type: object}}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
    post:
      tags: [Technician]
      operationId: createSoftwarePackage
      summary: Add a package to the catalog (Phase 5)
      description: Needs `rmm.software.manage` and a scope that sees every client. `two_person` makes every assignment and every real run of this package wait for a second user.
      security: [{userToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, maxLength: 100}
                publisher: {type: string, maxLength: 100}
                description: {type: string, maxLength: 300}
                enabled: {type: boolean, default: true}
                two_person: {type: boolean, default: false}
      responses:
        '201': {description: Created, content: {application/json: {schema: {type: object}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
  /endpoint_devices/software_packages/{package_id}:
    get:
      tags: [Technician]
      operationId: getSoftwarePackage
      summary: One package with its versions (Phase 5)
      description: Needs `rmm.software.view`. A reader without `rmm.software.manage`, or limited to some clients, sees the host of an installer address but not its path.
      security: [{userToken: []}]
      parameters: [{name: package_id, in: path, required: true, schema: {type: integer}}]
      responses:
        '200': {description: The package, content: {application/json: {schema: {type: object}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
    put:
      tags: [Technician]
      operationId: updateSoftwarePackage
      summary: Change a package's name, text, switch or two-person flag (Phase 5)
      description: Needs `rmm.software.manage` and a scope that sees every client. `PATCH` is the same. Versions are not changed here and are never edited.
      security: [{userToken: []}]
      parameters: [{name: package_id, in: path, required: true, schema: {type: integer}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses:
        '200': {description: Saved, content: {application/json: {schema: {type: object}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
        '422': {$ref: '#/components/responses/Invalid'}
    delete:
      tags: [Technician]
      operationId: deleteSoftwarePackage
      summary: Delete a package nothing is assigned to (Phase 5)
      description: Needs `rmm.software.manage` and a scope that sees every client. `409` while an assignment refers to it. Its versions and per-device rows are deleted with it.
      security: [{userToken: []}]
      parameters: [{name: package_id, in: path, required: true, schema: {type: integer}}]
      responses:
        '200': {description: Deleted, content: {application/json: {schema: {type: object}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
        '409': {$ref: '#/components/responses/Conflict'}
  /endpoint_devices/software_packages/{package_id}/versions:
    post:
      tags: [Technician]
      operationId: addSoftwareVersion
      summary: Add a version to a package; it can never be edited afterwards (Phase 5)
      description: |
        Needs `rmm.software.manage` and a scope that sees every client. Linux (`apt`, `dnf`): `pkg_name`, optional `pin_version`. Windows `msi`: `url`, `sha256`, `size_bytes`, `product_code`, optional `detect_min`.
        Windows `exe`: `url`, `sha256`, `size_bytes`, `silent_args`, `detect_kind` (`product_code` or `uninstall_name`), `detect_value`, optional `detect_min`. The address must be https, on a host from the
        allowed list, without user information, port, fragment or query string. Anything else is `422` with the reason.
      security: [{userToken: []}]
      parameters: [{name: package_id, in: path, required: true, schema: {type: integer}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [version, os, fmt]}}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {type: object}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
        '422': {$ref: '#/components/responses/Invalid'}
  /endpoint_devices/software_packages/{package_id}/versions/{version_id}:
    patch:
      tags: [Technician]
      operationId: retireSoftwareVersion
      summary: Retire or restore a version (the only change a version allows) (Phase 5)
      description: 'Needs `rmm.software.manage`. The body is exactly `{"retired": true}` or `{"retired": false}`. A retired version is never installed again but can still be removed.'
      security: [{userToken: []}]
      parameters: [{name: package_id, in: path, required: true, schema: {type: integer}}, {name: version_id, in: path, required: true, schema: {type: integer}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [retired], properties: {retired: {type: boolean}}}}}}
      responses:
        '200': {description: Saved, content: {application/json: {schema: {type: object}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
        '422': {$ref: '#/components/responses/Invalid'}
  /endpoint_devices/software_assignments:
    get:
      tags: [Technician]
      operationId: listSoftwareAssignments
      summary: Assignments of packages to scopes (Phase 5)
      description: Needs `rmm.software.view`. A client-restricted caller sees only the assignments to their own clients and devices.
      security: [{userToken: []}]
      responses:
        '200': {description: Assignments, content: {application/json: {schema: {type: object, properties: {assignments: {type: array, items: {type: object}}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
    post:
      tags: [Technician]
      operationId: assignSoftware
      summary: Assign a package to a scope (Phase 5, `software_deploy` switch)
      description: |
        Needs `rmm.software.deploy`. Devices in the scope are looked at by the next housekeeping pass; the scheduler dry-runs until `software_live_install` is 1. A restricted caller may assign only to
        their own clients and devices; global, site, group and tag scopes need an unrestricted caller. A package with `two_person` answers `202` `pending_approval`: the assignment is saved switched off.
        Removing an assignment uninstalls nothing.
      security: [{userToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [package_id, scope_type]
              properties:
                package_id: {type: integer}
                scope_type: {type: string, enum: [global, client, site, group, tag, device]}
                scope_id: {type: integer}
                action: {type: string, enum: [install, uninstall], default: install}
                version_id: {type: integer}
      responses:
        '201': {description: Assigned, content: {application/json: {schema: {type: object}}}}
        '202': {description: Waiting for a second person, content: {application/json: {schema: {type: object}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
  /endpoint_devices/software_assignments/{assignment_id}:
    delete:
      tags: [Technician]
      operationId: unassignSoftware
      summary: Remove an assignment; nothing is uninstalled (Phase 5)
      description: Needs `rmm.software.deploy`. Another client's assignment is the same 404 as a missing one.
      security: [{userToken: []}]
      parameters: [{name: assignment_id, in: path, required: true, schema: {type: integer}}]
      responses:
        '200': {description: Removed, content: {application/json: {schema: {type: object}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
  /endpoint_devices/software_hosts:
    get:
      tags: [Technician]
      operationId: listSoftwareHosts
      summary: The host names installers may be downloaded from (Phase 5)
      description: Needs `rmm.software.view`.
      security: [{userToken: []}]
      responses:
        '200': {description: Hosts, content: {application/json: {schema: {type: object, properties: {hosts: {type: array, items: {type: object}}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
    post:
      tags: [Technician]
      operationId: allowSoftwareHost
      summary: Allow downloads from a host (Phase 5, `software_deploy` switch)
      description: Needs `rmm.admin` and a scope that sees every client. A plain DNS host name; no scheme, port, path, wildcard or IP address.
      security: [{userToken: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [host], properties: {host: {type: string}, note: {type: string, maxLength: 120}}}}}}
      responses:
        '201': {description: Allowed, content: {application/json: {schema: {type: object}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
        '422': {$ref: '#/components/responses/Invalid'}
  /endpoint_devices/software_hosts/{host}:
    delete:
      tags: [Technician]
      operationId: removeSoftwareHost
      summary: Stop allowing downloads from a host (Phase 5)
      description: Needs `rmm.admin` and a scope that sees every client. Versions that download from it are refused when a job is next built.
      security: [{userToken: []}]
      parameters: [{name: host, in: path, required: true, schema: {type: string}}]
      responses:
        '200': {description: Removed, content: {application/json: {schema: {type: object}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
  /endpoint_devices/software_report:
    get:
      tags: [Technician]
      operationId: getSoftwareReport
      summary: Deployed versus expected (Phase 5)
      description: |
        Needs `rmm.software.view`. `group_by` is `package` (default), `client`, `ring` or `device`. The first three give `expected`, a count per state and `percent_compliant` per row and in `totals`;
        `device` gives one row per device and package (`state` filters it). Only the caller's clients are counted; a `client_id` outside them is the same 404 as a missing one.
      security: [{userToken: []}]
      parameters:
        - {name: group_by, in: query, schema: {type: string, enum: [package, client, ring, device]}}
        - {name: client_id, in: query, schema: {type: integer}}
        - {name: package_id, in: query, schema: {type: integer}}
        - {name: ring, in: query, schema: {type: string}}
        - {name: state, in: query, schema: {type: string, enum: [compliant, scheduled, pending, failed, missing, present, unknown]}}
        - {name: limit, in: query, schema: {type: integer, maximum: 1000}}
        - {name: offset, in: query, schema: {type: integer}}
      responses:
        '200': {description: Figures, content: {application/json: {schema: {type: object}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
        '422': {$ref: '#/components/responses/Invalid'}
  /endpoint_devices/software_report/csv:
    get:
      tags: [Technician]
      operationId: getSoftwareReportCsv
      summary: The same report as CSV (Phase 5)
      description: Needs `rmm.software.view`. `text/csv`, CRLF; a cell that starts with `=`, `+`, `-`, `@`, a tab or a CR gets a leading apostrophe. Same parameters as the JSON report.
      security: [{userToken: []}]
      parameters:
        - {name: group_by, in: query, schema: {type: string, enum: [package, client, ring, device]}}
        - {name: client_id, in: query, schema: {type: integer}}
        - {name: package_id, in: query, schema: {type: integer}}
        - {name: ring, in: query, schema: {type: string}}
        - {name: state, in: query, schema: {type: string}}
      responses:
        '200': {description: The report, content: {text/csv: {schema: {type: string}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
  /endpoint_devices/changes:
    get:
      tags: [Technician]
      operationId: searchChanges
      summary: Search the recorded changes of the caller's clients (change monitoring)
      description: |
        Needs `rmm.change.view`. A window of at most 30 days, newest first. `device_id` and `client_id` narrow it; a device or client outside the caller's clients is the same 404 as a missing one.
      security: [{userToken: []}]
      parameters:
        - {name: device_id, in: query, schema: {type: integer}}
        - {name: client_id, in: query, schema: {type: integer}}
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
        - {name: kind, in: query, schema: {type: string, enum: [registry, file, group, task]}}
        - {name: watch, in: query, schema: {type: string}}
        - {name: change, in: query, schema: {type: string, enum: [added, modified, removed]}}
        - {name: target, in: query, description: 'Part of the key, file path or group (case-insensitive)', schema: {type: string}}
        - {name: item, in: query, description: 'Part of the value name, member or task path', schema: {type: string}}
        - {name: actor, in: query, schema: {type: string}}
        - {name: q, in: query, description: 'Part of the target, item, either value or the summary', schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, maximum: 500}}
        - {name: offset, in: query, schema: {type: integer}}
      responses:
        '200': {description: Done, content: {application/json: {schema: {type: object}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
  /endpoint_devices/changes/stats:
    get:
      tags: [Technician]
      operationId: getChangeStats
      summary: Change storage figures
      description: |
        Needs `rmm.change.view`. Rows stored against the fleet cap, the caps and the last day's changes by watch.
      security: [{userToken: []}]
      responses:
        '200': {description: Done, content: {application/json: {schema: {type: object}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
  /endpoint_devices/changes/settings:
    put:
      tags: [Technician]
      operationId: updateChangeSettings
      summary: Change the change-monitoring settings
      description: |
        `presets` and `custom` need `rmm.change.manage` (and access to every client: a watch applies to all); `features` (the `change_monitor` switch) and `limits` need `rmm.admin`.
        Turning the switch on needs `accept_change_storage: true`, else `422 confirmation_required` with the plain-language text. Custom watches pass the watch policy; a refusal changes nothing.
      security: [{userToken: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, additionalProperties: false, properties: {features: {type: object, properties: {change_monitor: {type: boolean}}}, presets: {type: object, properties: {windows: {type: array, items: {type: string}}, linux: {type: array, items: {type: string}}}}, custom: {type: array, maxItems: 30, items: {type: object}}, limits: {type: object, additionalProperties: {type: integer}}, accept_change_storage: {type: boolean}}}}}
      responses:
        '200': {description: Saved, content: {application/json: {schema: {type: object}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Invalid'}
    get:
      tags: [Technician]
      operationId: getChangeSettings
      summary: The change-monitoring settings
      description: |
        Needs `rmm.change.view`. The preset catalog with what is on (`enabled`), custom watches, the limits, the plain-language storage warning and the worst-case sizes those limits allow.
      security: [{userToken: []}]
      responses:
        '200': {description: Done, content: {application/json: {schema: {type: object}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
  /endpoint_devices/changes/rules:
    post:
      tags: [Technician]
      operationId: createChangeRule
      summary: Create a change rule
      description: |
        Needs `rmm.change.manage`; a rule for all clients (`client_id` 0) needs access to all clients. Fields: `name`, `enabled`, `client_id`, `watch`, `kind`, `target_contains`, `item_contains`,
        `change` (any, added, modified, removed), `threshold`, `window_min`, `severity` (warn, fail), `resolve_after_min`. Never a regular expression.
      security: [{userToken: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, additionalProperties: true}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {type: object}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
        '422': {$ref: '#/components/responses/Invalid'}
    get:
      tags: [Technician]
      operationId: listChangeRules
      summary: List the change rules
      description: |
        Needs `rmm.change.view`. A caller limited to some clients sees only the rules of those clients. A rule drives the check `change.rule_<id>` through the alert engine.
      security: [{userToken: []}]
      responses:
        '200': {description: Done, content: {application/json: {schema: {type: object}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
  /endpoint_devices/changes/rules/recommended:
    post:
      tags: [Technician]
      operationId: installRecommendedChangeRules
      summary: Create the recommended change rules
      description: |
        Needs `rmm.change.manage`. One rule per preset that suggests one (any change to the startup entries, the Defender exclusions, Remote Desktop, sshd, sudo and the account files; an added local administrator). Created once each, never duplicated. Body: `{client_id?}`.
      security: [{userToken: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, additionalProperties: true}}}
      responses:
        '200': {description: Done, content: {application/json: {schema: {type: object}}}}
        '201': {description: Created, content: {application/json: {schema: {type: object}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
        '422': {$ref: '#/components/responses/Invalid'}
  /endpoint_devices/{id}/changes:
    get:
      tags: [Technician]
      operationId: getDeviceChanges
      summary: Search the recorded changes of one device
      description: |
        Needs `rmm.change.view`. Up to 365 days, newest first.
      security: [{userToken: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
        - {name: kind, in: query, schema: {type: string, enum: [registry, file, group, task]}}
        - {name: watch, in: query, schema: {type: string}}
        - {name: change, in: query, schema: {type: string, enum: [added, modified, removed]}}
        - {name: target, in: query, description: 'Part of the key, file path or group (case-insensitive)', schema: {type: string}}
        - {name: item, in: query, description: 'Part of the value name, member or task path', schema: {type: string}}
        - {name: actor, in: query, schema: {type: string}}
        - {name: q, in: query, description: 'Part of the target, item, either value or the summary', schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, maximum: 500}}
        - {name: offset, in: query, schema: {type: integer}}
      responses:
        '200': {description: Done, content: {application/json: {schema: {type: object}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
  /endpoint_devices/{id}/changes/timeline:
    get:
      tags: [Technician]
      operationId: getDeviceChangeTimeline
      summary: Who changed what on one device
      description: |
        Needs `rmm.change.view`. The device's recorded changes and, when the software inventory is collected, its installs, removals and version changes (`source` is `agent` or `inventory`), newest first, with the people Windows recorded (`actors`; the empty actor is "unknown") and a count per day.
      security: [{userToken: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
        - {name: limit, in: query, schema: {type: integer, maximum: 500}}
      responses:
        '200': {description: Done, content: {application/json: {schema: {type: object}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
  /endpoint_devices/{id}/changes/status:
    get:
      tags: [Technician]
      operationId: getDeviceChangeStatus
      summary: What a device is told to watch and what it reported
      description: |
        Needs `rmm.change.view`. The watch ids of the device's platform, its row counters, the configuration version it runs and the status its agent last sent.
      security: [{userToken: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {description: Done, content: {application/json: {schema: {type: object}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrDisabled'}
components:
  securitySchemes:
    deviceAuth:
      type: http
      scheme: bearer
      description: The per-device credential issued by POST /agent_enroll (256 random bits as 64 hex characters, only its SHA-256 stored, rotatable and revocable). Not a user token.
    userToken:
      type: http
      scheme: bearer
      description: A user API token of the edition. The edition authenticates it and passes the user to Core; the legacy shared key is refused.
  parameters:
    DeviceId:
      name: id
      in: path
      required: true
      schema: {type: integer}
  responses:
    Ok:
      description: Done
      content: {application/json: {schema: {$ref: '#/components/schemas/Ok'}}}
    Unauthenticated:
      description: 'Credential or token not accepted: `code` is `invalid_token`, `revoked` or `expired`'
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Unauthorized:
      description: No valid user token
      content: {application/json: {schema: {type: object, properties: {error: {type: string, const: Unauthorized}}}}}
    Forbidden:
      description: 'The role cannot do this (`forbidden`; the message names the missing grant) or the module is not enabled for the caller'
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    NotFoundOrDisabled:
      description: 'Device not found or outside the caller''s clients (`not_found`), or the module is switched off (`disabled`)'
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    MethodNotAllowed:
      description: Wrong method (`method_not_allowed`; `Allow` lists the right ones)
      headers: {Allow: {schema: {type: string}}}
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    TooLarge:
      description: 'Body over the cap (`too_large`)'
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Invalid:
      description: 'Invalid body or parameters (`invalid`)'
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Conflict:
      description: 'The request does not fit the state of the record (`conflict`)'
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    TlsRequired:
      description: 'Plain http (`tls_required`)'
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    RateLimited:
      description: 'Too many requests (`rate_limited`)'
      headers: {Retry-After: {schema: {type: integer}}}
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    ModuleDisabled:
      description: 'The module (`module_disabled`) or this feature (`feature_disabled`) is switched off; the agent keeps its credential and buffer and retries after `Retry-After` (3600)'
      headers: {Retry-After: {schema: {type: integer}}}
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  schemas:
    DevicePatches:
      type: object
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/PatchUpdate'}}
        total: {type: integer}
        summary:
          type: object
          description: 'enabled, scan{state, scanned_at, manager, wu_state, reboot_pending, last_install_at, truncated, error}, counts{by_status, missing_by_kind, missing, reboot_required}, overdue{days, critical_or_security}, compliant, policy{ring, ring_delay_days, approval_mode, auto_days, install_enabled, window, reboot_policy, max_minutes, two_person, sources, live_install}'
    PatchUpdate:
      type: object
      properties:
        update_id: {type: string, description: 'Windows: the Windows Update id (a GUID); Linux: the package name'}
        kb: {type: string}
        title: {type: string}
        kind: {type: string, enum: [critical, security, important, optional, driver, other]}
        severity: {type: string, enum: [critical, important, moderate, low, unspecified]}
        size_bytes: {type: integer}
        reboot_required: {type: boolean}
        released_at: {type: [string, 'null']}
        eula_accepted: {type: boolean}
        version: {type: string}
        current_version: {type: string}
        status: {type: string, enum: [available, approved, declined, installed, failed]}
        status_source: {type: string, description: 'scan, manual, policy, rule:<id>, install or not_applicable'}
        first_seen_at: {type: string}
        fail_count: {type: integer}
    PatchHistoryRow:
      type: object
      properties:
        update_id: {type: string}
        title: {type: string}
        action: {type: string, enum: [install, dry_run]}
        result: {type: string, enum: [would_install, installed, needs_reboot, failed, skipped, not_applicable, eula_required, not_found, locked]}
        code: {type: string}
        detail: {type: string}
        at: {type: string}
        job_id: {type: [string, 'null']}
        user_id: {type: [integer, 'null']}
    PatchDecision:
      type: object
      required: [update_ids]
      properties:
        update_ids: {type: array, items: {type: string}, minItems: 1, maxItems: 200}
        device_id: {type: integer}
        client_id: {type: integer}
        reason: {type: string, maxLength: 200}
    PatchCompliance:
      type: object
      properties:
        enabled: {type: boolean}
        overdue_days: {type: integer}
        group_by: {type: string}
        summary: {type: object, description: 'devices, compliant, noncompliant, never_scanned, stale, reboot_pending, failed_installs, missing_critical, missing_total, compliance_pct'}
        groups: {type: array, items: {type: object}}
        devices: {type: array, items: {type: object}, description: 'Non-compliant devices and devices with failed installs'}
        rings: {type: object, description: '{counts: {ring: devices}, exact}'}
    PatchRule:
      type: object
      properties:
        rule_id: {type: integer}
        name: {type: string}
        enabled: {type: boolean}
        ring: {type: [string, 'null']}
        kinds: {type: array, items: {type: string}}
        severities: {type: array, items: {type: string}}
        after_days: {type: integer, minimum: 0, maximum: 365}
        client_id: {type: integer}
    PatchRing:
      type: object
      properties:
        ring_id: {type: integer}
        name: {type: string, pattern: '^[a-z][a-z0-9_-]{0,38}$'}
        delay_days: {type: integer, minimum: 0, maximum: 365}
        sort_order: {type: integer}
        description: {type: string}
    PatchPolicy:
      type: object
      properties:
        policy_id: {type: integer}
        name: {type: string}
        description: {type: string}
        enabled: {type: boolean}
        settings: {type: object, additionalProperties: true}
        assignments: {type: array, items: {type: object}}
    Queued:
      type: object
      properties:
        job_id: {type: string}
    RemoteSnapshot:
      type: object
      properties:
        job_id: {type: [string, 'null']}
        state: {type: string, description: 'none, queued, running, succeeded, failed, timed_out, cancelled or expired'}
        requested_at: {type: [string, 'null']}
        finished_at: {type: [string, 'null']}
        data: {type: [object, 'null'], description: 'The document the agent reported: {v, platform, truncated, count, services[]} or {v, sampled_ms, count, truncated, processes[]}'}
        error: {type: [string, 'null']}
    Transfer:
      type: object
      properties:
        transfer_id: {type: string}
        device_id: {type: integer}
        direction: {type: string, enum: [download, upload], description: 'download = device to server'}
        path: {type: string}
        file_name: {type: string}
        state: {type: string, enum: [awaiting_content, queued, receiving, delivering, complete, failed, expired, deleted]}
        size_bytes: {type: integer}
        sha256: {type: [string, 'null']}
        job_id: {type: [string, 'null']}
        job_state: {type: [string, 'null']}
        error: {type: string}
        created_by: {type: integer}
        created_at: {type: string}
        expires_at: {type: string}
        completed_at: {type: [string, 'null']}
    RemoteSettings:
      type: object
      properties:
        features: {type: object, properties: {remote_tools: {type: boolean}, filetransfer: {type: boolean}, logs: {type: boolean}}}
        transfer_allow: {type: object, properties: {linux: {type: array, items: {type: string}}, windows: {type: array, items: {type: string}}}}
        logs_collect: {type: object}
        limits: {type: object, additionalProperties: {type: integer}}
        file_transfer_risk: {type: string}
        logs_storage_warning: {type: string}
        logs_worst_case_bytes_per_device: {type: integer}
        logs_fleet_cap_bytes: {type: integer}
        transfer_storage_error: {type: [string, 'null']}
    MeshAgentSettings:
      type: object
      properties:
        mesh_enabled: {type: boolean}
        mesh_url: {type: string}
        mesh_group_id: {type: string, description: Canonical lower-case hex of the group id; empty when not set}
        mesh_group_id_url: {type: string, description: "The group id in MeshCentral's 64-character URL form (what the installer carries); empty when not set"}
        warnings: {type: array, items: {type: string}, description: 'Present on a save: for example a pasted address for a host other than mesh_url'}
        mesh_server_cert_pin: {type: string, description: 'SHA-384 (96) or SHA-256 (64) hex; empty = verify with the system trust store'}
        mesh_auto_map_overwrite: {type: boolean}
        mesh_agent_ids: {type: object, additionalProperties: {type: integer}, description: The administrator's corrections only}
        mesh_install_args: {type: object, additionalProperties: {type: array, items: {type: string}}}
        mesh_hide: {type: integer, minimum: 0, maximum: 255, default: 31, description: "MeshCentral 'hide' bitmask appended to the desktop launch URL (0 = none)"}
        mesh_hide_tools: {type: [integer, 'null'], minimum: 0, maximum: 255, description: 'The same for terminal and files; null = same as mesh_hide'}
        effective_agent_ids: {type: object, additionalProperties: {type: integer}, description: 'Built-in plus corrections: what an installer carries'}
        effective_install_args: {type: object, additionalProperties: {type: array, items: {type: string}}}
        default_agent_ids: {type: object, additionalProperties: {type: integer}}
        install_ready: {type: boolean}
        install_refusal: {type: [string, 'null']}
        note: {type: string}
        pin_probe:
          type: object
          description: Only when `probe_pin` was sent
          properties:
            ok: {type: boolean}
            pin: {type: string}
            sha256: {type: string}
            subject: {type: string}
            not_after: {type: string}
            error: {type: string}
    MeshAgentReport:
      type: object
      required: [installed]
      description: 'Optional, additive (1.0.0-rc.12): the state of the MeshCentral agent on the device. Sent on the first check-in after it changes and then daily; absent on a device with no Mesh agent. Never an error for the check-in.'
      properties:
        installed: {type: boolean}
        version: {type: string, maxLength: 60}
        node_id: {type: string, description: 'A MeshCentral node id in any spelling: `node//` plus 64 characters (MeshCentral URL form) or 96 hex characters, with or without the prefix, or (legacy) `node//` plus 16 to 100 characters of A-Za-z0-9@$_-; the server stores `node//<64 characters>`; anything else is ignored'}
        error: {type: string, maxLength: 300, description: Why the install failed; read only while installed is false}
    ChangeRecord:
      type: object
      required: [ts, kind, watch, change, target]
      properties:
        ts: {type: string, format: date-time, description: 'When the agent detected the change'}
        kind: {type: string, enum: [registry, file, group, task]}
        watch: {type: string, description: 'The id of a watch in the device''s current configuration', pattern: '^(win|lnx|custom)\.[a-z0-9_]{1,40}$'}
        change: {type: string, enum: [added, modified, removed]}
        target: {type: string, maxLength: 300, description: 'Registry key, file path, group:<name> or scheduled-tasks'}
        item: {type: string, maxLength: 200}
        old: {type: string, maxLength: 512}
        new: {type: string, maxLength: 512}
        summary: {type: string, maxLength: 200}
        old_hash: {type: string, pattern: '^[0-9a-f]{64}$'}
        new_hash: {type: string, pattern: '^[0-9a-f]{64}$'}
        actor: {type: string, maxLength: 120}
        process: {type: string, maxLength: 200}
        redacted: {type: boolean}
        truncated: {type: boolean}
    LogEvent:
      type: object
      required: [ts, level, message]
      properties:
        ts: {type: string, format: date-time}
        level: {type: string, enum: [critical, error, warning, info, debug, verbose]}
        source: {type: string, maxLength: 100}
        event_id: {type: [integer, 'null']}
        message: {type: string, description: 'Truncated to 1024 characters; control characters become spaces; credential-shaped text is redacted before it is stored'}
    LogSearch:
      type: object
      properties:
        items: {type: array, items: {type: object, properties: {event_id: {type: integer}, device_id: {type: integer}, hostname: {type: string}, client_id: {type: integer}, occurred_at: {type: string}, level: {type: string}, source: {type: string}, code: {type: [integer, 'null']}, message: {type: string}}}}
        total: {type: integer, description: 'Counted up to 10001'}
        from: {type: string}
        to: {type: string}
    LogRuleInput:
      type: object
      properties:
        name: {type: string, maxLength: 100}
        enabled: {type: boolean}
        client_id: {type: integer, description: '0 = all clients'}
        min_level: {type: string, enum: [critical, error, warning, info, debug], description: 'This severity or worse'}
        source_contains: {type: string, maxLength: 100}
        code: {type: [integer, 'null']}
        contains: {type: string, maxLength: 200}
        threshold: {type: integer, minimum: 1, maximum: 1000}
        window_min: {type: integer, minimum: 1, maximum: 1440}
        severity: {type: string, enum: [warn, fail]}
        resolve_after_min: {type: integer, minimum: 1, maximum: 10080}
    LogRule:
      allOf:
        - {$ref: '#/components/schemas/LogRuleInput'}
        - type: object
          properties:
            rule_id: {type: integer}
            check_key: {type: string, description: 'log.rule_<id>'}
            created_at: {type: string}
            updated_at: {type: string}
    Ok:
      type: object
      required: [ok]
      properties:
        ok: {type: boolean}
    Error:
      type: object
      required: [error, code]
      properties:
        error: {type: string, description: 'For humans; may change'}
        code:
          type: string
          description: The contract. One of the codes listed in PROTOCOL.md.
          enum: [invalid_token, revoked, expired, forbidden, not_found, method_not_allowed, conflict, too_large, invalid, tls_required, rate_limited, internal, unavailable, token_in_url, device_limit, module_disabled, feature_disabled, confirmation_required, device_offline, unmapped, not_configured, device_retired, mesh_unavailable, disabled, protected, unsupported, path_denied, checksum_mismatch]
    EnrollRequest:
      type: object
      required: [enrollment_token, device]
      properties:
        enrollment_token: {type: string, description: 'rvte1.<12 hex>.<40 hex>'}
        device:
          type: object
          required: [install_id, hostname, os, os_version, arch, agent_version]
          properties:
            install_id: {type: string, format: uuid}
            machine_guid: {type: [string, 'null']}
            hostname: {type: string}
            os: {type: string, enum: [windows, linux]}
            os_version: {type: string}
            arch: {type: string, enum: [amd64, arm64]}
            serial: {type: [string, 'null']}
            manufacturer: {type: [string, 'null']}
            model: {type: [string, 'null']}
            mac_addresses: {type: array, items: {type: string}}
            agent_version: {type: string}
    EnrollResponse:
      type: object
      required: [device_id, device_token, check_in_interval_s, server_time, status, signing_public_key, signing_key_id, config]
      properties:
        device_id: {type: integer}
        device_token: {type: string, description: Shown once}
        check_in_interval_s: {type: integer}
        server_time: {type: string, format: date-time}
        status: {type: string, enum: [linked, pending_approval, ambiguous]}
        matched_asset_id: {type: [integer, 'null']}
        signing_public_key: {type: string, description: Base64 Ed25519 public key; the agent pins it}
        signing_key_id: {type: string, description: 'First 16 hex characters of SHA-256 over the base64 text of the public key'}
        config: {$ref: '#/components/schemas/AgentConfig'}
    AgentConfig:
      type: object
      properties:
        checks:
          type: array
          items:
            type: object
            required: [key, type, params, interval_s, signature]
            properties:
              key: {type: string}
              type: {type: string, enum: [service, disk, pending_reboot, script, cpu, memory, process, port, ping, http, cert, ntp, smart, av, systemd_failed, inodes], description: 'The four original types go to every agent; a Phase 3 type only to an agent that announced `check:<type>`'}
              params: {type: object}
              interval_s: {type: integer}
              signature: {type: string, description: Ed25519 over the canonical JSON of the other fields}
        collect_interval_s: {type: integer}
        policy:
          type: object
          description: 'Phase 2, additive. The effective policy the server resolved for this device. Present only for a device that announced `policies` while the `policies` sub-switch is on (its checks and intervals are already in the fields above). See PROTOCOL.md 3.2.2'
          required: [version, applied]
          properties:
            version: {type: string, pattern: '^[0-9a-f]{64}$', description: 'SHA-256 of the effective configuration; changes when anything the device is told changes'}
            applied: {type: boolean, description: 'false: no policy reaches this device, it is told the instance configuration'}
            features:
              type: object
              description: 'The toggles the agent also enforces locally'
              properties:
                software_inventory: {type: boolean}
                script_checks: {type: boolean}
                checks: {type: boolean}
    CheckinRequest:
      type: object
      required: [seq, collected_at, agent_version]
      properties:
        seq: {type: integer, minimum: 0}
        collected_at: {type: string, format: date-time}
        agent_version: {type: string}
        inventory: {type: [object, 'null'], description: 'At most 65536 bytes'}
        metrics:
          type: [object, 'null']
          properties:
            cpu_pct: {type: [number, 'null']}
            mem_pct: {type: [number, 'null']}
            disk:
              type: array
              items:
                type: object
                properties:
                  mount: {type: string}
                  used_pct: {type: [number, 'null']}
                  free_bytes: {type: integer, minimum: 0, description: 'rc.25, optional'}
                  total_bytes: {type: integer, minimum: 0, description: 'rc.25, optional'}
            net_rx_bps: {type: [number, 'null']}
            net_tx_bps: {type: [number, 'null']}
            mem_used_bytes: {type: integer, minimum: 0, description: 'rc.25, optional'}
            mem_available_bytes: {type: integer, minimum: 0, description: 'rc.25, optional'}
            mem_total_bytes: {type: integer, minimum: 0, description: 'rc.25, optional'}
            uptime_s: {type: integer, minimum: 0, description: 'rc.25, optional'}
            pending_reboot: {type: integer, enum: [0, 1], description: 'rc.25, optional'}
            cpu_core_pct: {type: array, maxItems: 256, items: {type: number, minimum: 0, maximum: 100}, description: 'rc.25, optional, per logical core'}
            disk_read_iops: {type: number, minimum: 0, description: 'rc.25, optional'}
            disk_write_iops: {type: number, minimum: 0, description: 'rc.25, optional'}
            disk_queue: {type: number, minimum: 0, description: 'rc.25, optional'}
            net_errors: {type: integer, minimum: 0, description: 'rc.25, optional, since the previous sample'}
            battery_pct: {type: number, minimum: 0, maximum: 100, description: 'rc.25, optional, only with a battery'}
            battery_charging: {type: integer, enum: [0, 1], description: 'rc.25, optional, accepted and not mapped'}
        checks:
          type: array
          maxItems: 100
          items:
            type: object
            required: [key, status]
            properties:
              key: {type: string}
              status: {type: string, enum: [ok, warn, fail, unknown]}
              detail: {type: string}
              value: {type: number, description: 'Optional, additive (Phase 3): the number the check measured (ms, percent, days, count). With server-side thresholds the server compares it; absent when nothing was measured. Ignored by a server without thresholds.'}
        buffered:
          type: array
          maxItems: 100
          items: {type: object, description: 'A sample taken while offline: collected_at, metrics, checks'}
        update_result:
          type: [object, 'null']
          properties:
            version: {type: string}
            state: {type: string, enum: [ok, failed, rolled_back]}
            detail: {type: string}
        platform: {type: string, enum: [windows, linux], description: 'Optional, additive (agent 0.1.0-beta.2 and later)'}
        arch: {type: string, enum: [amd64, arm64], description: Optional, additive}
        capabilities:
          type: array
          maxItems: 64
          items: {type: string, maxLength: 64}
          description: 'Optional, additive. `job:<type>`, `check:<type>` and, since Phase 1, `software_inventory`; since 1.0.0-rc.12 `mesh:nodeid` (the agent can report the local MeshCentral node id). A list that is not usable is ignored, never an error.'
        software:
          $ref: '#/components/schemas/SoftwareReport'
        mesh_agent:
          $ref: '#/components/schemas/MeshAgentReport'
    CheckinResponse:
      type: object
      required: [ok, status, next_check_in_s, jobs_pending, config, server_time, signing_key_id]
      properties:
        ok: {type: boolean}
        status: {type: string, enum: [linked, pending_approval]}
        matched_asset_id: {type: [integer, 'null']}
        next_check_in_s: {type: integer}
        jobs_pending: {type: integer}
        config: {$ref: '#/components/schemas/AgentConfig'}
        update:
          type: [object, 'null']
          description: Absent while the updates sub-switch is off
          properties:
            version: {type: string}
            url: {type: string}
            sha256: {type: string}
            signature: {type: string, description: Base64 Ed25519 over the lowercase hex SHA-256 text}
            min_version: {type: string}
        server_time: {type: string, format: date-time}
        signing_key_id: {type: string}
        features:
          type: array
          items: {type: string, enum: [policies, software_inventory]}
          description: 'Additive. `software_inventory` (Phase 1): only for a device that announced it while the `inventory_software` sub-switch is on; the agent sends `software` only after it has seen it. `policies` (Phase 2): only for a device that announced it while the `policies` sub-switch is on; `config.policy` accompanies it'
        resync:
          type: array
          items: {type: string, enum: [software]}
          description: 'Phase 1, additive. Present only together with `features`, when the module wants a full list (a refused delta, a mismatch, load shedding, a technician refresh)'
    SoftwareReport:
      type: object
      required: [mode, hash]
      description: 'See PROTOCOL.md 3.2.1. At most 5000 items; the agent sends at most 3000.'
      properties:
        mode: {type: string, enum: [full, delta]}
        hash: {type: string, pattern: '^[0-9a-f]{64}$', description: Hash of the complete list after this report}
        base_hash: {type: string, pattern: '^[0-9a-f]{64}$', description: 'delta only: the hash the delta applies to'}
        count: {type: integer}
        truncated: {type: boolean, description: 'The agent cut the list at its caps; absent items are then not treated as removed'}
        items:
          type: array
          maxItems: 5000
          items:
            type: object
            required: [name, source]
            properties:
              name: {type: string, maxLength: 200}
              version: {type: string, maxLength: 100}
              publisher: {type: string, maxLength: 200}
              source: {type: string, enum: [registry, registry32, appx, dpkg, rpm, snap, flatpak]}
              installed: {type: string, format: date}
        removed:
          type: array
          items:
            type: object
            properties:
              source: {type: string}
              name: {type: string}
    Job:
      type: object
      required: [job_id, device_id, attempt, type, script, params, timeout_s, max_output_bytes, issued_at, expires_at, signature]
      properties:
        job_id: {type: string, format: uuid}
        device_id: {type: integer}
        attempt: {type: integer}
        type: {type: string, description: 'powershell (Windows), shell (Linux, bash), python (Linux, python3), reboot, collect (a registry can add types). A parameter is also in the environment as RIVETIT_PARAM_<name> and, for a lower-case name, defined as a script variable; see PROTOCOL.md 3.3'}
        script: {type: [string, 'null']}
        params: {type: object}
        timeout_s: {type: integer}
        max_output_bytes: {type: integer}
        issued_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        signature: {type: string, description: Base64 Ed25519 over the canonical JSON of all other fields (the signature covers the attempt)}
    JobReport:
      type: object
      required: [job_id, attempt, state]
      properties:
        job_id: {type: string, format: uuid}
        attempt: {type: integer, minimum: 1}
        state: {type: string, enum: [running, succeeded, failed, timed_out, cancelled]}
        exit_code: {type: [integer, 'null']}
        output: {type: string}
        started_at: {type: [string, 'null'], format: date-time}
        finished_at: {type: [string, 'null'], format: date-time}
    InstallerRequest:
      type: object
      required: [arch]
      properties:
        token: {type: string, description: 'rvte1.<selector>.<secret>; may instead be sent as an Authorization bearer header'}
        arch: {type: string, enum: [amd64, arm64]}
        format: {type: string, enum: [exe, msi], default: exe, description: 'The installer format (1.0.0-rc.16). `msi` returns a copy of the published MSI template for the architecture with the same payload trailer appended; `409 unavailable` when none is published.'}
    DeviceSummary:
      type: object
      required: [device_id, hostname, asset_id, client_id, link_state, status, last_checkin_at, offline_since, agent_version, ring, os_version, revoked, retired]
      properties:
        device_id: {type: integer}
        hostname: {type: string}
        asset_id: {type: [integer, 'null']}
        client_id: {type: integer}
        link_state: {type: string, enum: [linked, pending_approval, rejected]}
        status: {type: string, enum: [online, offline, stale, never]}
        last_checkin_at: {type: [string, 'null'], format: date-time}
        offline_since: {type: [string, 'null'], format: date-time}
        agent_version: {type: string}
        ring: {type: string, enum: [pilot, stable]}
        os_version: {type: string}
        revoked: {type: boolean}
        retired: {type: boolean}
    DeviceDetail:
      allOf:
        - {$ref: '#/components/schemas/DeviceSummary'}
        - type: object
          properties:
            serial: {type: [string, 'null']}
            manufacturer: {type: [string, 'null']}
            model: {type: [string, 'null']}
            arch: {type: string}
            logged_in_user: {type: [string, 'null']}
            pending_reboot: {type: [boolean, 'null']}
            uptime_s: {type: [integer, 'null']}
            last_collected_at: {type: [string, 'null'], format: date-time}
            inventory: {type: [object, 'null']}
            metrics: {type: [object, 'null']}
            clock: {type: object, description: 'Present once a clock skew was measured or a check-in was refused for its time (1.0.0-rc.23). skew_s is the device collected_at minus the server time (positive = the device is ahead); agent_offset_s is the agent own estimate of server minus local; last_reject says why the last check-in was refused (null once one is accepted).', properties: {skew_s: {type: [integer, 'null']}, measured_at: {type: [string, 'null'], format: date-time}, agent_offset_s: {type: [integer, 'null']}, last_reject: {type: [object, 'null'], properties: {reason: {type: string}, at: {type: [string, 'null'], format: date-time}}}}}
            match_reason: {type: string, description: 'no_match, hostname_only, ambiguous, scope_mismatch, asset_already_linked, asset_retired, matched_serial, matched_mac, ...'}
            mesh_mapped: {type: boolean}
            mesh_agent:
              type: object
              description: 'Additive (1.0.0-rc.12), present only once the device has reported a MeshCentral agent. `map_state`: mapped, conflict (the node is already mapped to another live device, nothing was moved) or kept_manual (a different node was mapped by hand and the overwrite switch is off); `conflict_device_id` only when the other device belongs to the same client.'
              properties:
                installed: {type: boolean}
                version: {type: [string, 'null']}
                node_id: {type: [string, 'null']}
                error: {type: [string, 'null']}
                map_state: {type: [string, 'null'], enum: [mapped, conflict, kept_manual, null]}
                conflict_device_id: {type: [integer, 'null']}
                first_installed_at: {type: [string, 'null'], format: date-time}
                reported_at: {type: [string, 'null'], format: date-time}
            checks:
              type: array
              items:
                type: object
                properties:
                  key: {type: string}
                  status: {type: string}
                  detail: {type: string}
                  consecutive_failures: {type: integer}
                  last_reported_at: {type: [string, 'null'], format: date-time}
            jobs:
              type: array
              items: {$ref: '#/components/schemas/DeviceJob'}
    DeviceJob:
      type: object
      properties:
        job_id: {type: string, format: uuid}
        type: {type: string}
        state: {type: string, enum: [queued, running, succeeded, failed, timed_out, cancelled, expired]}
        reason: {type: [string, 'null']}
        attempt: {type: integer}
        destructive: {type: boolean}
        run_as: {type: string}
        timeout_s: {type: integer}
        exit_code: {type: [integer, 'null']}
        created_by: {type: integer}
        created_at: {type: string, format: date-time}
        started_at: {type: [string, 'null'], format: date-time}
        finished_at: {type: [string, 'null'], format: date-time}
        expires_at: {type: string, format: date-time}
        output: {type: [string, 'null'], description: 'Present only with rmm.job.run_saved; credential-shaped text is redacted'}
        output_truncated: {type: boolean}
    JobRequest:
      type: object
      required: [type]
      properties:
        type: {type: string, description: 'powershell, shell, python, reboot or collect. Not needed with `library_script_id` (the script''s language decides)'}
        script: {type: string, description: 'Free-form script text, at most 102400 bytes'}
        script_id: {type: integer, description: 'A saved PowerShell script of the edition''s own script library; wins over `script`'}
        library_script_id: {type: integer, description: 'Phase 2. A script of Core''s library (`/endpoint_devices/scripts`); `params` are checked against its definition and may hold `{{field.name}}` placeholders. Answers 202 `pending_approval` when the script requires approval'}
        script_version: {type: integer, description: 'Phase 2. With `library_script_id`: a version other than the current one'}
        params: {type: object, description: 'At most 20 scalar values (short strings, whole numbers, booleans)'}
        timeout_s: {type: integer}
        destructive: {type: boolean}
        confirm: {type: boolean, description: 'Required for reboot and every destructive job'}
    PendingApproval:
      type: object
      required: [state, approval_id]
      properties:
        state: {type: string, const: pending_approval}
        approval_id: {type: integer}
        device_count: {type: integer}
    EffectivePolicy:
      type: object
      properties:
        applied: {type: boolean}
        version: {type: string, pattern: '^[0-9a-f]{64}$'}
        check_in_interval_s: {type: integer}
        collect_interval_s: {type: integer}
        features: {type: object}
        ring: {type: [string, 'null']}
        checks: {type: array, items: {type: object, properties: {key: {type: string}, type: {type: string}, params: {type: object}, interval_s: {type: integer}, from: {type: [object, 'null']}}}}
        sources: {type: object, description: 'Setting key to {mode, assignment_id, policy_id, scope_type, enforced}'}
        layers: {type: array, items: {type: object, properties: {assignment_id: {type: integer}, policy_id: {type: integer}, policy: {type: string}, scope_type: {type: string}, priority: {type: integer}, enforce: {type: boolean}}}}
    Policy:
      type: object
      properties:
        policy_id: {type: integer}
        name: {type: string}
        description: {type: string}
        version: {type: integer}
        enabled: {type: boolean}
        settings: {type: object}
        assignments: {type: integer}
        updated_at: {type: string, format: date-time}
    PolicyInput:
      type: object
      properties:
        name: {type: string, maxLength: 100}
        description: {type: string, maxLength: 300}
        enabled: {type: boolean}
        settings: {type: object}
    PolicyAssignment:
      type: object
      properties:
        assignment_id: {type: integer}
        policy_id: {type: integer}
        scope_type: {type: string, enum: [global, client, site, group, tag, device]}
        scope_id: {type: integer}
        priority: {type: integer}
        enforce: {type: boolean}
        overrides: {type: object}
    ParamDef:
      type: object
      required: [name, type]
      properties:
        name: {type: string, pattern: '^[a-z][a-z0-9_]{0,31}$', description: 'Not a reserved word or an automatic variable of bash, PowerShell or Python'}
        type: {type: string, enum: [string, int, bool, choice, secret]}
        required: {type: boolean}
        default: {}
        label: {type: string}
        description: {type: string}
        choices: {type: array, items: {type: string}}
        max_length: {type: integer, minimum: 1, maximum: 1024}
        min: {type: integer}
        max: {type: integer}
    LibraryScriptInput:
      type: object
      properties:
        name: {type: string, maxLength: 100}
        description: {type: string, maxLength: 500}
        language: {type: string, enum: [powershell, bash, python], description: 'Fixed at creation'}
        body: {type: string}
        params: {type: array, items: {$ref: '#/components/schemas/ParamDef'}, maxItems: 20}
        tags: {type: array, items: {type: string}, maxItems: 10}
        requires_approval: {type: boolean}
        destructive: {type: boolean}
        timeout_s: {type: integer}
        note: {type: string, maxLength: 200}
    ScriptVersion:
      type: object
      properties:
        version: {type: integer}
        body_sha256: {type: string}
        params: {type: array, items: {$ref: '#/components/schemas/ParamDef'}}
        signing_key_id: {type: string}
        note: {type: string}
        created_by: {type: integer}
        created_at: {type: string, format: date-time}
        size_bytes: {type: integer}
        body: {type: string, description: 'Only where the caller may read the text'}
    LibraryScript:
      type: object
      properties:
        script_id: {type: integer}
        name: {type: string}
        description: {type: string}
        language: {type: string}
        platform: {type: string, enum: [windows, linux]}
        tags: {type: array, items: {type: string}}
        owner_id: {type: integer}
        requires_approval: {type: boolean}
        destructive: {type: boolean}
        timeout_s: {type: integer}
        current_version: {type: integer}
        retired: {type: boolean}
        current: {$ref: '#/components/schemas/ScriptVersion'}
    RunRequest:
      type: object
      required: [library_script_id, target]
      properties:
        library_script_id: {type: integer}
        script_version: {type: integer}
        target:
          type: object
          required: [type]
          properties:
            type: {type: string, enum: [device, tag, group, client, site, policy, all]}
            id: {type: integer}
        params: {type: object}
        timeout_s: {type: integer}
        confirm: {type: boolean}
    Approval:
      type: object
      properties:
        approval_id: {type: integer}
        kind: {type: string, enum: [run, schedule]}
        state: {type: string, enum: [pending_approval, approved, rejected, cancelled, expired]}
        summary: {type: string}
        device_count: {type: integer}
        script_id: {type: [integer, 'null']}
        script_version: {type: [integer, 'null']}
        requested_by: {type: integer}
        requested_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        decided_by: {type: [integer, 'null']}
        decided_at: {type: [string, 'null'], format: date-time}
        decision_note: {type: string}
        result: {type: [object, 'null']}
    ScheduleInput:
      type: object
      properties:
        name: {type: string, maxLength: 100}
        library_script_id: {type: integer}
        script_version: {type: integer, description: 'Pinned; default the current version'}
        params: {type: object}
        target: {type: object, properties: {type: {type: string, enum: [device, tag, group, client, site, policy, all]}, id: {type: integer}}}
        kind: {type: string, enum: [interval, cron]}
        interval_s: {type: integer, minimum: 60, maximum: 2592000}
        cron: {type: string, description: 'Five fields in UTC: minute hour day-of-month month day-of-week'}
        start_in_s: {type: integer, description: 'Interval schedules: seconds until the first run (default one interval)'}
        jitter_s: {type: integer, minimum: 0, maximum: 3600}
        overlap: {type: string, enum: [skip, queue]}
        expires_s: {type: integer, minimum: 60, maximum: 604800, description: 'How long a queued job may wait for an offline device'}
        timeout_s: {type: integer}
        enabled: {type: boolean}
        confirm: {type: boolean, description: 'Required for a destructive script'}
    Schedule:
      type: object
      properties:
        schedule_id: {type: integer}
        name: {type: string}
        script_id: {type: integer}
        script_name: {type: string}
        script_version: {type: integer}
        body_sha256: {type: string}
        params: {type: object}
        target: {type: object}
        kind: {type: string}
        interval_s: {type: [integer, 'null']}
        cron: {type: string}
        jitter_s: {type: integer}
        overlap: {type: string}
        expires_s: {type: integer}
        timeout_s: {type: integer}
        enabled: {type: boolean}
        approval_id: {type: [integer, 'null']}
        approved: {type: boolean}
        next_run_at: {type: [string, 'null'], format: date-time}
        last_run_at: {type: [string, 'null'], format: date-time}
    CustomFieldInput:
      type: object
      properties:
        name: {type: string, pattern: '^[a-z][a-z0-9_]{0,39}$'}
        label: {type: string, maxLength: 100}
        scope: {type: string, enum: [client, site, device]}
        type: {type: string, enum: [text, number, bool, date, list, secret]}
        options: {type: array, items: {type: string}, description: 'list only'}
        default: {description: 'Not for a secret'}
        description: {type: string, maxLength: 300}
    CustomField:
      type: object
      properties:
        field_id: {type: integer}
        name: {type: string}
        label: {type: string}
        scope: {type: string}
        type: {type: string}
        options: {type: array, items: {type: string}}
        default: {}
        description: {type: string}
        values: {type: integer, description: 'How many values are stored'}
    FieldValue:
      type: object
      properties:
        scope: {type: string, enum: [client, site, device]}
        scope_id: {type: integer}
        field_id: {type: integer}
        name: {type: string}
        label: {type: string}
        type: {type: string}
        set: {type: boolean}
        value: {description: 'A secret is always ********'}
        default: {}
        updated_at: {type: [string, 'null'], format: date-time}
    SoftwareItem:
      type: object
      properties:
        name: {type: string}
        version: {type: string}
        publisher: {type: [string, 'null']}
        source: {type: string, enum: [registry, registry32, appx, dpkg, rpm, snap, flatpak]}
        installed_on: {type: [string, 'null'], format: date}
        first_seen_at: {type: string, format: date-time}
        last_seen_at: {type: string, format: date-time}
        removed_at: {type: [string, 'null'], format: date-time}
    SoftwareState:
      type: object
      properties:
        reported: {type: boolean}
        count: {type: integer}
        reported_at: {type: [string, 'null'], format: date-time}
        full_at: {type: [string, 'null'], format: date-time}
        resync_requested: {type: boolean}
        capable: {type: boolean, description: The device announced `software_inventory`}
    SoftwareChange:
      type: object
      properties:
        name: {type: string}
        source: {type: string}
        change: {type: string, enum: [installed, upgraded, downgraded, removed]}
        old_version: {type: [string, 'null']}
        new_version: {type: [string, 'null']}
        publisher: {type: [string, 'null']}
        at: {type: string, format: date-time}
    Tag:
      type: object
      properties:
        tag_id: {type: integer}
        name: {type: string}
        color: {type: string}
        description: {type: string}
        device_count: {type: integer, description: Only in the tag list}
    DeviceTag:
      allOf:
        - {$ref: '#/components/schemas/Tag'}
        - type: object
          properties:
            source: {type: string, enum: [manual, auto]}
    Group:
      type: object
      properties:
        group_id: {type: integer}
        name: {type: string}
        description: {type: string}
        tags: {type: array, items: {type: object, properties: {tag_id: {type: integer}, name: {type: string}}}}
        device_count: {type: integer}
    NetworkSide:
      type: object
      properties:
        current: {type: [number, 'null'], description: Bytes per second, the last reading}
        peak: {type: [number, 'null']}
        avg: {type: [number, 'null']}
        peak_at: {type: [string, 'null'], format: date-time}
    DeviceLive:
      type: object
      properties:
        v: {type: integer, const: 1}
        state: {type: string, enum: [online, offline, stale, never]}
        last_checkin_at: {type: [string, 'null'], format: date-time}
        age_s: {type: [integer, 'null']}
        next_check_in_s: {type: integer}
        agent_version: {type: string}
        uptime_s: {type: [integer, 'null']}
        pending_reboot: {type: [boolean, 'null']}
        gauges:
          type: object
          properties:
            sampled_at: {type: [string, 'null'], format: date-time}
            cpu_pct: {type: [number, 'null']}
            mem_pct: {type: [number, 'null']}
            disks:
              type: array
              items:
                type: object
                properties:
                  mount: {type: string}
                  used_pct: {type: [number, 'null']}
                  free_bytes: {type: [integer, 'null']}
                  total_bytes: {type: [integer, 'null']}
            net_rx_bps: {type: [number, 'null']}
            net_tx_bps: {type: [number, 'null']}
        checks:
          type: array
          items:
            type: object
            properties:
              key: {type: string}
              status: {type: string}
              detail: {type: string}
              since: {type: [string, 'null'], format: date-time}
              alert_id: {type: [integer, 'null']}
        alerts:
          type: object
          properties:
            open: {type: integer}
            worst: {type: [string, 'null'], enum: [warning, error, null]}
        jobs:
          type: object
          properties: {queued: {type: integer}, running: {type: integer}}
        poll_s: {type: integer}
        shed: {type: integer}
        seq: {type: integer}
    Thresholds:
      type: object
      description: 'Whole numbers only (the signed check refuses decimals). A tier whose limit is missing never triggers. `hysteresis` keeps a tier until the value is that far back; `for_samples` and `for_minutes` delay RAISING a tier (both must hold); lowering is immediate. With a duration set the alert opens when the tier is reached, replacing the failure debounce.'
      properties:
        warn: {$ref: '#/components/schemas/ThresholdLimit'}
        crit: {$ref: '#/components/schemas/ThresholdLimit'}
        hysteresis: {type: integer, minimum: 0, maximum: 1000, default: 0}
        for_samples: {type: integer, minimum: 1, maximum: 100, default: 1}
        for_minutes: {type: integer, minimum: 0, maximum: 1440, default: 0}
    ThresholdLimit:
      type: object
      required: [op, value]
      properties:
        op: {type: string, enum: [gt, gte, lt, lte]}
        value: {type: integer}
    Alert:
      type: object
      properties:
        alert_id: {type: integer}
        device_id: {type: integer}
        hostname: {type: string}
        asset_id: {type: [integer, 'null']}
        client_id: {type: integer}
        check_key: {type: string}
        episode: {type: integer}
        group_key: {type: string}
        severity: {type: string, enum: [warn, crit]}
        state: {type: string, enum: [open, acknowledged, resolved]}
        message: {type: string}
        opened_at: {type: string, format: date-time}
        acknowledged_by: {type: [integer, 'null']}
        acknowledged_at: {type: [string, 'null'], format: date-time}
        resolved_at: {type: [string, 'null'], format: date-time}
        resolved_by: {type: [integer, 'null']}
        resolve_reason: {type: [string, 'null'], enum: [recovered, manual, device_retired, null]}
        policy_id: {type: [integer, 'null']}
        escalation_step: {type: integer}
        notices_sent: {type: integer}
        next_escalation_at: {type: [string, 'null'], format: date-time}
        last_notified_at: {type: [string, 'null'], format: date-time}
    MaintenanceWindowInput:
      type: object
      required: [name]
      properties:
        name: {type: string, maxLength: 100}
        enabled: {type: boolean, default: true}
        mode: {type: string, enum: [mute, suppress], default: mute}
        scope_type: {type: string, enum: [all, client, site, group, tag, device], default: all}
        scope_id: {type: integer}
        timezone: {type: string, default: UTC, description: IANA name}
        kind: {type: string, enum: [once, recurring], default: once}
        starts_at: {type: string, description: 'RFC 3339, or YYYY-MM-DD HH:MM in `timezone` (once)'}
        ends_at: {type: string}
        recur_freq: {type: string, enum: [daily, weekly, monthly]}
        recur_interval: {type: integer, minimum: 1, maximum: 52, default: 1}
        recur_days: {type: string, description: 'weekly: ISO weekdays "1,3,5"; monthly: day numbers and/or "last", e.g. "1,15,last"'}
        local_start: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'}
        duration_min: {type: integer, minimum: 1, maximum: 10080}
        recur_from: {type: string, format: date}
        recur_until: {type: string, format: date}
        note: {type: string, maxLength: 300}
    MaintenanceWindow:
      type: object
      properties:
        window_id: {type: integer}
        name: {type: string}
        enabled: {type: boolean}
        mode: {type: string, enum: [mute, suppress]}
        scope_type: {type: string}
        scope_id: {type: integer}
        kind: {type: string}
        timezone: {type: string}
        starts_at: {type: [string, 'null'], format: date-time}
        ends_at: {type: [string, 'null'], format: date-time}
        recur_freq: {type: [string, 'null']}
        recur_interval: {type: integer}
        recur_days: {type: string}
        local_start: {type: string}
        duration_min: {type: integer}
        recur_from: {type: [string, 'null']}
        recur_until: {type: [string, 'null']}
        note: {type: string}
        active_now: {type: boolean}
        current_ends_at: {type: [string, 'null'], format: date-time}
        next_starts_at: {type: [string, 'null'], format: date-time}
        created_by: {type: integer}
        created_at: {type: string, format: date-time}
    EscalationPolicyInput:
      type: object
      required: [name, steps]
      properties:
        name: {type: string, maxLength: 100}
        enabled: {type: boolean, default: true}
        scope_type: {type: string, enum: [all, client, site, group, tag, device], default: all}
        scope_id: {type: integer}
        min_severity: {type: string, enum: [warn, crit], default: warn}
        repeat_every_min: {type: integer, description: '0 = no repeat, else 5 to 10080'}
        repeat_max: {type: integer, minimum: 0, maximum: 1000, description: '0 = until acknowledged or resolved'}
        steps:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            required: [after_min, targets]
            properties:
              after_min: {type: integer, minimum: 0, maximum: 10080, description: Minutes after the alert opened; not earlier than the step before}
              targets:
                type: array
                minItems: 1
                maxItems: 10
                items:
                  type: object
                  required: [type, ref]
                  properties:
                    type: {type: string, enum: [user, group, email, chat, webhook]}
                    ref: {type: string, maxLength: 200}
    EscalationPolicy:
      type: object
      properties:
        policy_id: {type: integer}
        name: {type: string}
        enabled: {type: boolean}
        scope_type: {type: string}
        scope_id: {type: integer}
        min_severity: {type: string, enum: [warn, crit]}
        repeat_every_min: {type: integer}
        repeat_max: {type: integer}
        created_at: {type: string, format: date-time}
        steps:
          type: array
          items:
            type: object
            properties:
              step: {type: integer}
              after_min: {type: integer}
              targets: {type: array, items: {type: object, properties: {type: {type: string}, ref: {type: string}}}}
    AlertingSettings:
      type: object
      properties:
        alerting_enabled: {type: boolean}
        storm:
          type: object
          properties:
            storm_global_max: {type: integer}
            storm_global_window_s: {type: integer}
            storm_client_max: {type: integer}
            storm_client_window_s: {type: integer}
    StarterSelection:
      type: object
      description: Which items. Unknown members are refused. A `risk` or `tags` filter is about scripts, so policies are then left out unless `kinds` or `ids` ask for them.
      properties:
        pack: {type: string, example: rivet-core-starter}
        ids: {type: array, maxItems: 500, items: {type: string}, description: 'Item ids, for example win-flush-dns or policy-linux-server'}
        tags: {type: array, items: {type: string}}
        platform: {type: string, enum: [windows, linux]}
        risk: {type: array, items: {type: string, enum: [read_only, changes_system, disruptive]}}
        kinds: {type: array, items: {type: string, enum: [scripts, policies]}}
        params:
          type: object
          description: Values for the parameters of the policy drafts (backup_service, ntp_server, ssh_service, cert_paths, uptime_warn_days, uptime_fail_days). An empty optional parameter leaves its check out.
          additionalProperties: true
        policy_params:
          type: object
          description: The same, per policy id; wins over `params`.
          additionalProperties: {type: object, additionalProperties: true}
        q: {type: string}
    StarterItem:
      type: object
      properties:
        kind: {type: string, enum: [script, policy]}
        pack: {type: string}
        pack_version: {type: string}
        id: {type: string}
        name: {type: string}
        platform: {type: string, enum: [windows, linux]}
        risk: {type: [string, 'null'], enum: [read_only, changes_system, disruptive, null]}
        action: {type: string, enum: [add, update, stage, unchanged, skip, blocked]}
        reason: {type: string}
        script_id: {type: [integer, 'null']}
        policy_id: {type: [integer, 'null']}
        omitted: {type: array, items: {type: string}, description: Policy checks left out because their optional parameter is empty}
        outcome: {type: string, description: Only in an install or uninstall answer}
        message: {type: string}
    StarterPlan:
      type: object
      properties:
        ready: {type: boolean, description: False without an instance signing key (scripts are blocked)}
        blocker: {type: [string, 'null']}
        items: {type: array, items: {$ref: '#/components/schemas/StarterItem'}}
        counts: {type: object, additionalProperties: {type: integer}}
    StarterResult:
      type: object
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/StarterItem'}}
        counts: {type: object, additionalProperties: {type: integer}}
    StarterCatalog:
      type: object
      properties:
        ready: {type: boolean}
        blocker: {type: [string, 'null']}
        totals: {type: object, properties: {scripts: {type: integer}, installed: {type: integer}, policies: {type: integer}}}
        packs:
          type: array
          items:
            type: object
            properties:
              pack:
                type: object
                properties:
                  id: {type: string}
                  name: {type: string}
                  version: {type: string}
                  description: {type: string}
                  pack_sha256: {type: string}
              counts: {type: object, additionalProperties: {type: integer}}
              scripts:
                type: array
                items:
                  type: object
                  properties:
                    id: {type: string}
                    name: {type: string}
                    description: {type: string}
                    platform: {type: string, enum: [windows, linux]}
                    language: {type: string, enum: [powershell, bash]}
                    risk: {type: string, enum: [read_only, changes_system, disruptive]}
                    requires_approval: {type: boolean}
                    destructive: {type: boolean}
                    tags: {type: array, items: {type: string}}
                    timeout_s: {type: integer}
                    params: {type: array, items: {type: object, additionalProperties: true}}
                    output: {type: string}
                    size_bytes: {type: integer}
                    content_hash: {type: string}
                    state: {type: string, enum: [not_installed, current, update_available, modified, update_staged, retired]}
                    script_id: {type: [integer, 'null']}
                    installed_version: {type: [integer, 'null']}
              check_sets: {type: array, items: {type: object, additionalProperties: true}}
              policies: {type: array, items: {type: object, additionalProperties: true}}
